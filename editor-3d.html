<script type="text/babel" data-presets="react">
const { useEffect, useRef, useState, useCallback } = React;
const THREE = window.THREE;

// ============================================================================
// CONSTANTES
// ============================================================================
const SELMODE = { VERTEX: "vertex", EDGE: "edge", FACE: "face", MESH: "mesh" };
const TOOL = { MOVE: "move", ROTATE: "rotate", SCALE: "scale", SCALE_DIR: "scaledir", EXTRUDE: "extrude", BEVEL: "bevel", CUT: "cut", ARC: "arc" };
const GRID_SIZES = [0.01, 0.05, 0.1, 0.25, 0.5, 1];
const ANGLE_SNAPS = [1, 5, 15];
const DRAG_THRESHOLD_PX = 5; // distância mínima do mouse antes de um clique virar um arraste real
const ACCENT = 0xf5a623;
const AXIS_COLORS = { x: 0xe74c3c, y: 0x2ecc71, z: 0x4d94ff };
// cores de estado para vértice/aresta/face: padrão azul, mouse em cima verde, selecionado amarelo
// (face usa um verde/laranja mais claros só no preenchimento — sem ícones de vértice)
const SEL_COLORS = {
  vertexDefault: 0x2f7bf5,
  vertexHover: 0x22c55e,
  vertexSelected: 0xffd400,
  edgeDefault: 0x2f7bf5,
  edgeHover: 0x22c55e,
  edgeSelected: 0xffd400,
  faceHoverFill: 0x86efac,
  faceSelectedFill: 0xffb366,
};
const VIEWPORT_LAYOUT = [
  { id: "persp", label: "Perspectiva (RMB: voar)", rect: { left: "0%", top: "0%", width: "50%", height: "50%" } },
  { id: "top", label: "Superior — Top (X/Z)", rect: { left: "50%", top: "0%", width: "50%", height: "50%" } },
  { id: "front", label: "Frente — Front (X/Y)", rect: { left: "0%", top: "50%", width: "50%", height: "50%" } },
  { id: "side", label: "Lado — Side (Z/Y)", rect: { left: "50%", top: "50%", width: "50%", height: "50%" } },
];

// ============================================================================
// MATEMÁTICA / UTILITÁRIOS DE MALHA
// meshData = { vertices: THREE.Vector3[], faces: number[][] }
// ============================================================================
function computeFaceNormal(vertices, face) {
  const n = new THREE.Vector3();
  for (let i = 0; i < face.length; i++) {
    const curr = vertices[face[i]];
    const next = vertices[face[(i + 1) % face.length]];
    n.x += (curr.y - next.y) * (curr.z + next.z);
    n.y += (curr.z - next.z) * (curr.x + next.x);
    n.z += (curr.x - next.x) * (curr.y + next.y);
  }
  if (n.lengthSq() < 1e-10) return new THREE.Vector3(0, 1, 0);
  // a ordem dos vértices usada pelas primitivas (makeBox etc.) dá, com a fórmula de
  // Newell acima, um vetor apontando para DENTRO do sólido — invertido aqui uma vez,
  // na fonte, pra todo o resto do código (bisel, extrude, arco) poder tratar isso como
  // a normal "pra fora" de verdade, sem ter que lembrar de inverter em cada lugar
  return n.normalize().negate();
}

// dado um vetor qualquer (ex: direção "direita"/"cima" da câmera atual), devolve o
// eixo do mundo (±X, ±Y ou ±Z) mais próximo dele — usado pelas setas do teclado pra
// mover/extrudar sempre travado num eixo só, não importa o ângulo da câmera
const WORLD_AXES = [
  new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0),
  new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1, 0),
  new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1),
];
function snapToNearestAxis(vec) {
  let best = WORLD_AXES[0], bestDot = -Infinity;
  WORLD_AXES.forEach((ax) => {
    const d = ax.dot(vec);
    if (d > bestDot) { bestDot = d; best = ax; }
  });
  return best.clone();
}

function faceCentroid(vertices, face) {
  const c = new THREE.Vector3();
  face.forEach((vi) => c.add(vertices[vi]));
  return c.divideScalar(face.length);
}

function meshCentroid(meshData) {
  const c = meshData.vertices.reduce((acc, v) => acc.add(v), new THREE.Vector3());
  return c.divideScalar(meshData.vertices.length || 1);
}

function rotateVerticesAroundAxis(vertices, indices, pivot, axis, angleRad) {
  indices.forEach((vi) => {
    const v = vertices[vi];
    v.sub(pivot).applyAxisAngle(axis, angleRad).add(pivot);
  });
}

// ajusta o CENTRO do conjunto de vértices à grade e translada todos pela mesma
// correção — preserva a forma/rotação relativa (encaixar cada vértice de forma
// independente distorce qualquer geometria que não esteja alinhada aos eixos,
// por exemplo um cilindro girado).
function snapVerticesRigidly(vertices, indices, gridSize) {
  const pivot = indices.reduce((acc, vi) => acc.add(vertices[vi]), new THREE.Vector3()).divideScalar(indices.length || 1);
  const snapped = new THREE.Vector3(
    Math.round(pivot.x / gridSize) * gridSize,
    Math.round(pivot.y / gridSize) * gridSize,
    Math.round(pivot.z / gridSize) * gridSize
  );
  const correction = snapped.sub(pivot);
  indices.forEach((vi) => vertices[vi].add(correction));
}

// como snapVerticesRigidly, mas só ajusta a componente ao longo de UM eixo —
// usado no arraste travado por eixo do gizmo, para não "puxar" os outros dois
// eixos para a grade quando eles nunca fizeram parte do movimento.
function snapVerticesAlongAxis(vertices, indices, axis, gridSize) {
  const pivot = indices.reduce((acc, vi) => acc.add(vertices[vi]), new THREE.Vector3()).divideScalar(indices.length || 1);
  const comp = pivot.dot(axis);
  const snappedComp = Math.round(comp / gridSize) * gridSize;
  const correction = axis.clone().multiplyScalar(snappedComp - comp);
  indices.forEach((vi) => vertices[vi].add(correction));
}

// encaixa a componente-eixo de CADA vértice individualmente na grade — usado durante
// uma escala, onde cada vértice termina numa posição diferente ao longo do eixo
// (diferente do arraste rígido, que translada tudo pela mesma correção).
function snapAxisComponentPerVertex(vertices, indices, axis, gridSize) {
  indices.forEach((vi) => {
    const v = vertices[vi];
    const comp = v.dot(axis);
    const snapped = Math.round(comp / gridSize) * gridSize;
    v.addScaledVector(axis, snapped - comp);
  });
}

// devolve todos os índices de vértice afetados por uma seleção, qualquer que seja o tipo
function selectionVertexIndices(meshData, sel) {
  if (!sel) return [];
  if (sel.type === "vertex") return sel.indices;
  if (sel.type === "edge") { const s = new Set(); sel.pairs.forEach(([a, b]) => { s.add(a); s.add(b); }); return Array.from(s); }
  if (sel.type === "face") { const s = new Set(); sel.indices.forEach((fi) => { const f = meshData.faces[fi]; if (f) f.forEach((vi) => s.add(vi)); }); return Array.from(s); }
  if (sel.type === "mesh") return meshData.vertices.map((_, i) => i);
  return [];
}

// grafo de adjacência entre faces (duas faces são vizinhas se compartilham uma aresta)
function buildFaceAdjacency(meshData) {
  const edgeToFaces = new Map();
  meshData.faces.forEach((face, fi) => {
    const n = face.length;
    for (let i = 0; i < n; i++) {
      const a = face[i], b = face[(i + 1) % n];
      const key = a < b ? a + "_" + b : b + "_" + a;
      if (!edgeToFaces.has(key)) edgeToFaces.set(key, []);
      edgeToFaces.get(key).push(fi);
    }
  });
  const adj = new Map();
  meshData.faces.forEach((_, fi) => adj.set(fi, new Set()));
  edgeToFaces.forEach((faceList) => {
    faceList.forEach((fi) => faceList.forEach((fj) => { if (fi !== fj) adj.get(fi).add(fj); }));
  });
  return adj;
}

function connectedFaces(meshData, startFace) {
  const adj = buildFaceAdjacency(meshData);
  const visited = new Set([startFace]);
  const queue = [startFace];
  while (queue.length) {
    const f = queue.shift();
    (adj.get(f) || new Set()).forEach((n) => { if (!visited.has(n)) { visited.add(n); queue.push(n); } });
  }
  return Array.from(visited);
}

function shortestFacePath(adj, start, end) {
  if (start === end) return [start];
  const visited = new Set([start]);
  const parent = new Map();
  const queue = [start];
  while (queue.length) {
    const f = queue.shift();
    if (f === end) break;
    (adj.get(f) || new Set()).forEach((n) => { if (!visited.has(n)) { visited.add(n); parent.set(n, f); queue.push(n); } });
  }
  if (!visited.has(end)) return null;
  const path = [end];
  let cur = end;
  while (cur !== start) { cur = parent.get(cur); path.push(cur); }
  return path.reverse();
}

// grafo de adjacência entre vértices (via arestas únicas da malha)
function buildVertexAdjacency(meshData) {
  const edges = getUniqueEdges(meshData);
  const adj = new Map();
  edges.forEach(([a, b]) => {
    if (!adj.has(a)) adj.set(a, []);
    if (!adj.has(b)) adj.set(b, []);
    adj.get(a).push(b);
    adj.get(b).push(a);
  });
  return adj;
}

function shortestVertexPath(adj, start, end) {
  if (start === end) return [start];
  const visited = new Set([start]);
  const parent = new Map();
  const queue = [start];
  while (queue.length) {
    const v = queue.shift();
    if (v === end) break;
    (adj.get(v) || []).forEach((n) => { if (!visited.has(n)) { visited.add(n); parent.set(n, v); queue.push(n); } });
  }
  if (!visited.has(end)) return null;
  const path = [end];
  let cur = end;
  while (cur !== start) { cur = parent.get(cur); path.push(cur); }
  return path.reverse();
}

// agrupa os vizinhos de um vértice em "eixos" — vizinhos em direções opostas (ex.: +X e
// -X) contam como o MESMO eixo, já que o loop passa reto por esse vértice nos dois
// sentidos. Usado pelo duplo-clique em vértice/aresta: cada eixo é um candidato de loop
function computeVertexAxes(meshData, adj, vertexIndex) {
  const origin = meshData.vertices[vertexIndex];
  const neighbors = adj.get(vertexIndex) || [];
  const axes = [];
  neighbors.forEach((ni) => {
    const dir = meshData.vertices[ni].clone().sub(origin);
    if (dir.lengthSq() < 1e-10) return;
    dir.normalize();
    const found = axes.find((ax) => Math.abs(ax.dot(dir)) > 0.98);
    if (!found) axes.push(dir);
  });
  return axes;
}

// anda a partir de um vértice, nos dois sentidos de uma direção, seguindo sempre o
// vizinho mais colinear com a direção atual — monta a cadeia (loop reto) naquele eixo
function walkAxisLoop(meshData, adj, startVertex, axisDir) {
  const visited = new Set([startVertex]);
  function walkOneSide(dir) {
    const chain = [];
    let current = startVertex, curDir = dir;
    while (true) {
      const neighbors = adj.get(current) || [];
      let best = null, bestDot = 0.7;
      neighbors.forEach((ni) => {
        if (visited.has(ni)) return;
        const d = meshData.vertices[ni].clone().sub(meshData.vertices[current]);
        if (d.lengthSq() < 1e-10) return;
        d.normalize();
        const dot = d.dot(curDir);
        if (dot > bestDot) { bestDot = dot; best = ni; }
      });
      if (best == null) break;
      chain.push(best);
      visited.add(best);
      curDir = meshData.vertices[best].clone().sub(meshData.vertices[current]).normalize();
      current = best;
    }
    return chain;
  }
  const forward = walkOneSide(axisDir);
  const backward = walkOneSide(axisDir.clone().negate());
  return [...backward.reverse(), startVertex, ...forward];
}

// visual estilo CS2 Hammer para arestas selecionadas: cilindro grosso (visível de
// qualquer distância, ao contrário de uma THREE.Line fina) + riscos perpendiculares
// (hachura) nas arestas "abertas" (usadas por só 1 face — indicam um furo/borda).
function buildEdgeSelectionMesh(meshData, pairs, color) {
  const group = new THREE.Group();
  const edgeFaceCount = new Map();
  meshData.faces.forEach((face) => {
    const n = face.length;
    for (let i = 0; i < n; i++) {
      const a = face[i], b = face[(i + 1) % n];
      const key = a < b ? a + "_" + b : b + "_" + a;
      edgeFaceCount.set(key, (edgeFaceCount.get(key) || 0) + 1);
    }
  });
  const mat = new THREE.MeshBasicMaterial({ color, depthTest: false });
  const tickMat = new THREE.LineBasicMaterial({ color, depthTest: false });
  pairs.forEach(([a, b]) => {
    const va = meshData.vertices[a], vb = meshData.vertices[b];
    if (!va || !vb) return;
    const dir = vb.clone().sub(va);
    const len = dir.length();
    if (len < 1e-6) return;
    dir.normalize();
    const mid = va.clone().add(vb).multiplyScalar(0.5);
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, len, 6), mat);
    cyl.position.copy(mid);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    cyl.renderOrder = 20;
    group.add(cyl);

    const key = a < b ? a + "_" + b : b + "_" + a;
    const isOpen = (edgeFaceCount.get(key) || 0) <= 1;
    if (isOpen) {
      let normal = new THREE.Vector3(0, 1, 0);
      for (const face of meshData.faces) {
        if (face.includes(a) && face.includes(b)) { normal = computeFaceNormal(meshData.vertices, face); break; }
      }
      let perp = new THREE.Vector3().crossVectors(normal, dir);
      if (perp.lengthSq() < 1e-8) perp = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), dir);
      perp.normalize();
      const tickCount = Math.max(2, Math.round(len / 0.09));
      const tickLen = Math.min(0.06, len * 0.4);
      const positions = [];
      for (let i = 1; i < tickCount; i++) {
        const t = i / tickCount;
        const base = va.clone().lerp(vb, t);
        const p1 = base.clone().addScaledVector(perp, tickLen / 2);
        const p2 = base.clone().addScaledVector(perp, -tickLen / 2);
        positions.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
      }
      if (positions.length) {
        const tickGeo = new THREE.BufferGeometry();
        tickGeo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        const ticks = new THREE.LineSegments(tickGeo, tickMat);
        ticks.renderOrder = 21;
        group.add(ticks);
      }
    }
  });
  return group;
}

// bolinhas de destaque num conjunto de vértices (halo escuro + núcleo colorido por cima,
// pra aparecer bem contra qualquer fundo) — usado tanto pra seleção quanto pra hover
function buildVertexMarkerGroup(meshData, indices, color, radius = 0.035) {
  const group = new THREE.Group();
  indices.forEach((vi) => {
    const v = meshData.vertices[vi];
    if (!v) return;
    const halo = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.35, 12, 10), new THREE.MeshBasicMaterial({ color: 0x1a1208, depthTest: false }));
    halo.position.copy(v);
    halo.renderOrder = 19;
    group.add(halo);
    const marker = new THREE.Mesh(new THREE.SphereGeometry(radius, 12, 10), new THREE.MeshBasicMaterial({ color, depthTest: false }));
    marker.position.copy(v);
    marker.renderOrder = 20;
    group.add(marker);
  });
  return group;
}

function triangulateFace(face) {
  const tris = [];
  for (let i = 1; i < face.length - 1; i++) tris.push([face[0], face[i], face[i + 1]]);
  return tris;
}

function cloneMeshData(meshData) {
  return { vertices: meshData.vertices.map((v) => v.clone()), faces: meshData.faces.map((f) => f.slice()) };
}

// junta a malha de origem (coordenadas já em espaço do mundo) dentro da malha de
// destino, deslocando os índices de vértice — as duas ficam como um objeto só, sem
// nenhuma aresta/face nova conectando as duas partes (útil pra tratar vários pedaços
// como um único objeto na cena, mesmo que continuem fisicamente separados)
function mergeMeshDataInto(targetMeshData, sourceMeshData) {
  const offset = targetMeshData.vertices.length;
  sourceMeshData.vertices.forEach((v) => targetMeshData.vertices.push(v.clone()));
  sourceMeshData.faces.forEach((f) => targetMeshData.faces.push(f.map((vi) => vi + offset)));
}

// base 2D (u,v) no próprio plano da face (normal de Newell), pra projetar a textura sem
// esticar feio como faria uma projeção fixa no XZ do mundo (a antiga) — cada face usa a
// direção mais "reta" possível como referência de U, então texturas em paredes/tampas
// ficam proporcionais ao tamanho real da face, não deformadas pelo ângulo dela
function faceUVBasis(vertices, face) {
  const normal = computeFaceNormal(vertices, face);
  let ref = new THREE.Vector3(1, 0, 0);
  if (Math.abs(normal.dot(ref)) > 0.9) ref = new THREE.Vector3(0, 1, 0);
  const u = ref.clone().sub(normal.clone().multiplyScalar(ref.dot(normal))).normalize();
  const v = new THREE.Vector3().crossVectors(normal, u);
  // normaliza pelo TAMANHO da própria face (o maior lado da caixa que envolve ela no
  // plano u,v), centralizado no meio dela — sem isso, o U/V "cru" ficava em unidades
  // absolutas do mundo, então uma face pequena (ex.: um detalhe de 0.05 unidade) via só
  // um fragmento minúsculo da textura esticado gigante, e nenhuma escala no slider
  // (0.1–5) conseguia compensar isso. Com a normalização, escala=1 sempre mostra
  // exatamente 1 "ladrilho" da textura do tamanho da própria face, não importa se ela é
  // grande ou pequena — e o slider passa a fazer sentido em qualquer face.
  let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
  face.forEach((vi) => {
    const p = vertices[vi];
    const pu = p.dot(u), pv = p.dot(v);
    if (pu < minU) minU = pu; if (pu > maxU) maxU = pu;
    if (pv < minV) minV = pv; if (pv > maxV) maxV = pv;
  });
  const size = Math.max(maxU - minU, maxV - minV, 1e-6);
  return { u, v, size, centerU: (minU + maxU) / 2, centerV: (minV + maxV) / 2 };
}

// projeta um vértice na base (u,v) de uma face, já normalizado (0,0 = centro da face,
// ±0.5 = borda do lado maior) — é essa coordenada "crua" que a transformação do
// material (escala/rotação/deslocamento) usa como ponto de partida
function projectVertexUV(p, basis) {
  return [(p.dot(basis.u) - basis.centerU) / basis.size, (p.dot(basis.v) - basis.centerV) / basis.size];
}

const DEFAULT_UV_XF = { uScale: 1, vScale: 1, rotation: 0, uOffset: 0, vOffset: 0 };

// aplica a transformação de UV (escala/rotação/deslocamento) que o material tem PRA
// AQUELA face específica — é o que permite cada face com o mesmo material ter um
// "zoom"/giro/posição de textura próprios (pedido: "editar tamanho/rotação e deslocar
// o material dentro de uma face selecionada")
function applyUVTransform(u, v, xf) {
  const su = u * (xf.uScale ?? 1), sv = v * (xf.vScale ?? 1);
  const rot = xf.rotation || 0;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  const ru = su * cos - sv * sin, rv = su * sin + sv * cos;
  return [ru + (xf.uOffset || 0), rv + (xf.vOffset || 0)];
}

// monta a geometria de um objeto já separada por material: cada face usa o material
// atribuído a ela (obj.faceMaterials) ou o padrão, e vira um "group" próprio na
// geometria — isso é o que permite um único objeto ter várias texturas diferentes ao
// mesmo tempo, uma por face (ou grupo de faces), como pedido ("um objeto pode conter
// vários materiais"). geometria SEM índice (cada triângulo com vértices só dele), então
// start/count dos groups contam em VÉRTICES mesmo, não em triângulos.
function buildGeometryAndMaterials(meshData, faceMaterials, materialsList, defaultThreeMaterial) {
  const byMat = new Map();
  const order = [];
  meshData.faces.forEach((face, fi) => {
    if (face.length < 3) return;
    const assign = faceMaterials.get(fi);
    const matEntry = assign && materialsList.find((m) => m.id === assign.materialId);
    const matId = matEntry ? matEntry.id : "__default__";
    const threeMaterial = matEntry ? matEntry.threeMaterial : defaultThreeMaterial;
    if (!byMat.has(matId)) { byMat.set(matId, { threeMaterial, tris: [] }); order.push(matId); }
    const xf = assign || DEFAULT_UV_XF;
    const basis = faceUVBasis(meshData.vertices, face);
    const tris = triangulateFace(face);
    tris.forEach((tri) => {
      const triData = tri.map((vi) => {
        const p = meshData.vertices[vi];
        const [rawU, rawV] = projectVertexUV(p, basis);
        const [uu, vv] = applyUVTransform(rawU, rawV, xf);
        return { pos: p, uv: [uu, vv] };
      });
      byMat.get(matId).tris.push({ triData, fi });
    });
  });
  const positions = [], uvs = [], faceMap = [];
  const geo = new THREE.BufferGeometry();
  const materials = [];
  let vertCursor = 0;
  order.forEach((matId, idx) => {
    const bucket = byMat.get(matId);
    const startVertex = vertCursor;
    bucket.tris.forEach(({ triData, fi }) => {
      triData.forEach(({ pos, uv }) => {
        positions.push(pos.x, pos.y, pos.z);
        uvs.push(uv[0], uv[1]);
      });
      faceMap.push(fi);
      vertCursor += 3;
    });
    geo.addGroup(startVertex, vertCursor - startVertex, idx);
    materials.push(bucket.threeMaterial);
  });
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geo.computeVertexNormals();
  geo.userData.faceMap = faceMap;
  return { geometry: geo, materials: materials.length ? materials : [defaultThreeMaterial] };
}

function getUniqueEdges(meshData) {
  const map = new Map();
  meshData.faces.forEach((face) => {
    for (let i = 0; i < face.length; i++) {
      const a = face[i], b = face[(i + 1) % face.length];
      const key = a < b ? a + "_" + b : b + "_" + a;
      if (!map.has(key)) map.set(key, [a, b]);
    }
  });
  return Array.from(map.values());
}

// remove um conjunto de vértices "dissolvendo" cada um (tira só ele do contorno de cada
// face, não a face inteira) — se isso deixa 2 faces com menos de 3 vértices e elas tinham
// exatamente os MESMOS vértices apagados em comum (o caso clássico: as duas metades de um
// Corte ou Connect, apagando os pontos que o corte criou), funde as duas de volta em uma
// só, restaurando a face original em vez de abrir um buraco na malha
function deleteVerticesFromMesh(meshData, vIndices) {
  const toDelete = new Set(vIndices);
  const reduced = meshData.faces.map((face) => ({
    kept: face.filter((vi) => !toDelete.has(vi)),
    removedHere: face.filter((vi) => toDelete.has(vi)),
  }));

  const usedForMerge = new Set();
  const mergedFaces = [];
  for (let i = 0; i < reduced.length; i++) {
    if (reduced[i].kept.length >= 3 || usedForMerge.has(i) || !reduced[i].removedHere.length) continue;
    const setI = new Set(reduced[i].removedHere);
    let partner = -1;
    for (let j = i + 1; j < reduced.length; j++) {
      if (usedForMerge.has(j) || reduced[j].kept.length >= 3) continue;
      const setJ = new Set(reduced[j].removedHere);
      if (setJ.size === setI.size && reduced[j].removedHere.every((v) => setI.has(v))) { partner = j; break; }
    }
    if (partner !== -1 && reduced[i].kept.length + reduced[partner].kept.length >= 3) {
      mergedFaces.push([...reduced[i].kept, ...reduced[partner].kept]);
      usedForMerge.add(i); usedForMerge.add(partner);
    }
  }

  const finalFaces = [];
  reduced.forEach((r, i) => {
    if (usedForMerge.has(i)) return;
    if (r.kept.length >= 3) finalFaces.push(r.kept);
    // faces que ficaram quebradas (<3) e sem par pra fundir são descartadas — não tem
    // como recuperar uma face válida sozinha
  });
  finalFaces.push(...mergedFaces);
  meshData.faces = finalFaces;

  Array.from(toDelete).sort((a, b) => b - a).forEach((vi) => {
    meshData.vertices.splice(vi, 1);
    meshData.faces = meshData.faces.map((f) => f.map((idx) => (idx > vi ? idx - 1 : idx)));
  });
}

function extrudeFace(meshData, faceIndex, distance) {
  const normal = computeFaceNormal(meshData.vertices, meshData.faces[faceIndex]);
  extrudeFaceOffset(meshData, faceIndex, normal.multiplyScalar(distance));
}

// igual ao extrudeFace, mas com um vetor de deslocamento explícito em vez de
// distância ao longo da normal — usado pelo extrude via setas do teclado, onde a
// direção vem do eixo da tela/viewport, não necessariamente da normal da face
function extrudeFaceOffset(meshData, faceIndex, offsetVec) {
  const face = meshData.faces[faceIndex];
  const n = face.length;
  const newIndices = face.map((vi) => {
    const v = meshData.vertices[vi].clone().add(offsetVec);
    meshData.vertices.push(v);
    return meshData.vertices.length - 1;
  });
  for (let i = 0; i < n; i++) {
    const a = face[i], b = face[(i + 1) % n];
    const na = newIndices[i], nb = newIndices[(i + 1) % n];
    meshData.faces.push([a, b, nb, na]);
  }
  meshData.faces[faceIndex] = newIndices;
}

// extrude uma aresta "aberta" (sem, ou com só uma, face adjacente) gerando um único
// plano novo — a aresta original fica no lugar, e o plano cresce na direção do arraste
function extrudeEdge(meshData, a, b, offsetVec) {
  const va = meshData.vertices[a].clone().add(offsetVec);
  const vb = meshData.vertices[b].clone().add(offsetVec);
  meshData.vertices.push(va);
  const na = meshData.vertices.length - 1;
  meshData.vertices.push(vb);
  const nb = meshData.vertices.length - 1;
  meshData.faces.push([a, b, nb, na]);
  return meshData.faces.length - 1;
}

// bisel de vértice ao estilo Blender: Width (alcance ao longo de cada aresta),
// Steps (nº de anéis entre o vértice original e a borda do bisel — 1 = chanfro reto)
// e Shape (0 = côncavo, 0.5 = reto, 1 = convexo, controla o espaçamento dos anéis).
function bevelVertex(meshData, vIndex, width, steps, shape) {
  steps = Math.max(1, Math.round(steps));
  shape = THREE.MathUtils.clamp(shape, 0, 1);
  const origin = meshData.vertices[vIndex].clone();
  const neighborVec = new Map(); // neighborVertexIndex -> vetor até a posição final do bisel nessa direção
  const adjFaces = [];
  meshData.faces.forEach((face) => {
    if (!face.includes(vIndex)) return;
    adjFaces.push(face);
    const n = face.length;
    const pos = face.indexOf(vIndex);
    const prev = face[(pos - 1 + n) % n];
    const next = face[(pos + 1) % n];
    [prev, next].forEach((neighborIdx) => {
      if (!neighborVec.has(neighborIdx)) {
        const dir = meshData.vertices[neighborIdx].clone().sub(origin);
        const len = dir.length();
        const t = Math.min(width, len * 0.9) / (len || 1);
        neighborVec.set(neighborIdx, dir.multiplyScalar(t));
      }
    });
  });
  const order = Array.from(neighborVec.keys()).sort((a, b) => {
    const va = neighborVec.get(a), vb = neighborVec.get(b);
    return Math.atan2(va.z, va.x) - Math.atan2(vb.z, vb.x);
  });
  if (!order.length) return;

  // normal média das faces que tocam esse vértice = direção "para fora" do canto —
  // sem abaular nessa direção o bisel é só um leque plano (cone), nunca parece redondo
  // de verdade, não importa como os anéis são espaçados (por isso "shape" estava sem efeito real)
  const outward = new THREE.Vector3();
  adjFaces.forEach((face) => outward.add(computeFaceNormal(meshData.vertices, face)));
  if (outward.lengthSq() > 1e-8) outward.normalize(); else outward.set(0, 1, 0);

  // um anel de vértices novos por passo, do mais interno (perto do vértice original) ao
  // mais externo (na borda total do bisel), abaulado para fora — "shape" controla a força
  // do arredondamento (0 = chanfro reto, 1 = bem arredondado); nas pontas (t=0 e t=1) o
  // abaulamento é sempre zero, senão o bisel não encaixaria direito com o resto da malha
  const rings = [];
  for (let s = 0; s < steps; s++) {
    const t = (s + 1) / steps;
    const bulge = 4 * t * (1 - t) * width * shape * 0.6;
    const ringMap = new Map();
    order.forEach((neighborIdx) => {
      const newV = origin.clone().add(neighborVec.get(neighborIdx).clone().multiplyScalar(t)).addScaledVector(outward, bulge);
      meshData.vertices.push(newV);
      ringMap.set(neighborIdx, meshData.vertices.length - 1);
    });
    rings.push(ringMap);
  }
  const outerRing = rings[steps - 1];

  // substitui vIndex, em cada face tocada, pelo par correspondente do anel mais externo
  meshData.faces.forEach((face, fi) => {
    if (!face.includes(vIndex)) return;
    const n = face.length;
    const pos = face.indexOf(vIndex);
    const prev = face[(pos - 1 + n) % n];
    const next = face[(pos + 1) % n];
    const newFace = face.slice();
    newFace.splice(pos, 1, outerRing.get(prev), outerRing.get(next));
    meshData.faces[fi] = newFace;
  });

  // conecta anéis consecutivos com uma faixa de quads (dá o efeito "arredondado" com Steps > 1)
  for (let s = 1; s < steps; s++) {
    const inner = rings[s - 1], outer = rings[s];
    for (let i = 0; i < order.length; i++) {
      const a = order[i], b = order[(i + 1) % order.length];
      meshData.faces.push([inner.get(a), inner.get(b), outer.get(b), outer.get(a)]);
    }
  }
  // tampa do bisel: liga o anel mais interno (se houver 3+ vizinhos)
  if (order.length >= 3) {
    meshData.faces.push(order.map((k) => rings[0].get(k)));
  }
}

// bisel de uma ou mais arestas de uma vez (estilo Hammer/Blender: selecionar a(s)
// aresta(s), tecla F) — achata o "vinco" ao longo de cada aresta, criando `steps`
// faixas planas entre as duas faces adjacentes, em vez de arredondar cada vértice
// isoladamente (bevelVertex). TODAS as arestas usam a topologia ORIGINAL (uma foto
// tirada antes de qualquer mutação) pra calcular arcos/faces adjacentes — biselar em
// sequência, mutando a malha a cada aresta, quebrava o resultado sempre que duas
// arestas selecionadas compartilhavam um vértice (o normal ao selecionar um loop/anel
// conectado): a segunda aresta buscava um vértice que a primeira já tinha substituído,
// não achava mais as faces adjacentes e ficava silenciosamente sem efeito — ou, em
// certas topologias, rasgava a malha.
function bevelEdges(meshData, edgePairs, width, steps, shape) {
  steps = Math.max(1, Math.round(steps));
  shape = THREE.MathUtils.clamp(shape, 0, 1);
  const origFaces = meshData.faces.map((f) => f.slice());
  const origVerts = meshData.vertices.map((v) => v.clone());

  function neighborInFace(face, v, otherEnd) {
    const n = face.length;
    const pos = face.indexOf(v);
    const prev = face[(pos - 1 + n) % n], next = face[(pos + 1) % n];
    return prev === otherEnd ? next : prev;
  }

  // vértice -> conjunto de vizinhos que também são a OUTRA ponta de alguma aresta
  // selecionada tocando esse mesmo vértice. Serve pra distinguir, no canto de uma
  // aresta biselada, se o "outro lado" bate numa aresta de VERDADE (não selecionada,
  // ex.: a aresta vertical de um canto de caixa) ou contra a PRÓPRIA outra aresta
  // selecionada que faz esquina ali (essa última não dá pra resolver cortando uma
  // aresta real, porque a aresta em questão está sendo inteiramente substituída pelo
  // bisel dela mesma).
  const selectedNeighbors = new Map();
  edgePairs.forEach(([a, b]) => {
    if (!selectedNeighbors.has(a)) selectedNeighbors.set(a, new Set());
    if (!selectedNeighbors.has(b)) selectedNeighbors.set(b, new Set());
    selectedNeighbors.get(a).add(b);
    selectedNeighbors.get(b).add(a);
  });

  // ponto de fronteira do bisel que cai numa aresta de VERDADE: em vez de cada aresta
  // selecionada calcular e empurrar seu próprio vértice novo (o que gerava dois pontos
  // COINCIDENTES mas DESCONECTADOS sempre que duas arestas selecionadas bateram na
  // mesma aresta real — ex.: um canto de caixa com 2 arestas selecionadas e uma 3ª
  // aresta comum às duas faces vizinhas — abrindo uma fresta em forma de "dardo" bem
  // ali), essa função funciona como um corte de aresta (igual ao Cut): a primeira
  // aresta que precisar desse ponto cria; a segunda reaproveita o MESMO vértice.
  const boundaryPointCache = new Map();
  function getSharedBoundaryPoint(v, neighbor, len) {
    // a chave NÃO pode ser simétrica (min/max) — esse ponto fica a `len` de distância
    // de "v" andando em direção a "neighbor", então (v=4,neighbor=7) e (v=7,neighbor=4)
    // são DOIS pontos diferentes na mesma aresta não selecionada (um perto de cada
    // ponta), só compartilhados de verdade quando as DUAS faces adjacentes calculam a
    // partir do MESMO vértice v (esse é o caso que essa função existe pra resolver). Usar
    // min/max misturava esses dois pontos diferentes num só, quebrando o canto quando
    // duas arestas biseladas diferentes (uma em cada ponta) caem na mesma aresta livre.
    const key = v + "_" + neighbor;
    if (boundaryPointCache.has(key)) return boundaryPointCache.get(key);
    const dir = origVerts[neighbor].clone().sub(origVerts[v]).normalize();
    const p = origVerts[v].clone().addScaledVector(dir, len);
    meshData.vertices.push(p);
    const idx = meshData.vertices.length - 1;
    boundaryPointCache.set(key, idx);
    return idx;
  }

  // plano de substituição por face: fi -> Map(vértice original -> lista de candidatos
  // {points, ref}). Uma troca "direta" (a face é uma das duas paredes DA PRÓPRIA aresta
  // biselada) tem prioridade sobre uma troca de "terceira face" vinda de OUTRA aresta do
  // lote — sem isso, biselar duas arestas que se encontram num canto de 3+ faces (o caso
  // normal de selecionar um loop/canto conectado, ex.: o contorno inteiro do topo de uma
  // caixa) faz a propagação de terceira face de uma aresta atropelar a troca direta da
  // outra na MESMA face, mesmo quando não havia conflito real ali. Quando DUAS arestas
  // selecionadas reivindicam o MESMO vértice NA MESMA face (o canto onde as duas
  // realmente se encontram), os dois candidatos ficam guardados aqui — a resolução
  // (concatenar os dois arcos na ordem certa, com um teste de auto-interseção como rede
  // de segurança) só acontece depois, na aplicação dos planos, com a face inteira já
  // montada.
  const facePlans = new Map();
  const directClaims = new Set();
  function planReplacement(fi, origVertex, newIndices, isDirect, ref, arc) {
    // Uma troca DIRETA (a própria face de uma das arestas biseladas) sempre tem
    // prioridade sobre a propagação de 3ª face de OUTRA aresta selecionada que também
    // bate nesse vértice — testado remover esse bloqueio pra tentar juntar os dois via
    // mitre/concatenação, mas a concatenação bruta de "1 ponto + arco inteiro" gera
    // vértice duplicado consecutivo (polígono degenerado) em vez de fechar o canto
    // direito; fica pior que o pequeno buraco residual que já existia. Mantém o
    // bloqueio: a face só recebe o ponto da SUA própria aresta nesse caso. O buraco em
    // si (quando 2 arestas biseladas com abaulamento se encontram num canto) é fechado
    // à parte, com um "remendo" entre os dois arcos — ver `arc` abaixo.
    const key = fi + ":" + origVertex;
    if (!isDirect && directClaims.has(key)) return;
    if (!facePlans.has(fi)) facePlans.set(fi, new Map());
    const m = facePlans.get(fi);
    if (isDirect) directClaims.add(key);
    if (!m.has(origVertex)) m.set(origVertex, []);
    // `arc`, quando presente, é o arco INTEIRO (com abaulamento) de onde esse ponto único
    // veio, reordenado pra começar exatamente nesse ponto — guardado só nas trocas
    // diretas, pra permitir costurar um remendo entre dois arcos que se encontram no
    // mesmo canto (ver resolução de mitre mais abaixo)
    m.get(origVertex).push({ points: newIndices, ref, arc });
  }

  // testa se um polígono (lista de índices de vértice) se auto-cruza quando projetado
  // no próprio plano — usado como rede de segurança: só concatena os dois arcos de um
  // conflito se o resultado não cruzar a própria face; senão mantém o vértice original
  // ali, que é sempre uma geometria válida mesmo que deixe uma pequena reentrância.
  function facePolygonSelfIntersects(indices) {
    if (indices.length < 4) return false;
    const pts3d = indices.map((vi) => meshData.vertices[vi]);
    const normal = new THREE.Vector3();
    for (let i = 0; i < pts3d.length; i++) {
      const curr = pts3d[i], next = pts3d[(i + 1) % pts3d.length];
      normal.x += (curr.y - next.y) * (curr.z + next.z);
      normal.y += (curr.z - next.z) * (curr.x + next.x);
      normal.z += (curr.x - next.x) * (curr.y + next.y);
    }
    if (normal.lengthSq() < 1e-10) return false;
    normal.normalize();
    let ref = new THREE.Vector3(1, 0, 0);
    if (Math.abs(normal.dot(ref)) > 0.9) ref = new THREE.Vector3(0, 1, 0);
    const u = ref.clone().sub(normal.clone().multiplyScalar(ref.dot(normal))).normalize();
    const v = new THREE.Vector3().crossVectors(normal, u);
    const pts = pts3d.map((p) => [p.dot(u), p.dot(v)]);
    const n = pts.length;
    function segInt(p1, p2, p3, p4) {
      const d1x = p2[0] - p1[0], d1y = p2[1] - p1[1];
      const d2x = p4[0] - p3[0], d2y = p4[1] - p3[1];
      const denom = d1x * d2y - d1y * d2x;
      if (Math.abs(denom) < 1e-12) return false;
      const t = ((p3[0] - p1[0]) * d2y - (p3[1] - p1[1]) * d2x) / denom;
      const w = ((p3[0] - p1[0]) * d1y - (p3[1] - p1[1]) * d1x) / denom;
      return t > 1e-6 && t < 1 - 1e-6 && w > 1e-6 && w < 1 - 1e-6;
    }
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (j === i || (j + 1) % n === i || (i + 1) % n === j) continue;
        if (segInt(pts[i], pts[(i + 1) % n], pts[j], pts[(j + 1) % n])) return true;
      }
    }
    return false;
  }

  const edgeInfos = [];
  edgePairs.forEach(([a, b]) => {
    const adjacent = [];
    origFaces.forEach((face, fi) => {
      const n = face.length;
      for (let i = 0; i < n; i++) {
        const p = face[i], q = face[(i + 1) % n];
        if ((p === a && q === b) || (p === b && q === a)) { adjacent.push(fi); break; }
      }
    });
    if (adjacent.length < 2) return; // aresta de borda (só uma face) — não dá pra biselar assim

    const originA = origVerts[a].clone();
    const originB = origVerts[b].clone();
    const sides = adjacent.slice(0, 2).map((fi) => {
      const face = origFaces[fi];
      const na = neighborInFace(face, a, b);
      const nb = neighborInFace(face, b, a);
      const lenA = Math.min(width, origVerts[na].clone().sub(originA).length() * 0.9);
      const lenB = Math.min(width, origVerts[nb].clone().sub(originB).length() * 0.9);
      return { fi, face, na, nb, lenA, lenB };
    });
    // normal média das duas faces adjacentes = direção "para fora" da aresta, usada pro
    // abaulamento — funciona tanto pra cantos convexos quanto côncavos, já que a normal
    // de cada face sempre aponta pra fora do sólido dos dois lados
    const outward = computeFaceNormal(origVerts, sides[0].face).add(computeFaceNormal(origVerts, sides[1].face));
    if (outward.lengthSq() > 1e-8) outward.normalize(); else outward.set(0, 1, 0);

    // ponto de fronteira num dos lados de um vértice (a ou b): se o vizinho NÃO é
    // ponta de outra aresta selecionada aqui, é uma aresta de verdade — usa/reaproveita
    // o ponto compartilhado; senão (duas arestas selecionadas fazem esquina nessa
    // mesma face), cria um ponto novo só dessa aresta, que mais adiante entra em
    // conflito com o da outra e o canto fica sem bisel (ver planReplacement acima).
    function boundaryIndex(v, neighbor, len) {
      const isHub = selectedNeighbors.has(v) && selectedNeighbors.get(v).has(neighbor);
      if (!isHub) return getSharedBoundaryPoint(v, neighbor, len);
      const dir = origVerts[neighbor].clone().sub(origVerts[v]).normalize();
      const p = origVerts[v].clone().addScaledVector(dir, len);
      meshData.vertices.push(p);
      return meshData.vertices.length - 1;
    }
    const idxA0 = boundaryIndex(a, sides[0].na, sides[0].lenA);
    const idxA1 = boundaryIndex(a, sides[1].na, sides[1].lenA);
    const idxB0 = boundaryIndex(b, sides[0].nb, sides[0].lenB);
    const idxB1 = boundaryIndex(b, sides[1].nb, sides[1].lenB);

    // pontos intermediários do arco (o abaulamento) — interpola em LINHA RETA entre os
    // dois pontos de fronteira (não pela direção+distância, que traça um arco de
    // círculo CENTRADO NO VÉRTICE — esse arco encurva pra perto do vértice, ou seja,
    // pra DENTRO do canto convexo, brigando com o abaulamento abaixo e deixando o
    // resultado quase reto ou ainda torto). A convexidade real vem só do abaulamento
    // explícito na normal "pra fora", sem nenhuma tendência concorrente. Os dois
    // extremos (t=0 e t=1) são exatamente os pontos de fronteira já criados acima —
    // não são recriados aqui, senão perderiam o compartilhamento entre faces.
    function arcBetween(idx0, idx1) {
      if (steps === 1) return [idx0, idx1];
      const p0 = meshData.vertices[idx0], p1 = meshData.vertices[idx1];
      const mid = [idx0];
      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const base = p0.clone().lerp(p1, t);
        const bulge = 4 * t * (1 - t) * width * shape * 0.6;
        base.addScaledVector(outward, bulge);
        meshData.vertices.push(base);
        mid.push(meshData.vertices.length - 1);
      }
      mid.push(idx1);
      return mid;
    }
    const idxA = arcBetween(idxA0, idxA1);
    const idxB = arcBetween(idxB0, idxB1);
    edgeInfos.push({ a, b, sides, idxA, idxB });
  });

  // 1ª passada: registra as trocas DIRETAS (nas duas faces que fazem a própria aresta)
  // de TODAS as arestas primeiro — essas sempre têm prioridade
  // a referência de ordenação de cada candidato é a OUTRA ponta da própria aresta
  // biselada (não o vizinho na/nb usado só pra calcular a posição do ponto) — é isso
  // que diz corretamente "esse ponto pertence ao lado de qual vizinho", já que a faixa
  // dessa aresta liga esse ponto exatamente ao ponto irmão do outro lado dela mesma
  edgeInfos.forEach(({ a, b, sides, idxA, idxB }) => {
    planReplacement(sides[0].fi, a, [idxA[0]], true, b, idxA);
    planReplacement(sides[0].fi, b, [idxB[0]], true, a, idxB);
    planReplacement(sides[1].fi, a, [idxA[steps]], true, b, idxA.slice().reverse());
    planReplacement(sides[1].fi, b, [idxB[steps]], true, a, idxB.slice().reverse());
  });

  // 2ª passada: propaga pras TERCEIRAS faces (ex.: a face de cima/baixo de um cubo, que
  // não é nem sides[0] nem sides[1]) — pulando qualquer (face, vértice) já reivindicado
  // como troca direta por QUALQUER aresta do lote, mesmo que não seja a atual
  // um vértice do meio de uma aresta RETA (ex.: um ponto inserido por um Corte
  // anterior, numa face sem relação nenhuma com o bisel atual) tem seus dois vizinhos
  // quase exatamente opostos — não é um canto de verdade, só uma "passagem". Uma face
  // assim NÃO deve receber o arco inteiro (ela nem faz parte do canto sendo biselado):
  // só o ponto único do lado que realmente bate com essa face, senão a aresta reta
  // original vira uma linha errada cortando na diagonal até o meio do arco.
  function isStraightPassthrough(face, v) {
    const n = face.length;
    const pos = face.indexOf(v);
    const prev = face[(pos - 1 + n) % n], next = face[(pos + 1) % n];
    const d1 = origVerts[prev].clone().sub(origVerts[v]).normalize();
    const d2 = origVerts[next].clone().sub(origVerts[v]).normalize();
    return d1.dot(d2) < -0.999;
  }
  edgeInfos.forEach(({ a, b, sides, idxA, idxB }) => {
    origFaces.forEach((face, fi) => {
      if (fi === sides[0].fi || fi === sides[1].fi) return;
      const posA = face.indexOf(a);
      if (posA !== -1) {
        const n = face.length;
        const prev = face[(posA - 1 + n) % n], next = face[(posA + 1) % n];
        if (isStraightPassthrough(face, a)) {
          const single = prev === sides[0].na || next === sides[0].na ? idxA[0]
            : prev === sides[1].na || next === sides[1].na ? idxA[steps] : null;
          if (single != null) planReplacement(fi, a, [single], false, b);
        } else {
          let ordered = idxA;
          if (prev === sides[1].na || next === sides[0].na) ordered = idxA.slice().reverse();
          planReplacement(fi, a, ordered, false, b);
        }
      }
      const posB = face.indexOf(b);
      if (posB !== -1) {
        const n = face.length;
        const prev = face[(posB - 1 + n) % n], next = face[(posB + 1) % n];
        if (isStraightPassthrough(face, b)) {
          const single = prev === sides[0].nb || next === sides[0].nb ? idxB[0]
            : prev === sides[1].nb || next === sides[1].nb ? idxB[steps] : null;
          if (single != null) planReplacement(fi, b, [single], false, a);
        } else {
          let ordered = idxB;
          if (prev === sides[1].nb || next === sides[0].nb) ordered = idxB.slice().reverse();
          planReplacement(fi, b, ordered, false, a);
        }
      }
    });
  });

  edgeInfos.forEach(({ idxA, idxB }) => {
    for (let i = 0; i < steps; i++) {
      meshData.faces.push([idxA[i], idxB[i], idxB[i + 1], idxA[i + 1]]);
    }
  });

  // interseção de duas retas DENTRO do plano de uma face (uma reta por ponto+direção) —
  // usada pro cálculo de mitre abaixo. Projeta em 2D na base da própria face (evita
  // erro de ponto-flutuante de tentar cruzar retas 3D que já deviam ser coplanares).
  function lineLineIntersectInPlane(planeNormal, p1, d1, p2, d2) {
    let ref = new THREE.Vector3(1, 0, 0);
    if (Math.abs(planeNormal.dot(ref)) > 0.9) ref = new THREE.Vector3(0, 1, 0);
    const u = ref.clone().sub(planeNormal.clone().multiplyScalar(ref.dot(planeNormal))).normalize();
    const v = new THREE.Vector3().crossVectors(planeNormal, u);
    const to2 = (p) => { const r = p.clone().sub(p1); return [r.dot(u), r.dot(v)]; };
    const p1_2 = [0, 0], p2_2 = to2(p2);
    const d1_2 = [d1.dot(u), d1.dot(v)], d2_2 = [d2.dot(u), d2.dot(v)];
    const denom = d1_2[0] * d2_2[1] - d1_2[1] * d2_2[0];
    if (Math.abs(denom) < 1e-9) return null;
    const t = ((p2_2[0] - p1_2[0]) * d2_2[1] - (p2_2[1] - p1_2[1]) * d2_2[0]) / denom;
    return p1.clone().addScaledVector(u, d1_2[0] * t).addScaledVector(v, d1_2[1] * t);
  }

  // aplica todos os planos de substituição de uma vez por face, na ordem original —
  // assim uma face que recebeu pontos de DUAS arestas biseladas diferentes (o caso comum
  // de um loop/canto conectado, ex.: o contorno inteiro do topo de uma caixa) fica com
  // as trocas certas numa só reconstrução. Quando um vértice tem exatamente 2
  // candidatos vindo de duas arestas selecionadas que se encontram nele, os pontos NÃO
  // são só concatenados lado a lado — cada um já fica sobre a reta de corte (paralela à
  // sua própria aresta original, deslocada pra dentro) mas em TODO o comprimento
  // original da aresta, então duas arestas adjacentes cujas retas de corte se cruzam
  // perto do canto compartilhado geram uma auto-interseção. A correção de verdade é
  // achar o ponto de MITRE: a interseção das duas retas de corte, dentro do plano da
  // face — exatamente como uma ferramenta de bisel "de verdade" fecha um canto onde
  // duas arestas biseladas se encontram. Só cai de volta pra manter o vértice original
  // se o mitre não puder ser calculado (retas quase paralelas) ou se, mesmo assim, a
  // face resultante se auto-cruzar.
  facePlans.forEach((plans, fi) => {
    const origFace = origFaces[fi];
    const faceNormal = computeFaceNormal(origVerts, origFace);
    // se a face tiver mais de um canto em conflito (ex.: um loop com vários cantos na
    // mesma face), cada mitre resolvido aqui mexe em vértices/faces globais (vértice de
    // mitre novo, faixas antigas substituídas por referência, remendo do abaulamento).
    // Se DEPOIS disso a face inteira, com todas as trocas já aplicadas, ainda se
    // auto-cruzar (topologias côncavas complexas), o código caía pra buildFace(false)
    // mas deixava esse lixo (vértices soltos, faixas trocadas, remendos) no ar, porque só
    // desfazia o mitre individual, não a reconstrução inteira. Guarda tudo que foi
    // criado/tocado nessa face pra poder desfazer de verdade se isso acontecer.
    const vSnapStart = meshData.vertices.length;
    const fSnapStart = meshData.faces.length;
    const allTouchedOrig = new Map();
    function buildFace(resolveConflicts) {
      const newFace = [];
      origFace.forEach((vi) => {
        const candidates = plans.get(vi);
        if (!candidates) { newFace.push(vi); return; }
        if (candidates.length === 1) { newFace.push(...candidates[0].points); return; }
        if (!resolveConflicts) { newFace.push(vi); return; }
        if (candidates.length === 2 && candidates[0].points.length === 1 && candidates[1].points.length === 1
          && candidates[0].ref != null && candidates[1].ref != null) {
          const origP = origVerts[vi];
          const p1 = meshData.vertices[candidates[0].points[0]];
          const p2 = meshData.vertices[candidates[1].points[0]];
          const d1 = origVerts[candidates[0].ref].clone().sub(origP);
          const d2 = origVerts[candidates[1].ref].clone().sub(origP);
          if (d1.lengthSq() > 1e-12 && d2.lengthSq() > 1e-12) {
            const miter = lineLineIntersectInPlane(faceNormal, p1, d1.normalize(), p2, d2.normalize());
            if (miter) {
              meshData.vertices.push(miter);
              const miterIdx = meshData.vertices.length - 1;
              // as faixas do bisel de cada uma dessas duas arestas (já criadas antes,
              // com seus próprios pontos-extremo do lado da face) precisam do MESMO
              // ponto de mitre aqui — troca as referências antigas em TODAS as faces já
              // existentes (as faixas), não só na que está sendo montada agora. Em
              // topologias mais complexas (cantos côncavos com abaulamento) essa troca
              // pode deixar a PRÓPRIA faixa torta/cruzada — checa as faixas afetadas e
              // desfaz a troca (volta pro comportamento antigo) se acontecer.
              const oldA = candidates[0].points[0], oldB = candidates[1].points[0];
              const touched = [];
              meshData.faces.forEach((f, idx) => {
                if (f.includes(oldA) || f.includes(oldB)) {
                  touched.push({ idx, orig: f.slice() });
                  if (!allTouchedOrig.has(idx)) allTouchedOrig.set(idx, f.slice());
                  meshData.faces[idx] = f.map((v) => (v === oldA || v === oldB) ? miterIdx : v);
                }
              });
              const brokeAStrip = touched.some(({ idx }) => facePolygonSelfIntersects(meshData.faces[idx]));
              if (!brokeAStrip) {
                // quando as duas arestas biseladas têm abaulamento (steps>1), cada uma
                // tinha seu próprio arco curvo nesse canto (candidates[i].arc, já
                // reordenado pra começar no ponto único que acabou de virar mitre) — as
                // faixas principais de cada aresta só ligam os DOIS pontos-extremo desses
                // arcos entre si (não os pontos do meio, que ficam sem par nenhum), o que
                // deixava um vão em forma de "pétala" entre os dois arcos. Fecha esse vão
                // com uma tira de quads ligando ponto a ponto os dois arcos, do ponto
                // compartilhado da base até o mitre recém-criado.
                const arc0 = candidates[0].arc, arc1 = candidates[1].arc;
                if (arc0 && arc1 && arc0.length === arc1.length && arc0.length > 2) {
                  // arc0[0]/arc1[0] SEMPRE são o próprio ponto que virou mitre (é assim
                  // que cada arco foi montado lá em cima, invertido quando necessário) —
                  // é essa ponta que precisa ser trocada pelo mitre, não a outra
                  const n = arc0.length;
                  const a0 = [miterIdx].concat(arc0.slice(1));
                  const a1 = [miterIdx].concat(arc1.slice(1));
                  for (let i = 0; i < n - 1; i++) {
                    const quad = [a0[i], a1[i], a1[i + 1], a0[i + 1]];
                    const uniq = quad.filter((v, idx2) => quad.indexOf(v) === idx2);
                    if (uniq.length >= 3 && !facePolygonSelfIntersects(uniq)) meshData.faces.push(uniq);
                  }
                }
                newFace.push(miterIdx);
                return;
              }
              touched.forEach(({ idx, orig }) => { meshData.faces[idx] = orig; });
              meshData.vertices.pop();
            }
          }
        }
        const n = origFace.length;
        const pos = origFace.indexOf(vi);
        const prevV = origFace[(pos - 1 + n) % n];
        const sorted = candidates.slice().sort((c1, c2) => {
          const r1 = c1.ref === prevV ? 0 : 1;
          const r2 = c2.ref === prevV ? 0 : 1;
          return r1 - r2;
        });
        sorted.forEach((c) => newFace.push(...c.points));
      });
      return newFace;
    }
    let newFace = buildFace(true);
    if (newFace.length >= 4 && facePolygonSelfIntersects(newFace)) {
      // a face inteira ficou ruim mesmo com os mitres individualmente válidos — desfaz
      // TUDO que essa reconstrução gerou (faixas trocadas por referência, remendos
      // novos, vértices de mitre) antes de cair pro comportamento antigo, senão sobra
      // lixo desconectado apontando pra vértices que essa face nem usa mais
      allTouchedOrig.forEach((orig, idx) => { meshData.faces[idx] = orig; });
      meshData.faces.length = fSnapStart;
      meshData.vertices.length = vSnapStart;
      newFace = buildFace(false);
    }
    if (newFace.length >= 3) meshData.faces[fi] = newFace;
  });
}

// atalho pra biselar uma única aresta — usado por qualquer chamada que só tenha um par
function bevelEdge(meshData, a, b, width, steps, shape) {
  bevelEdges(meshData, [[a, b]], width, steps, shape);
}

// remove (dissolve) uma aresta interna fundindo as duas faces adjacentes em uma só —
// usado pelo Backspace/Delete quando o que está selecionado é uma aresta
function dissolveEdge(meshData, a, b) {
  const adjacent = [];
  meshData.faces.forEach((face, fi) => {
    const n = face.length;
    for (let i = 0; i < n; i++) {
      const p = face[i], q = face[(i + 1) % n];
      if ((p === a && q === b) || (p === b && q === a)) { adjacent.push({ fi, dir: p === a ? 1 : -1 }); break; }
    }
  });
  if (adjacent.length !== 2) return false;
  const [s1, s2] = adjacent;
  const faceAB = s1.dir === 1 ? meshData.faces[s1.fi] : meshData.faces[s2.fi]; // ...,a,b,...
  const faceBA = s1.dir === 1 ? meshData.faces[s2.fi] : meshData.faces[s1.fi]; // ...,b,a,...
  const idxA1 = faceAB.indexOf(a);
  const idxA2 = faceBA.indexOf(a);
  const others = [];
  for (let i = 1; i < faceBA.length - 1; i++) others.push(faceBA[(idxA2 + i) % faceBA.length]);
  const rotated = faceAB.slice(idxA1).concat(faceAB.slice(0, idxA1));
  const merged = [rotated[0], ...others, ...rotated.slice(1)];
  const removeIdx = [s1.fi, s2.fi].sort((x, y) => y - x);
  removeIdx.forEach((fi) => meshData.faces.splice(fi, 1));
  meshData.faces.push(merged);
  return true;
}

// arco de aresta: subdivide a aresta a-b em N segmentos, "estufando" na direção da normal média
function arcEdge(meshData, a, b, segments, bulge) {
  segments = Math.max(2, Math.min(16, Math.round(segments)));
  // acha faces que contêm a aresta (a,b) consecutiva em qualquer ordem
  const touched = [];
  meshData.faces.forEach((face, fi) => {
    const n = face.length;
    for (let i = 0; i < n; i++) {
      const p1 = face[i], p2 = face[(i + 1) % n];
      if ((p1 === a && p2 === b) || (p1 === b && p2 === a)) touched.push({ fi, i, forward: p1 === a });
    }
  });
  if (touched.length === 0) throw new Error("Aresta não pertence a nenhuma face.");
  // normal média das faces tocadas, para direção do "estufo"
  const avgNormal = new THREE.Vector3();
  touched.forEach((t) => avgNormal.add(computeFaceNormal(meshData.vertices, meshData.faces[t.fi])));
  avgNormal.normalize();
  const va = meshData.vertices[a], vb = meshData.vertices[b];
  const mid = va.clone().add(vb).multiplyScalar(0.5);
  const edgeDir = vb.clone().sub(va).normalize();
  let perp = new THREE.Vector3().crossVectors(avgNormal, edgeDir);
  if (perp.lengthSq() < 1e-8) perp = new THREE.Vector3(0, 1, 0);
  perp.normalize();
  const newChain = []; // índices dos novos vértices, de a até b
  for (let s = 1; s < segments; s++) {
    const t = s / segments;
    const base = va.clone().lerp(vb, t);
    const arcOffset = Math.sin(Math.PI * t) * bulge;
    base.addScaledVector(perp, arcOffset);
    meshData.vertices.push(base);
    newChain.push(meshData.vertices.length - 1);
  }
  touched.forEach(({ fi, i, forward }) => {
    const face = meshData.faces[fi];
    const chain = forward ? newChain : newChain.slice().reverse();
    const insertAt = i + 1;
    face.splice(insertAt, 0, ...chain);
  });
}

// corta uma face em dois, ligando um ponto na aresta (eA0,eA1)@tA a um ponto na aresta (eB0,eB1)@tB
function sliceFace(meshData, faceIndex, edgeA, tA, edgeB, tB) {
  // cada uma dessas arestas costuma ser compartilhada com uma face VIZINHA — inserir o
  // vértice novo só nesta face (como fazia antes) deixa a vizinha com a aresta antiga,
  // rachando a malha (a mesma aresta com dois tamanhos diferentes nas duas faces). Usar
  // insertVertexOnEdge garante que TODA face que toca essa aresta recebe o vértice novo.
  const newA = insertVertexOnEdge(meshData, edgeA[0], edgeA[1], tA);
  const newB = insertVertexOnEdge(meshData, edgeB[0], edgeB[1], tB);
  const face = meshData.faces[faceIndex]; // já atualizada, com newA e newB inseridos
  const posNewA = face.indexOf(newA);
  const posNewB = face.indexOf(newB);
  if (posNewA === -1 || posNewB === -1 || posNewA === posNewB) throw new Error("Corte inválido.");
  const lo = Math.min(posNewA, posNewB), hi = Math.max(posNewA, posNewB);
  const loopA = face.slice(lo, hi + 1);
  const loopB = face.slice(hi).concat(face.slice(0, lo + 1));
  if (loopA.length < 3 || loopB.length < 3) throw new Error("Corte gera face inválida.");
  meshData.faces[faceIndex] = loopA;
  meshData.faces.push(loopB);
}

// insere um vértice novo no meio de uma aresta (t de 0 a 1), atualizando toda face que
// usa essa aresta — usado pelo Corte quando é uma ARESTA (não uma face) que está selecionada
function insertVertexOnEdge(meshData, a, b, t) {
  const pos = meshData.vertices[a].clone().lerp(meshData.vertices[b], t);
  meshData.vertices.push(pos);
  const newIdx = meshData.vertices.length - 1;
  meshData.faces.forEach((face, fi) => {
    const n = face.length;
    for (let i = 0; i < n; i++) {
      const p = face[i], q = face[(i + 1) % n];
      if ((p === a && q === b) || (p === b && q === a)) {
        const newFace = face.slice();
        newFace.splice(i + 1, 0, newIdx);
        meshData.faces[fi] = newFace;
        break;
      }
    }
  });
  return newIdx;
}

// acha onde a reta (infinita) que passa por p1,p2 cruza as arestas de contorno de uma
// face — usado pelo Corte quando é uma FACE que está selecionada: os 2 pontos clicados
// definem a linha, e o corte de verdade acontece onde ela sai da face
function computeLineFaceIntersections(meshData, faceIndex, p1, p2) {
  const face = meshData.faces[faceIndex];
  const n = face.length;
  const normal = computeFaceNormal(meshData.vertices, face);
  let u = new THREE.Vector3(1, 0, 0);
  if (Math.abs(u.dot(normal)) > 0.9) u = new THREE.Vector3(0, 1, 0);
  u.sub(normal.clone().multiplyScalar(u.dot(normal))).normalize();
  const v = new THREE.Vector3().crossVectors(normal, u).normalize();
  const origin = meshData.vertices[face[0]];
  function to2D(p) {
    const rel = p.clone().sub(origin);
    return { x: rel.dot(u), y: rel.dot(v) };
  }
  const p1_2 = to2D(p1), p2_2 = to2D(p2);
  const dx = p2_2.x - p1_2.x, dy = p2_2.y - p1_2.y;
  if (Math.hypot(dx, dy) < 1e-9) return [];
  const hits = [];
  for (let i = 0; i < n; i++) {
    const a = face[i], b = face[(i + 1) % n];
    const va2 = to2D(meshData.vertices[a]);
    const vb2 = to2D(meshData.vertices[b]);
    const ex = vb2.x - va2.x, ey = vb2.y - va2.y;
    const denom = ex * dy - dx * ey;
    if (Math.abs(denom) < 1e-9) continue; // paralela a essa aresta
    const rx = va2.x - p1_2.x, ry = va2.y - p1_2.y;
    const s = (ex * ry - ey * rx) / denom;
    const t = (dx * ry - dy * rx) / denom;
    if (t >= -1e-6 && t <= 1 + 1e-6) {
      hits.push({ edge: [a, b], t: THREE.MathUtils.clamp(t, 0, 1), sLine: s });
    }
  }
  return hits;
}

// ============================================================================
// PRIMITIVAS
// ============================================================================
function makeBox(width = 1, height = width, depth = width) {
  const sx = width / 2, sy = height / 2, sz = depth / 2;
  const vertices = [
    [-sx, -sy, -sz], [sx, -sy, -sz], [sx, sy, -sz], [-sx, sy, -sz],
    [-sx, -sy, sz], [sx, -sy, sz], [sx, sy, sz], [-sx, sy, sz],
  ].map((p) => new THREE.Vector3(...p));
  const faces = [
    [0, 1, 2, 3], [5, 4, 7, 6], [4, 0, 3, 7],
    [1, 5, 6, 2], [3, 2, 6, 7], [4, 5, 1, 0],
  ];
  return { vertices, faces };
}

function makePlane(width = 2, depth = width, segs = 4) {
  const vertices = [];
  const halfW = width / 2, halfD = depth / 2;
  for (let y = 0; y <= segs; y++) {
    for (let x = 0; x <= segs; x++) {
      vertices.push(new THREE.Vector3(-halfW + (width * x) / segs, 0, -halfD + (depth * y) / segs));
    }
  }
  const faces = [];
  for (let y = 0; y < segs; y++) {
    for (let x = 0; x < segs; x++) {
      const i0 = y * (segs + 1) + x;
      const i1 = i0 + 1;
      const i2 = i0 + (segs + 1) + 1;
      const i3 = i0 + (segs + 1);
      faces.push([i0, i1, i2, i3]);
    }
  }
  return { vertices, faces };
}

function makeCylinder(radius = 0.6, height = 1.4, segs = 12) {
  const vertices = [];
  const top = [], bottom = [];
  for (let i = 0; i < segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    vertices.push(new THREE.Vector3(Math.cos(a) * radius, height / 2, Math.sin(a) * radius));
    top.push(i);
  }
  for (let i = 0; i < segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    vertices.push(new THREE.Vector3(Math.cos(a) * radius, -height / 2, Math.sin(a) * radius));
    bottom.push(segs + i);
  }
  const faces = [top.slice().reverse(), bottom];
  for (let i = 0; i < segs; i++) {
    const a0 = i, a1 = (i + 1) % segs;
    faces.push([top[a0], top[a1], bottom[a1], bottom[a0]]);
  }
  return { vertices, faces };
}

function makeSphere(radius = 0.8, wSegs = 12, hSegs = 8) {
  const vertices = [];
  const grid = [];
  for (let y = 0; y <= hSegs; y++) {
    const row = [];
    const v = y / hSegs;
    const phi = v * Math.PI;
    for (let x = 0; x <= wSegs; x++) {
      const u = x / wSegs;
      const theta = u * Math.PI * 2;
      const vx = -radius * Math.cos(theta) * Math.sin(phi);
      const vy = radius * Math.cos(phi);
      const vz = radius * Math.sin(theta) * Math.sin(phi);
      vertices.push(new THREE.Vector3(vx, vy, vz));
      row.push(vertices.length - 1);
    }
    grid.push(row);
  }
  const faces = [];
  for (let y = 0; y < hSegs; y++) {
    for (let x = 0; x < wSegs; x++) {
      const a = grid[y][x], b = grid[y][x + 1], c = grid[y + 1][x + 1], d = grid[y + 1][x];
      if (y === 0) faces.push([a, c, d]);
      else if (y === hSegs - 1) faces.push([a, b, c]);
      else faces.push([a, b, c, d]);
    }
  }
  return { vertices, faces };
}

// ============================================================================
// GIZMO (setas de mover / anéis de girar)
// ============================================================================
function buildAxisArrow(axis, color) {
  const group = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.42, 8), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true }));
  shaft.position.y = 0.21;
  // a haste é só visual — clicar nela não deve arrastar, senão é fácil "acertar" o
  // gizmo sem querer encostando perto do eixo em vez de na ponta de verdade
  shaft.raycast = () => {};
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.24, 10), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true }));
  head.position.y = 0.42 + 0.12;
  group.add(shaft, head);
  if (axis === "x") group.rotation.z = -Math.PI / 2;
  else if (axis === "z") group.rotation.x = Math.PI / 2;
  group.renderOrder = 50;
  group.traverse((o) => { if (o.isMesh) { o.userData.gizmoAxis = axis; o.userData.gizmoKind = "move"; o.renderOrder = 50; } });
  return group;
}

function buildAxisRing(axis, color) {
  const geo = new THREE.TorusGeometry(0.55, 0.012, 8, 48);
  const mat = new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.9 });
  const ring = new THREE.Mesh(geo, mat);
  if (axis === "x") ring.rotation.y = Math.PI / 2;
  else if (axis === "y") ring.rotation.x = Math.PI / 2;
  ring.renderOrder = 50;
  ring.userData.gizmoAxis = axis;
  ring.userData.gizmoKind = "rotate";
  return ring;
}

function buildAxisScaleHandle(axis, color) {
  const group = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.42, 8), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true }));
  shaft.position.y = 0.21;
  // mesma ideia da seta de mover: só o cubo da ponta é clicável, não a haste
  shaft.raycast = () => {};
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true }));
  head.position.y = 0.42 + 0.09;
  group.add(shaft, head);
  if (axis === "x") group.rotation.z = -Math.PI / 2;
  else if (axis === "z") group.rotation.x = Math.PI / 2;
  group.renderOrder = 50;
  group.traverse((o) => { if (o.isMesh) { o.userData.gizmoAxis = axis; o.userData.gizmoKind = "scale"; o.renderOrder = 50; } });
  return group;
}

const AXIS_VEC = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };

// quadradinho entre dois eixos do gizmo de escala — arrastar ele escala os DOIS eixos
// ao mesmo tempo (a partir do pivô), em vez de precisar arrastar cada seta separado
function buildPlaneScaleHandle(axisA, axisB, colorA, colorB) {
  const d = 0.2, s = 0.14;
  const geo = new THREE.PlaneGeometry(s, s);
  const color = new THREE.Color(colorA).lerp(new THREE.Color(colorB), 0.5);
  const mat = new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.65, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  const vA = AXIS_VEC[axisA], vB = AXIS_VEC[axisB];
  mesh.position.copy(vA.clone().multiplyScalar(d)).addScaledVector(vB, d);
  // orienta o plano do quadrado (normal padrão +Z) pra ficar deitado no plano formado
  // pelos dois eixos, alinhando +Z direto com a normal desse plano
  const n = new THREE.Vector3().crossVectors(vA, vB).normalize();
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
  mesh.renderOrder = 50;
  mesh.userData.gizmoKind = "scaleplane";
  mesh.userData.gizmoAxes = [axisA, axisB];
  return mesh;
}

function buildDirScaleHandle(axis, sign, color) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), new THREE.MeshBasicMaterial({ color, depthTest: false }));
  mesh.renderOrder = 50;
  mesh.userData.gizmoAxis = axis;
  mesh.userData.gizmoSign = sign;
  mesh.userData.gizmoKind = "scaledir";
  return mesh;
}

function buildFreeMoveHandle() {
  // cubinho na intersecção das 3 setas — arrastar dele move nos 3 eixos ao mesmo tempo
  // (no plano da câmera), em vez de ficar preso a um único eixo como as setas
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false }));
  mesh.renderOrder = 51;
  mesh.userData.gizmoKind = "movefree";
  return mesh;
}

function buildGizmo() {
  const group = new THREE.Group();
  group.visible = false;
  const move = new THREE.Group();
  ["x", "y", "z"].forEach((axis) => move.add(buildAxisArrow(axis, AXIS_COLORS[axis])));
  move.add(buildFreeMoveHandle());
  const rotate = new THREE.Group();
  ["x", "y", "z"].forEach((axis) => rotate.add(buildAxisRing(axis, AXIS_COLORS[axis])));
  const scale = new THREE.Group();
  ["x", "y", "z"].forEach((axis) => scale.add(buildAxisScaleHandle(axis, AXIS_COLORS[axis])));
  [["x", "y"], ["y", "z"], ["x", "z"]].forEach(([a, b]) => scale.add(buildPlaneScaleHandle(a, b, AXIS_COLORS[a], AXIS_COLORS[b])));
  group.add(move, rotate, scale);
  group.userData.moveGroup = move;
  group.userData.rotateGroup = rotate;
  group.userData.scaleGroup = scale;
  return group;
}

// gizmo de escala direcional (tecla Q): 6 bolinhas em posições MUNDIAIS (não relativas
// ao pivô central), uma por face da caixa delimitadora da seleção — fica de fora do
// grupo principal porque suas posições seguem a extensão real do objeto e não devem
// ser deslocadas pelo auto-escalonamento por distância de câmera do gizmo principal.
function buildDirScaleGizmo() {
  const group = new THREE.Group();
  group.visible = false;
  ["x", "y", "z"].forEach((axis) => {
    group.add(buildDirScaleHandle(axis, 1, AXIS_COLORS[axis]));
    group.add(buildDirScaleHandle(axis, -1, AXIS_COLORS[axis]));
  });
  return group;
}

// ============================================================================
// EXPORTAÇÃO / IMPORTAÇÃO OBJ
// ============================================================================
function exportOBJ(objects) {
  let out = "# exportado pelo Editor 3D\n";
  let offset = 1;
  objects.forEach((obj) => {
    out += `o ${obj.name}\n`;
    const used = new Set();
    obj.meshData.faces.forEach((f) => f.forEach((i) => used.add(i)));
    const remap = new Map();
    let idx = 0;
    obj.meshData.vertices.forEach((v, i) => {
      if (used.has(i)) {
        out += `v ${v.x.toFixed(6)} ${v.y.toFixed(6)} ${v.z.toFixed(6)}\n`;
        remap.set(i, idx + offset);
        idx++;
      }
    });
    obj.meshData.faces.forEach((f) => {
      const line = f.map((i) => remap.get(i)).join(" ");
      out += `f ${line}\n`;
    });
    offset += idx;
  });
  return out;
}

// nome de arquivo estável pra uma textura de material exportado — usa o id interno do
// material (sem espaço/acento) + o slot, preservando a extensão original do arquivo
function textureFileName(m, slot) {
  const orig = (m.slots[slot] && m.slots[slot].name) || "textura.png";
  const ext = (orig.match(/\.[a-zA-Z0-9]+$/) || [".png"])[0];
  return `${m.id}_${slot}${ext}`;
}

// igual ao exportOBJ, mas junto com os vértices/faces também escreve as coordenadas de
// UV (uma por CANTO de face, não por vértice — a projeção de UV é por face, então o
// mesmo vértice pode ter UV diferente em faces vizinhas) e agrupa as faces com "usemtl"
// trocando toda vez que o material muda, referenciando um .mtl externo (mtllib)
function exportOBJWithMaterials(objects, materialsList, defaultEntry) {
  let out = "# exportado pelo Editor 3D\nmtllib modelo.mtl\n";
  let vOffset = 1, vtOffset = 1;
  const usedMatIds = new Set();
  objects.forEach((obj) => {
    out += `o ${obj.name}\n`;
    const used = new Set();
    obj.meshData.faces.forEach((f) => f.forEach((i) => used.add(i)));
    const remap = new Map();
    let idx = 0;
    obj.meshData.vertices.forEach((v, i) => {
      if (used.has(i)) {
        out += `v ${v.x.toFixed(6)} ${v.y.toFixed(6)} ${v.z.toFixed(6)}\n`;
        remap.set(i, idx + vOffset);
        idx++;
      }
    });
    vOffset += idx;
    let lastMatId = null;
    obj.meshData.faces.forEach((face, fi) => {
      if (face.length < 3) return;
      const assign = obj.faceMaterials.get(fi);
      const matEntry = assign && materialsList.find((m) => m.id === assign.materialId);
      const matId = matEntry ? matEntry.id : defaultEntry.id;
      usedMatIds.add(matId);
      if (matId !== lastMatId) { out += `usemtl ${matId}\n`; lastMatId = matId; }
      const xf = assign || DEFAULT_UV_XF;
      const basis = faceUVBasis(obj.meshData.vertices, face);
      const vtIndices = face.map((vi) => {
        const p = obj.meshData.vertices[vi];
        const [rawU, rawV] = projectVertexUV(p, basis);
        const [uu, vv] = applyUVTransform(rawU, rawV, xf);
        out += `vt ${uu.toFixed(6)} ${vv.toFixed(6)}\n`;
        return vtOffset++;
      });
      const line = face.map((vi, k) => `${remap.get(vi)}/${vtIndices[k]}`).join(" ");
      out += `f ${line}\n`;
    });
  });
  return { text: out, usedMatIds };
}

// arquivo .mtl companheiro do exportOBJWithMaterials — Kd/Pr/Pm são os parâmetros
// escalares, e os map_* apontam pros arquivos de textura exportados junto (mesmo nome
// que textureFileName gera, pra baterem certinho)
function buildMTLText(materialsList, usedMatIds, defaultEntry) {
  let out = "# exportado pelo Editor 3D\n";
  const all = [defaultEntry, ...materialsList.filter((m) => !m.builtin)];
  all.forEach((m) => {
    if (!usedMatIds.has(m.id)) return;
    out += `newmtl ${m.id}\n`;
    const c = m.threeMaterial.color;
    out += `Kd ${c.r.toFixed(4)} ${c.g.toFixed(4)} ${c.b.toFixed(4)}\n`;
    out += `Pr ${m.roughness.toFixed(4)}\n`;
    out += `Pm ${m.metalness.toFixed(4)}\n`;
    if (m.slots.albedo) out += `map_Kd ${textureFileName(m, "albedo")}\n`;
    if (m.slots.normal) out += `map_Bump ${textureFileName(m, "normal")}\n`;
    if (m.slots.roughness) out += `map_Pr ${textureFileName(m, "roughness")}\n`;
    if (m.slots.displacement) out += `disp ${textureFileName(m, "displacement")}\n`;
    out += "\n";
  });
  return out;
}

function parseOBJ(text) {
  const vertices = [];
  const faces = [];
  const lines = text.split("\n");
  lines.forEach((line) => {
    line = line.trim();
    if (line.startsWith("v ")) {
      const p = line.split(/\s+/).slice(1).map(Number);
      vertices.push(new THREE.Vector3(p[0], p[1], p[2]));
    } else if (line.startsWith("f ")) {
      const parts = line.split(/\s+/).slice(1);
      const face = parts.map((p) => parseInt(p.split("/")[0], 10) - 1).filter((n) => !isNaN(n));
      if (face.length >= 3) faces.push(face);
    }
  });
  return { vertices, faces };
}

  const [materialEditor, setMaterialEditor] = useState(null); // {mode:'create'|'edit', matId} enquanto o modal de edição está aberto, senão null

  const getObj = useCallback((id) => objectsRef.current.find((o) => o.id === id) || null, []);
  const getSelectedObj = useCallback(() => getObj(selectedIdRef.current), [getObj]);

  // ---------------------------------------------------------------------
  // layout dos painéis / seleção de viewport sob o cursor
  // ---------------------------------------------------------------------
  function getQuadRects(w, h) {
    const list = viewportsRef.current;
    if (!list.length) return [];
    if (maximizedRef.current) {
      const v = list.find((x) => x.id === maximizedRef.current);
      return v ? [{ vp: v, x: 0, y: 0, w, h }] : [];
    }
    const hw = Math.floor(w / 2), hh = Math.floor(h / 2);
    const byId = (id) => list.find((x) => x.id === id);
    return [
      { vp: byId("persp"), x: 0, y: hh, w: hw, h: h - hh },
      { vp: byId("top"), x: hw, y: hh, w: w - hw, h: h - hh },
      { vp: byId("front"), x: 0, y: 0, w: hw, h: hh },
      { vp: byId("side"), x: hw, y: 0, w: w - hw, h: hh },
    ];
  }

  function getViewportAndNDC(clientX, clientY) {
    const container = mountRef.current;
    if (!container) return null;
    const rect = container.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const px = clientX - rect.left, py = clientY - rect.top;
    const pyUp = h - py;
    const rects = getQuadRects(w, h);
    const found = rects.find((r) => r.vp && px >= r.x && px < r.x + r.w && pyUp >= r.y && pyUp < r.y + r.h);
    if (!found) return null;
    const quadRect = { x: found.x, y: h - (found.y + found.h), w: found.w, h: found.h };
    const localX = px - quadRect.x, localY = py - quadRect.y;
    const ndc = { x: (localX / quadRect.w) * 2 - 1, y: -(localY / quadRect.h) * 2 + 1 };
    return { vp: found.vp, ndc, quadRect };
  }

  function ndcFromEvent(e, quadRect) {
    const container = mountRef.current;
    const rect = container.getBoundingClientRect();
    const localX = e.clientX - rect.left - quadRect.x;
    const localY = e.clientY - rect.top - quadRect.y;
    return { x: (localX / quadRect.w) * 2 - 1, y: -(localY / quadRect.h) * 2 + 1 };
  }

  // ---------------------------------------------------------------------
  // reconstrução de geometria / helpers de edição
  // ---------------------------------------------------------------------
  const refreshObjectVisuals = useCallback((obj) => {
    const { geometry, materials } = buildGeometryAndMaterials(obj.meshData, obj.faceMaterials, materialsRef.current, getOrCreateDefaultMaterial().threeMaterial);
    obj.mesh.geometry.dispose();
    obj.mesh.geometry = geometry;
    obj.mesh.material = materials;

    // índices podem ter mudado (vértices/faces novos ou removidos) — descarta o hover
    // antigo em vez de deixá-lo apontar pro lugar errado até o próximo movimento do mouse
    clearHoverHighlight();
    hoverRef.current = null;

    if (obj.vertHelper) { obj.vertHelper.geometry.dispose(); sceneRef.current.remove(obj.vertHelper); }
    if (obj.edgeHelper) { obj.edgeHelper.geometry.dispose(); sceneRef.current.remove(obj.edgeHelper); }

    const vertPositions = [];
    obj.meshData.vertices.forEach((v) => vertPositions.push(v.x, v.y, v.z));
    const vertGeo = new THREE.BufferGeometry();
    vertGeo.setAttribute("position", new THREE.Float32BufferAttribute(vertPositions, 3));
    const vertPts = new THREE.Points(vertGeo, new THREE.PointsMaterial({ color: SEL_COLORS.vertexDefault, size: 0.03, sizeAttenuation: true, depthTest: false }));
    vertPts.renderOrder = 10;
    vertPts.visible = selMode === SELMODE.VERTEX && selectedIdRef.current === obj.id;
    obj.vertHelper = vertPts;
    sceneRef.current.add(vertPts);

    obj.edgesList = getUniqueEdges(obj.meshData);
    const edgePositions = [];
    obj.edgesList.forEach(([a, b]) => {
      const va = obj.meshData.vertices[a], vb = obj.meshData.vertices[b];
      edgePositions.push(va.x, va.y, va.z, vb.x, vb.y, vb.z);
    });
    const edgeGeo = new THREE.BufferGeometry();
    edgeGeo.setAttribute("position", new THREE.Float32BufferAttribute(edgePositions, 3));
    const edgeLines = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: SEL_COLORS.edgeDefault, depthTest: false, transparent: true, opacity: 0.85 }));
    edgeLines.renderOrder = 9;
    // as arestas ficam visíveis em qualquer modo de seleção de componente (vértice/aresta/face)
    // para ajudar a enxergar a geometria — só somem no modo Malha (4)
    edgeLines.visible = selMode !== SELMODE.MESH && selectedIdRef.current === obj.id;
    obj.edgeHelper = edgeLines;
    sceneRef.current.add(edgeLines);
  }, [selMode]);

  const clearSelectionHighlight = useCallback(() => {
    const obj = getSelectedObj();
    if (!obj) return;
    if (obj.selMarker) {
      obj.selMarker.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
      sceneRef.current.remove(obj.selMarker);
      obj.selMarker = null;
    }
    if (obj.faceHighlight) {
      obj.faceHighlight.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
      sceneRef.current.remove(obj.faceHighlight);
      obj.faceHighlight = null;
    }
  }, [getSelectedObj]);

  const updateSelectionHighlight = useCallback(() => {
    const obj = getSelectedObj();
    clearSelectionHighlight();
    if (!obj || !selectionRef.current) return;
    const sel = selectionRef.current;
    if (sel.type === "vertex") {
      const group = buildVertexMarkerGroup(obj.meshData, sel.indices, SEL_COLORS.vertexSelected);
      obj.selMarker = group;
      sceneRef.current.add(group);
    } else if (sel.type === "edge") {
      const group = buildEdgeSelectionMesh(obj.meshData, sel.pairs, SEL_COLORS.edgeSelected);
      obj.selMarker = group;
      sceneRef.current.add(group);
    } else if (sel.type === "face") {
      const positions = [];
      sel.indices.forEach((fi) => {
        const face = obj.meshData.faces[fi];
        if (!face) return;
        triangulateFace(face).forEach((t) => t.forEach((vi) => { const v = obj.meshData.vertices[vi]; positions.push(v.x, v.y, v.z); }));
      });
      if (!positions.length) return;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.computeVertexNormals();
      // sem bolinhas de vértice aqui — no modo Face só o preenchimento colorido marca a seleção
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: SEL_COLORS.faceSelectedFill, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthTest: true, polygonOffset: true, polygonOffsetFactor: -2 }));
      obj.faceHighlight = mesh;
      sceneRef.current.add(mesh);
    }
