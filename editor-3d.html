    // sel.type === "mesh": sem destaque dedicado — a malha inteira já está visível
  }, [getSelectedObj, clearSelectionHighlight]);

  const clearHoverHighlight = useCallback(() => {
    const obj = getSelectedObj();
    if (!obj) return;
    if (obj.hoverMarker) {
      obj.hoverMarker.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
      sceneRef.current.remove(obj.hoverMarker);
      obj.hoverMarker = null;
    }
  }, [getSelectedObj]);

  const updateHoverHighlight = useCallback(() => {
    const obj = getSelectedObj();
    clearHoverHighlight();
    if (!obj || !hoverRef.current) return;
    const hov = hoverRef.current;
    const sel = selectionRef.current;
    if (hov.type === "vertex") {
      if (sel && sel.type === "vertex" && sel.indices.includes(hov.index)) return; // já selecionado — a cor de seleção manda
      const group = buildVertexMarkerGroup(obj.meshData, [hov.index], SEL_COLORS.vertexHover);
      obj.hoverMarker = group;
      sceneRef.current.add(group);
    } else if (hov.type === "edge") {
      if (sel && sel.type === "edge" && sel.pairs.some(([a, b]) => (a === hov.a && b === hov.b) || (a === hov.b && b === hov.a))) return;
      const group = buildEdgeSelectionMesh(obj.meshData, [[hov.a, hov.b]], SEL_COLORS.edgeHover);
      obj.hoverMarker = group;
      sceneRef.current.add(group);
    } else if (hov.type === "face") {
      if (sel && sel.type === "face" && sel.indices.includes(hov.index)) return;
      const face = obj.meshData.faces[hov.index];
      if (!face) return;
      const positions = [];
      triangulateFace(face).forEach((t) => t.forEach((vi) => { const v = obj.meshData.vertices[vi]; positions.push(v.x, v.y, v.z); }));
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.computeVertexNormals();
      // sem bolinhas de vértice aqui — no modo Face só o preenchimento colorido marca o hover
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: SEL_COLORS.faceHoverFill, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthTest: true, polygonOffset: true, polygonOffsetFactor: -2 }));
      obj.hoverMarker = mesh;
      sceneRef.current.add(mesh);
    }
  }, [getSelectedObj, clearHoverHighlight]);

  const updateGizmoTransform = useCallback(() => {
    const g = gizmoRef.current;
    const dg = dirScaleGizmoRef.current;
    if (!g) return;
    const obj = getSelectedObj();
    const sel = selectionRef.current;
    const indices = obj && sel ? selectionVertexIndices(obj.meshData, sel) : [];
    let refPoint = null;
    if (obj && indices.length) {
      refPoint = indices.reduce((acc, vi) => acc.add(obj.meshData.vertices[vi]), new THREE.Vector3()).divideScalar(indices.length);
    }
    const allowRotate = !!(sel && (sel.type !== "vertex" || indices.length > 1));
    const showMove = !!(refPoint && activeTool === TOOL.MOVE);
    const showRotate = !!(refPoint && allowRotate && activeTool === TOOL.ROTATE);
    const showScale = !!(refPoint && activeTool === TOOL.SCALE);
    const showScaleDir = !!(refPoint && indices.length > 1 && activeTool === TOOL.SCALE_DIR);
    g.visible = showMove || showRotate || showScale;
    if (refPoint) g.position.copy(refPoint);
    g.userData.moveGroup.visible = showMove;
    g.userData.rotateGroup.visible = showRotate;
    g.userData.scaleGroup.visible = showScale;

    if (dg) {
      dg.visible = showScaleDir;
      if (showScaleDir) {
        const min = new THREE.Vector3(Infinity, Infinity, Infinity);
        const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
        indices.forEach((vi) => { min.min(obj.meshData.vertices[vi]); max.max(obj.meshData.vertices[vi]); });
        const center = min.clone().add(max).multiplyScalar(0.5);
        dg.children.forEach((dot) => {
          const axis = dot.userData.gizmoAxis, sign = dot.userData.gizmoSign;
          const p = center.clone();
          if (axis === "x") p.x = sign > 0 ? max.x : min.x;
          else if (axis === "y") p.y = sign > 0 ? max.y : min.y;
          else p.z = sign > 0 ? max.z : min.z;
          dot.position.copy(p);
        });
      }
    }
  }, [getSelectedObj, activeTool]);

  useEffect(() => { updateGizmoTransform(); }, [activeTool, selMode, selectedId, selectionInfo, updateGizmoTransform]);

  // ---------------------------------------------------------------------
  // criação de objetos
  // ---------------------------------------------------------------------
  const addObjectFromMeshData = useCallback((meshData, name) => {
    // material/geometria de verdade são preenchidos pelo refreshObjectVisuals logo
    // abaixo — este aqui é só um placeholder pra dar algo pro THREE.Mesh existir com
    const mesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial());
    sceneRef.current.add(mesh);
    const id = nextIdRef.current++;
    const obj = { id, name, meshData, mesh, vertHelper: null, edgeHelper: null, faceHighlight: null, selMarker: null, hoverMarker: null, cutPreview: null, edgesList: [], faceMaterials: new Map() };
    objectsRef.current.push(obj);
    refreshObjectVisuals(obj);
    setObjectsList(objectsRef.current.map((o) => ({ id: o.id, name: o.name })));
    return obj;
  }, [refreshObjectVisuals]);

  const selectObject = useCallback((id) => {
    selectedIdRef.current = id;
    setSelectedId(id);
    selectionRef.current = id != null && selMode === SELMODE.MESH ? { type: "mesh" } : null;
    setSelectionInfo(selectionRef.current);
    clearSelectionHighlight();
    objectsRef.current.forEach((o) => {
      if (o.vertHelper) o.vertHelper.visible = selMode === SELMODE.VERTEX && o.id === id;
      if (o.edgeHelper) o.edgeHelper.visible = selMode !== SELMODE.MESH && o.id === id;
    });
  }, [clearSelectionHighlight, selMode]);

  // trocar o modo de seleção (1/2/3/4) descarta a seleção de componente atual —
  // evita que um gizmo de "mover objeto" (type:'mesh') sobreviva ao trocar para
  // vértice/aresta/face, o que violaria a regra de mover ser exclusivo do modo Malha
  useEffect(() => {
    selectionRef.current = null;
    setSelectionInfo(null);
    updateSelectionHighlight();
    updateGizmoTransform();
    hoverRef.current = null;
    updateHoverHighlight();
    // eslint-disable-next-line react-hooks/exhaustive-deps -- só deve reagir à TROCA de selMode;
    // updateSelectionHighlight/updateGizmoTransform mudam de identidade a cada troca de ferramenta
    // (activeTool), o que disparia esta limpeza de seleção indevidamente a cada W/R/E/Q
  }, [selMode]);

  // bisel "ao vivo": reaplica o bisel a partir da malha original toda vez que
  // Steps/Shape/Width mudam enquanto o preview (tecla F) está ativo
  useEffect(() => {
    if (bevelPreviewRef.current) applyBevelPreviewNow();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [toolParams.bevelSteps, toolParams.bevelShape, toolParams.bevelWidth]);

  // ---------------------------------------------------------------------
  // three.js: inicialização, 4 viewports e loop de renderização
  // ---------------------------------------------------------------------
  useEffect(() => {
    const container = mountRef.current;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1d21);
    sceneRef.current = scene;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);
    rendererRef.current = renderer;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(4, 8, 5);
    scene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0x88aaff, 0.25);
    dirLight2.position.set(-5, 3, -4);
    scene.add(dirLight2);

    // um plano de grade por vista ortográfica (Top = XZ, Front = XY, Side = ZY) — sem
    // isso, um único grid no plano XZ aparece de perfil (uma linha só) nas vistas
    // Frente/Lado, já que a direção de visão delas está contida nesse mesmo plano.
    // Cada malha começa vazia (0 divisões) — o número de linhas é recalculado a cada
    // frame em updateOrthoGrid, de acordo com o zoom da câmera, sempre mantendo cada
    // célula do tamanho REAL do grid (gridSize), só variando quantas cabem na vista.
    function makeGridLines() {
      const geo = new THREE.BufferGeometry();
      const mat = new THREE.LineBasicMaterial({ vertexColors: true });
      const lines = new THREE.LineSegments(geo, mat);
      lines.userData.divisions = -1;
      lines.userData.colorCenter = new THREE.Color(0x555b63);
      lines.userData.colorGrid = new THREE.Color(0x33383e);
      return lines;
    }
    const topGrid = makeGridLines();
    topGrid.layers.set(1);
    scene.add(topGrid);
    const frontGrid = makeGridLines();
    frontGrid.rotation.x = Math.PI / 2;
    frontGrid.layers.set(2);
    scene.add(frontGrid);
    const sideGrid = makeGridLines();
    sideGrid.rotation.z = Math.PI / 2;
    sideGrid.layers.set(3);
    scene.add(sideGrid);
    gridHelperRef.current = [topGrid, frontGrid, sideGrid];

    const axes = new THREE.AxesHelper(0.6);
    scene.add(axes);

    const gizmo = buildGizmo();
    scene.add(gizmo);
    gizmoRef.current = gizmo;

    const dirScaleGizmo = buildDirScaleGizmo();
    scene.add(dirScaleGizmo);
    dirScaleGizmoRef.current = dirScaleGizmo;

    // ---- câmeras dos 4 painéis ----
    const perspCam = new THREE.PerspectiveCamera(60, 1, 0.05, 500);
    const startPos = new THREE.Vector3(6, 5, 8);
    const startTarget = new THREE.Vector3(0, 0.5, 0);
    const toTarget = startTarget.clone().sub(startPos);
    const dist = toTarget.length();
    perspCam.userData = { yaw: Math.atan2(toTarget.x, toTarget.z), pitch: Math.asin(toTarget.y / dist), flySpeed: 5 };
    perspCam.position.copy(startPos);

    function makeOrthoCam(dirVec) {
      const c = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 200);
      c.userData = { size: 6, center: new THREE.Vector3(0, 0, 0) };
      c.dir = dirVec;
      return c;
    }
    const topCam = makeOrthoCam(new THREE.Vector3(0, 1, 0)); topCam.up.set(0, 0, -1);
    const frontCam = makeOrthoCam(new THREE.Vector3(0, 0, 1)); frontCam.up.set(0, 1, 0);
    const sideCam = makeOrthoCam(new THREE.Vector3(1, 0, 0)); sideCam.up.set(0, 1, 0);
    perspCam.layers.enable(1); // a perspectiva mostra o "chão" (grade do Top)
    topCam.layers.enable(1);
    frontCam.layers.enable(2);
    sideCam.layers.enable(3);

    function placeOrtho(cam) {
      const d = 80;
      cam.position.copy(cam.userData.center).addScaledVector(cam.dir, d);
      cam.lookAt(cam.userData.center);
    }
    placeOrtho(topCam); placeOrtho(frontCam); placeOrtho(sideCam);

    viewportsRef.current = [
      { id: "persp", label: "Perspectiva", type: "persp", camera: perspCam },
      { id: "top", label: "Superior (Top)", type: "ortho", camera: topCam, dir: topCam.dir },
      { id: "front", label: "Frente (Front)", type: "ortho", camera: frontCam, dir: frontCam.dir },
      { id: "side", label: "Lado (Side)", type: "ortho", camera: sideCam, dir: sideCam.dir },
    ];

    function updateOrthoFrustum(cam, aspect) {
      const s = cam.userData.size;
      cam.left = -s * aspect; cam.right = s * aspect; cam.top = s; cam.bottom = -s;
      cam.updateProjectionMatrix();
    }

    function updatePerspFromYawPitch() {
      const u = perspCam.userData;
      const dir = new THREE.Vector3(Math.cos(u.pitch) * Math.sin(u.yaw), Math.sin(u.pitch), Math.cos(u.pitch) * Math.cos(u.yaw));
      perspCam.lookAt(perspCam.position.clone().add(dir));
    }
    updatePerspFromYawPitch();
    container.__updatePerspLook = updatePerspFromYawPitch;

    // mantém a grade de cada vista ortográfica sempre cobrindo bem mais do que a área
    // visível da respectiva câmera, e realinhada ao centro dela — sem isso, dar zoom out
    // deixa a grade pequena, sobrando fundo vazio ao redor. A célula da grade fica SEMPRE
    // do tamanho real do gridSize (o mesmo valor do snap) — só a quantidade de linhas
    // varia com o zoom, senão a grade visualmente desalinha do tamanho real do snap.
    function updateOrthoGrid(grid, cam, axisU, axisV, axisDepth) {
      if (!grid || !cam || !cam.userData) return;
      const cell = gridSizeRef.current;
      const span = cam.userData.size * 6;
      let divisions = Math.ceil(span / cell);
      divisions = Math.max(8, Math.min(500, divisions));
      if (divisions % 2 !== 0) divisions += 1;
      if (grid.userData.divisions !== divisions) {
        grid.userData.divisions = divisions;
        const half = divisions / 2;
        const positions = [];
        const colors = [];
        const cc = grid.userData.colorCenter, cg = grid.userData.colorGrid;
        for (let i = 0; i <= divisions; i++) {
          const k = -half + i;
          const col = i === half ? cc : cg;
          positions.push(-half, 0, k, half, 0, k, k, 0, -half, k, 0, half);
          for (let j = 0; j < 4; j++) colors.push(col.r, col.g, col.b);
        }
        grid.geometry.dispose();
        grid.geometry = new THREE.BufferGeometry();
        grid.geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        grid.geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      }
      grid.scale.set(cell, 1, cell);
      const center = cam.userData.center;
      const pos = new THREE.Vector3();
      pos[axisU] = Math.round(center[axisU] / cell) * cell;
      pos[axisV] = Math.round(center[axisV] / cell) * cell;
      pos[axisDepth] = 0;
      grid.position.copy(pos);
    }

    function render() {
      const w = container.clientWidth, h = container.clientHeight;
      if (!w || !h) return;
      updateOrthoGrid(topGrid, topCam, "x", "z", "y");
      updateOrthoGrid(frontGrid, frontCam, "x", "y", "z");
      updateOrthoGrid(sideGrid, sideCam, "z", "y", "x");
      renderer.setScissorTest(true);
      const rects = getQuadRects(w, h);
      rects.forEach(({ vp: v, x, y, w: vw, h: vh }) => {
        if (!v || vw <= 0 || vh <= 0) return;
        v.lastW = vw; v.lastH = vh;
        const aspect = vw / vh;
        if (v.type === "persp") { v.camera.aspect = aspect; v.camera.updateProjectionMatrix(); }
        else updateOrthoFrustum(v.camera, aspect);
        // vértices/arestas atrás do próprio objeto só ficam escondidos na viewport em
        // perspectiva (a "principal") — nas 3 ortográficas continuam sempre visíveis
        // (modo raio-X), que é o jeito mais útil de usar essas views pra alinhar peças
        const occludeHelpers = v.type === "persp";
        objectsRef.current.forEach((obj) => {
          if (obj.vertHelper) obj.vertHelper.material.depthTest = occludeHelpers;
          if (obj.edgeHelper) obj.edgeHelper.material.depthTest = occludeHelpers;
        });
        renderer.setViewport(x, y, vw, vh);
        renderer.setScissor(x, y, vw, vh);
        renderer.render(scene, v.camera);
      });
    }

    let raf;
    function animate() {
      raf = requestAnimationFrame(animate);
      const dt = Math.min(clockRef.current.getDelta(), 0.1);
      if (gizmoRef.current && gizmoRef.current.visible) {
        const d = perspCam.position.distanceTo(gizmoRef.current.position);
        // o piso (antes 0.3) impedia o gizmo de continuar encolhendo com a câmera bem
        // perto de um detalhe pequeno — ficava do mesmo tamanho absoluto ali, ou seja,
        // gigante na tela — baixado bastante pra acompanhar de verdade o zoom de perto
        const s = THREE.MathUtils.clamp(d * 0.22, 0.05, 30);
        gizmoRef.current.scale.setScalar(s);
      }
      if (dirScaleGizmoRef.current && dirScaleGizmoRef.current.visible) {
        // cada bolinha escala pela SUA própria distância à câmera (mantendo a POSIÇÃO
        // absoluta, que segue a extensão real do objeto — só o tamanho visual muda)
        dirScaleGizmoRef.current.children.forEach((dot) => {
          const d = perspCam.position.distanceTo(dot.position);
          dot.scale.setScalar(THREE.MathUtils.clamp(d * 0.045, 0.08, 6));
        });
      }
      // bolinhas/cilindros de hover e seleção de vértice/aresta (e o preview do Corte)
      // não tinham NENHUM ajuste de escala por distância — ficavam com tamanho fixo no
      // mundo, então quanto mais perto a câmera chegava de um detalhe pequeno, maiores
      // (e mais atrapalhando a visão/seleção) eles pareciam na tela. Mesma lógica do
      // gizmo acima: escala proporcional à distância, com teto/piso só pra não sumir
      // nem ficar gigante em casos extremos.
      objectsRef.current.forEach((obj) => {
        [obj.hoverMarker, obj.selMarker, obj.cutPreview].forEach((marker) => {
          if (!marker) return;
          marker.traverse((child) => {
            if (!child.isMesh) return;
            const d = perspCam.position.distanceTo(child.position);
            const s = THREE.MathUtils.clamp(d * 0.5, 0.1, 6);
            if (child.geometry && child.geometry.type === "CylinderGeometry") child.scale.set(s, 1, s);
            else child.scale.setScalar(s);
          });
        });
      });
      if (mouseButtonsRef.current.right && activeViewportIdRef.current === "persp") {
        const u = perspCam.userData;
        const forward = new THREE.Vector3(Math.cos(u.pitch) * Math.sin(u.yaw), Math.sin(u.pitch), Math.cos(u.pitch) * Math.cos(u.yaw));
        const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
        const up = new THREE.Vector3(0, 1, 0);
        const speed = u.flySpeed * (keysRef.current["shift"] ? 3 : 1) * dt;
        if (keysRef.current["w"]) perspCam.position.addScaledVector(forward, speed);
        if (keysRef.current["s"]) perspCam.position.addScaledVector(forward, -speed);
        if (keysRef.current["a"]) perspCam.position.addScaledVector(right, -speed);
        if (keysRef.current["d"]) perspCam.position.addScaledVector(right, speed);
        if (keysRef.current["e"]) perspCam.position.addScaledVector(up, speed);
        if (keysRef.current["q"]) perspCam.position.addScaledVector(up, -speed);
        updatePerspFromYawPitch();
      }
      render();
    }
    animate();

    function resize() {
      const w = container.clientWidth, h = container.clientHeight;
      if (w && h) renderer.setSize(w, h);
    }
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(container);

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      renderer.dispose();
      if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
    };
  }, []);

  // atualiza escala do grid quando o tamanho muda
  useEffect(() => {
    gridSizeRef.current = gridSize;
  }, [gridSize]);

  useEffect(() => {
    objectsRef.current.forEach((o) => {
      if (o.vertHelper) o.vertHelper.visible = selMode === SELMODE.VERTEX && o.id === selectedIdRef.current;
      if (o.edgeHelper) o.edgeHelper.visible = selMode !== SELMODE.MESH && o.id === selectedIdRef.current;
    });
  }, [selMode]);

  // ---------------------------------------------------------------------
  // ferramentas de edição
  // ---------------------------------------------------------------------
  function applyExtrudeSel() {
    const obj = getSelectedObj();
    if (!obj || !selectionRef.current || selectionRef.current.type !== "face" || !selectionRef.current.indices.length) {
      setStatus("Selecione uma ou mais faces (tecla 3) para extrudar.");
      return;
    }
    try {
      pushUndoSnapshot();
      const count = selectionRef.current.indices.length;
      selectionRef.current.indices.forEach((fi) => extrudeFace(obj.meshData, fi, toolParams.extrudeDist));
      refreshObjectVisuals(obj);
      updateSelectionHighlight();
      setStatus(`${count} face(s) extrudada(s).`);
    } catch (err) { setStatus("Erro ao extrudar: " + err.message); }
  }

  function quickExtrudeWithGizmo() {
    const obj = getSelectedObj();
    if (!obj || !selectionRef.current || selectionRef.current.type !== "face" || !selectionRef.current.indices.length) {
      setStatus("Selecione uma ou mais faces para extrudar.");
      return;
    }
    try {
      pushUndoSnapshot();
      const indices = selectionRef.current.indices.slice();
      indices.forEach((fi) => extrudeFace(obj.meshData, fi, 0.001));
      selectionRef.current = { type: "face", indices };
      setSelectionInfo({ ...selectionRef.current });
      refreshObjectVisuals(obj);
      updateSelectionHighlight();
      setActiveTool(TOOL.MOVE);
      updateGizmoTransform();
      setStatus("Face(s) extrudada(s) — arraste uma seta do gizmo para ajustar a profundidade.");
    } catch (err) { setStatus("Erro ao extrudar: " + err.message); }
  }

  // setas do teclado: move a seleção um passo da grade na direção pressionada
  // (mapeada pro eixo do mundo mais alinhado com "direita"/"cima" da câmera ativa
  // no momento — travado sempre num eixo só, igual ao arraste de uma flecha do
  // gizmo); Shift+seta faz o mesmo mas extrudando (só para face ou aresta aberta)
  function handleArrowKey(e) {
    const dirKey = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
    if (!dirKey) return false;
    const obj = getSelectedObj();
    const sel = selectionRef.current;
    if (!obj || !sel) return false;
    const vp = viewportsRef.current.find((v) => v.id === activeViewportIdRef.current) || viewportsRef.current[0];
    if (!vp) return false;
    const cam = vp.camera;
    cam.updateMatrixWorld();
    const rightAxis = snapToNearestAxis(new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0));
    const upAxis = snapToNearestAxis(new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1));
    let dirVec;
    if (dirKey === "left") dirVec = rightAxis.clone().negate();
    else if (dirKey === "right") dirVec = rightAxis.clone();
    else if (dirKey === "up") dirVec = upAxis.clone();
    else dirVec = upAxis.clone().negate();
    const offset = dirVec.multiplyScalar(gridSize);

    if (e.shiftKey) {
      if (sel.type === "face" && sel.indices.length) {
        pushUndoSnapshot();
        const indices = sel.indices.slice();
        indices.forEach((fi) => extrudeFaceOffset(obj.meshData, fi, offset));
        selectionRef.current = { type: "face", indices };
        setSelectionInfo({ ...selectionRef.current });
        refreshObjectVisuals(obj);
        updateSelectionHighlight();
        updateGizmoTransform();
        setStatus("Face extrudada com a seta.");
        return true;
      }
      if (sel.type === "edge" && sel.pairs.length) {
        pushUndoSnapshot();
        const faceIndices = sel.pairs.map(([a, b]) => extrudeEdge(obj.meshData, a, b, offset));
        selectionRef.current = { type: "face", indices: faceIndices };
        setSelectionInfo({ ...selectionRef.current });
        refreshObjectVisuals(obj);
        updateSelectionHighlight();
        updateGizmoTransform();
        setStatus("Aresta extrudada com a seta.");
        return true;
      }
      setStatus("Selecione uma face (ou aresta aberta) para extrudar com Shift+seta.");
      return true;
    }

    const targetIndices = selectionVertexIndices(obj.meshData, sel);
    if (!targetIndices.length) return false;
    pushUndoSnapshot();
    targetIndices.forEach((vi) => obj.meshData.vertices[vi].add(offset));
    refreshObjectVisuals(obj);
    updateSelectionHighlight();
    updateGizmoTransform();
    setStatus("Seleção movida com a seta.");
    return true;
  }

  // Bisel "ao vivo" (tecla F): abre um preview que já mostra o resultado com os valores
  // atuais de Steps/Shape/Width, e continua recalculando a cada ajuste desses valores —
  // pressionar F de novo (ou Enter) confirma; Esc cancela e volta pro estado anterior
  function applyBevelPreviewNow() {
    const bp = bevelPreviewRef.current;
    if (!bp) return;
    const obj = bp.obj;
    obj.meshData = cloneMeshData(bp.baseMeshData);
    try {
      if (bp.kind === "vertex") {
        bp.targets.forEach((vi) => bevelVertex(obj.meshData, vi, toolParams.bevelWidth, toolParams.bevelSteps, toolParams.bevelShape));
      } else {
        bevelEdges(obj.meshData, bp.targets, toolParams.bevelWidth, toolParams.bevelSteps, toolParams.bevelShape);
      }
    } catch (err) { /* mantém a última malha válida se um valor intermediário do slider gerar erro */ }
    refreshObjectVisuals(obj);
  }

  function startBevelPreview() {
    if (bevelPreviewRef.current) { confirmBevelPreview(); return; }
    const obj = getSelectedObj();
    const sel = selectionRef.current;
    if (!obj || !sel || (sel.type !== "vertex" && sel.type !== "edge") || (sel.type === "vertex" ? !sel.indices.length : !sel.pairs.length)) {
      setStatus("Selecione um ou mais vértices (1) ou arestas (2) para biselar.");
      return;
    }
    bevelPreviewRef.current = {
      obj,
      baseMeshData: cloneMeshData(obj.meshData),
      kind: sel.type,
      targets: sel.type === "vertex" ? sel.indices.slice() : sel.pairs.map((p) => p.slice()),
    };
    applyBevelPreviewNow();
    setBevelPreviewInfo({ kind: bevelPreviewRef.current.kind });
    setStatus("Bisel ao vivo — ajuste Steps/Shape/Width e veja o resultado. F ou Enter confirma, Esc cancela.");
  }

  function confirmBevelPreview() {
    const bp = bevelPreviewRef.current;
    if (!bp) return;
    const baseSnapshot = objectsRef.current.map((o) => (o.id === bp.obj.id
      ? { id: o.id, name: o.name, vertices: bp.baseMeshData.vertices.map((v) => v.toArray()), faces: bp.baseMeshData.faces.map((f) => f.slice()) }
      : { id: o.id, name: o.name, vertices: o.meshData.vertices.map((v) => v.toArray()), faces: o.meshData.faces.map((f) => f.slice()) }));
    undoStackRef.current.push(baseSnapshot);
    if (undoStackRef.current.length > MAX_UNDO) undoStackRef.current.shift();
    redoStackRef.current = [];
    bevelPreviewRef.current = null;
    setBevelPreviewInfo(null);
    selectionRef.current = null; setSelectionInfo(null);
    updateSelectionHighlight();
    setStatus("Bisel aplicado.");
  }

  function cancelBevelPreview() {
    const bp = bevelPreviewRef.current;
    if (!bp) return;
    bp.obj.meshData = bp.baseMeshData;
    refreshObjectVisuals(bp.obj);
    bevelPreviewRef.current = null;
    setBevelPreviewInfo(null);
    setStatus("Bisel cancelado.");
  }

  function applyArcSel() {
    const obj = getSelectedObj();
    if (!obj || !selectionRef.current || selectionRef.current.type !== "edge" || !selectionRef.current.pairs.length) {
      setStatus("Selecione uma ou mais arestas (tecla 2) para o arco.");
      return;
    }
    try {
      pushUndoSnapshot();
      const count = selectionRef.current.pairs.length;
      selectionRef.current.pairs.forEach(([a, b]) => arcEdge(obj.meshData, a, b, toolParams.arcSegments, toolParams.arcBulge));
      selectionRef.current = null; setSelectionInfo(null);
      refreshObjectVisuals(obj); updateSelectionHighlight();
      setStatus(`Arco aplicado em ${count} aresta(s).`);
    } catch (err) { setStatus("Erro no arco: " + err.message); }
  }

  function applyRotateSel() {
    const obj = getSelectedObj();
    if (!obj) { setStatus("Selecione um objeto para girar."); return; }
    const angleRad = THREE.MathUtils.degToRad(angleSnapDeg);
    const sel = selectionRef.current;
    if (!sel) { setStatus("Selecione uma aresta, faces ou a malha inteira (tecla 4) para girar."); return; }
    const indices = selectionVertexIndices(obj.meshData, sel);
    if (!indices.length || (sel.type === "vertex" && indices.length <= 1)) {
      setStatus("Selecione mais de um elemento (aresta, faces ou a malha inteira) para girar.");
      return;
    }
    try {
      pushUndoSnapshot();
      const pivot = indices.reduce((acc, vi) => acc.add(obj.meshData.vertices[vi]), new THREE.Vector3()).divideScalar(indices.length);
      const axis = (sel.type === "face" && sel.indices.length === 1)
        ? computeFaceNormal(obj.meshData.vertices, obj.meshData.faces[sel.indices[0]])
        : new THREE.Vector3(0, 1, 0);
      rotateVerticesAroundAxis(obj.meshData.vertices, indices, pivot, axis, angleRad);
      refreshObjectVisuals(obj); updateSelectionHighlight(); updateGizmoTransform();
      setStatus("Seleção girada.");
    } catch (err) { setStatus("Erro ao girar: " + err.message); }
  }

  function applyScaleSel() {
    const obj = getSelectedObj();
    if (!obj) { setStatus("Selecione um objeto para escalar."); return; }
    const sel = selectionRef.current;
    if (!sel) { setStatus("Selecione uma aresta, faces ou a malha inteira (tecla 4) para escalar."); return; }
    const indices = selectionVertexIndices(obj.meshData, sel);
    if (!indices.length) { setStatus("Nada selecionado para escalar."); return; }
    try {
      pushUndoSnapshot();
      const pivot = indices.reduce((acc, vi) => acc.add(obj.meshData.vertices[vi]), new THREE.Vector3()).divideScalar(indices.length);
      indices.forEach((vi) => {
        const v = obj.meshData.vertices[vi];
        v.sub(pivot).multiplyScalar(toolParams.scaleFactor).add(pivot);
      });
      refreshObjectVisuals(obj); updateSelectionHighlight(); updateGizmoTransform();
      setStatus(`Seleção escalada em ${toolParams.scaleFactor}x.`);
    } catch (err) { setStatus("Erro ao escalar: " + err.message); }
  }

  function removeObjectFromScene(obj) {
    sceneRef.current.remove(obj.mesh);
    if (obj.vertHelper) sceneRef.current.remove(obj.vertHelper);
    if (obj.edgeHelper) sceneRef.current.remove(obj.edgeHelper);
    clearSelectionHighlight();
    clearHoverHighlight();
    clearCutPreview(obj);
    hoverRef.current = null;
    objectsRef.current = objectsRef.current.filter((o) => o.id !== obj.id);
    setObjectsList(objectsRef.current.map((o) => ({ id: o.id, name: o.name })));
    selectObject(null);
  }

  // funde um objeto da cena (sourceId) dentro do objeto atualmente selecionado —
  // os dois viram um único objeto (mesma malha, sem aresta nova ligando as partes),
  // e o objeto de origem some da lista. Pedido explícito do usuário: como não existe
  // uma ferramenta de união booleana aqui, "fundir" só significa "tratar como um
  // objeto só na cena", já que pra edição de malha (extrudar, biselar etc.) o que
  // importa é estarem no mesmo meshData, não estarem topologicamente conectados.
  function mergeObjectInto(sourceId) {
    const target = getSelectedObj();
    const source = getObj(sourceId);
    if (!target || !source || target.id === source.id) return;
    pushUndoSnapshot();
    mergeMeshDataInto(target.meshData, source.meshData);
    removeObjectFromScene(source);
    refreshObjectVisuals(target);
    selectObject(target.id);
    setStatus(`"${source.name}" fundido em "${target.name}".`);
  }

  const MAX_UNDO = 50;

  function snapshotScene() {
    return objectsRef.current.map((o) => ({
      id: o.id,
      name: o.name,
      vertices: o.meshData.vertices.map((v) => v.toArray()),
      faces: o.meshData.faces.map((f) => f.slice()),
    }));
  }

  function pushUndoSnapshot() {
    undoStackRef.current.push(snapshotScene());
    if (undoStackRef.current.length > MAX_UNDO) undoStackRef.current.shift();
    redoStackRef.current = [];
  }

  function restoreSnapshot(snap) {
    const snapIds = new Set(snap.map((s) => s.id));
    objectsRef.current.forEach((o) => {
      if (!snapIds.has(o.id)) {
        sceneRef.current.remove(o.mesh);
        if (o.vertHelper) sceneRef.current.remove(o.vertHelper);
        if (o.edgeHelper) sceneRef.current.remove(o.edgeHelper);
      }
    });
    const newObjects = snap.map((s) => {
      const meshData = { vertices: s.vertices.map((a) => new THREE.Vector3(a[0], a[1], a[2])), faces: s.faces.map((f) => f.slice()) };
      let obj = objectsRef.current.find((o) => o.id === s.id);
      if (obj) {
        obj.meshData = meshData;
        obj.name = s.name;
      } else {
        // objeto tinha sido excluído — recria com material padrão (materiais por face não entram no histórico)
        const mesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial());
        sceneRef.current.add(mesh);
        obj = { id: s.id, name: s.name, meshData, mesh, vertHelper: null, edgeHelper: null, faceHighlight: null, selMarker: null, hoverMarker: null, cutPreview: null, edgesList: [], faceMaterials: new Map() };
      }
      refreshObjectVisuals(obj);
      return obj;
    });
    objectsRef.current = newObjects;
    setObjectsList(newObjects.map((o) => ({ id: o.id, name: o.name })));
    selectedIdRef.current = null; setSelectedId(null);
    selectionRef.current = null; setSelectionInfo(null);
    clearSelectionHighlight();
    updateGizmoTransform();
  }

  function undo() {
    if (!undoStackRef.current.length) { setStatus("Nada para desfazer."); return; }
    redoStackRef.current.push(snapshotScene());
    const snap = undoStackRef.current.pop();
    restoreSnapshot(snap);
    setStatus("Ação desfeita.");
  }

  function redo() {
    if (!redoStackRef.current.length) { setStatus("Nada para refazer."); return; }
    undoStackRef.current.push(snapshotScene());
    const snap = redoStackRef.current.pop();
    restoreSnapshot(snap);
    setStatus("Ação refeita.");
  }

  function deleteSelectionAction() {
    const obj = getSelectedObj();
    if (!obj || !selectionRef.current) { setStatus("Nada selecionado."); return; }
    try {
      pushUndoSnapshot();
      const sel = selectionRef.current;
      if (sel.type === "mesh") {
        removeObjectFromScene(obj);
        setStatus("Objeto removido.");
        return;
      } else if (sel.type === "face") {
        sel.indices.slice().sort((a, b) => b - a).forEach((fi) => obj.meshData.faces.splice(fi, 1));
      } else if (sel.type === "vertex") {
        deleteVerticesFromMesh(obj.meshData, sel.indices);
      } else if (sel.type === "edge") {
        let failed = 0;
        sel.pairs.forEach(([a, b]) => { if (!dissolveEdge(obj.meshData, a, b)) failed++; });
        selectionRef.current = null; setSelectionInfo(null);
        refreshObjectVisuals(obj); updateSelectionHighlight();
        setStatus(failed ? `${failed} aresta(s) não removida(s) (só é possível dissolver arestas entre exatamente 2 faces).` : "Aresta(s) removida(s).");
        return;
      } else {
        return;
      }
      selectionRef.current = null; setSelectionInfo(null);
      refreshObjectVisuals(obj); updateSelectionHighlight();
      setStatus("Elemento(s) excluído(s).");
    } catch (err) { setStatus("Erro ao excluir: " + err.message); }
  }

  function mergeSelectedVertices() {
    const obj = getSelectedObj();
    if (!obj || !selectionRef.current) { setStatus("Selecione vértices ou uma aresta (Shift+clique para somar) para fundir."); return; }
    const indices = Array.from(new Set(selectionVertexIndices(obj.meshData, selectionRef.current))).sort((a, b) => a - b);
    if (indices.length < 2) { setStatus("Selecione ao menos 2 vértices (ou uma aresta) para fundir."); return; }
    try {
      pushUndoSnapshot();
      const target = indices.reduce((acc, vi) => acc.add(obj.meshData.vertices[vi]), new THREE.Vector3()).divideScalar(indices.length);
      const keep = indices[0];
      obj.meshData.vertices[keep].copy(target);
      const remap = new Map();
      indices.slice(1).forEach((vi) => remap.set(vi, keep));
      obj.meshData.faces = obj.meshData.faces
        .map((f) => f.map((vi) => (remap.has(vi) ? keep : vi)))
        .map((f) => f.filter((vi, i) => vi !== f[(i - 1 + f.length) % f.length]))
        .filter((f) => f.length >= 3);
      indices.slice(1).reverse().forEach((vi) => {
        obj.meshData.vertices.splice(vi, 1);
        obj.meshData.faces = obj.meshData.faces.map((f) => f.map((idx) => (idx > vi ? idx - 1 : idx)));
      });
      selectionRef.current = { type: "vertex", indices: [keep] };
      setSelectionInfo({ ...selectionRef.current });
      refreshObjectVisuals(obj); updateSelectionHighlight(); updateGizmoTransform();
      setStatus(`${indices.length} vértices fundidos em 1.`);
    } catch (err) { setStatus("Erro ao fundir: " + err.message); }
  }

  function bridgeSelectedEdges() {
    const obj = getSelectedObj();
    if (!obj || !selectionRef.current || selectionRef.current.type !== "edge" || selectionRef.current.pairs.length !== 2) {
      setStatus("Selecione exatamente 2 arestas (Shift+clique na segunda) para usar o Bridge.");
      return;
    }
    try {
      pushUndoSnapshot();
      const [[a1, b1], [a2, b2]] = selectionRef.current.pairs;
      const va1 = obj.meshData.vertices[a1], vb1 = obj.meshData.vertices[b1];
      const va2 = obj.meshData.vertices[a2], vb2 = obj.meshData.vertices[b2];
      const dStraight = va1.distanceTo(va2) + vb1.distanceTo(vb2);
      const dCrossed = va1.distanceTo(vb2) + vb1.distanceTo(va2);
      const face = dStraight <= dCrossed ? [a1, b1, b2, a2] : [a1, b1, a2, b2];
      obj.meshData.faces.push(face);
      selectionRef.current = { type: "face", indices: [obj.meshData.faces.length - 1] };
      setSelectionInfo({ ...selectionRef.current });
      refreshObjectVisuals(obj); updateSelectionHighlight(); updateGizmoTransform();
      setStatus("Ponte (bridge) criada entre as duas arestas.");
    } catch (err) { setStatus("Erro no bridge: " + err.message); }
  }

  function connectEdgesSelected() {
    const obj = getSelectedObj();
    const sel = selectionRef.current;
    if (!obj || !sel || sel.type !== "edge" || sel.pairs.length !== 2) {
      setStatus("Selecione exatamente 2 arestas (Shift+clique na segunda) para conectar.");
      return;
    }
    const [[e1a, e1b], [e2a, e2b]] = sel.pairs;
    function faceHasEdge(face, a, b) {
      const n = face.length;
      for (let i = 0; i < n; i++) {
        const p = face[i], q = face[(i + 1) % n];
        if ((p === a && q === b) || (p === b && q === a)) return true;
      }
      return false;
    }
    const faceIndex = obj.meshData.faces.findIndex((f) => faceHasEdge(f, e1a, e1b) && faceHasEdge(f, e2a, e2b));
    if (faceIndex === -1) { setStatus("As arestas selecionadas não pertencem à mesma face."); return; }
    try {
      pushUndoSnapshot();
      sliceFace(obj.meshData, faceIndex, [e1a, e1b], 0.5, [e2a, e2b], 0.5);
      const newB = obj.meshData.vertices.length - 1, newA = obj.meshData.vertices.length - 2;
      selectionRef.current = { type: "edge", pairs: [[newA, newB]] };
      setSelectionInfo({ ...selectionRef.current });
      refreshObjectVisuals(obj); updateSelectionHighlight(); updateGizmoTransform();
      setStatus("Arestas conectadas pelo centro — arraste a linha pelo gizmo de Mover.");
    } catch (err) { setStatus("Erro ao conectar: " + err.message); }
  }

  function connectSelected() {
    const obj = getSelectedObj();
    if (selectionRef.current && selectionRef.current.type === "edge") { connectEdgesSelected(); return; }
    if (!obj || !selectionRef.current || selectionRef.current.type !== "vertex" || selectionRef.current.indices.length !== 2) {
      setStatus("Selecione exatamente 2 vértices ou 2 arestas (Shift+clique no segundo) para conectar.");
      return;
    }
    const [vA, vB] = selectionRef.current.indices;
    const faceIndex = obj.meshData.faces.findIndex((f) => f.includes(vA) && f.includes(vB));
    if (faceIndex === -1) { setStatus("Os vértices selecionados não pertencem à mesma face."); return; }
    try {
      pushUndoSnapshot();
      const face = obj.meshData.faces[faceIndex];
      const n = face.length;
      const idxA = face.indexOf(vA), idxB = face.indexOf(vB);
      if (Math.abs(idxA - idxB) <= 1 || Math.abs(idxA - idxB) === n - 1) { setStatus("Esses vértices já são ligados por uma aresta."); return; }
      const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
      const loopA = face.slice(lo, hi + 1);
      const loopB = face.slice(hi).concat(face.slice(0, lo + 1));
      if (loopA.length < 3 || loopB.length < 3) { setStatus("Conexão inválida para essa face."); return; }
      obj.meshData.faces[faceIndex] = loopA;
      obj.meshData.faces.push(loopB);
      selectionRef.current = null; setSelectionInfo(null);
      refreshObjectVisuals(obj); updateSelectionHighlight(); updateGizmoTransform();
      setStatus("Vértices conectados — face dividida.");
    } catch (err) { setStatus("Erro ao conectar: " + err.message); }
  }

  function mirrorSelectedObject() {
    const obj = getSelectedObj();
    if (!obj) { setStatus("Selecione um objeto para espelhar."); return; }
    try {
      pushUndoSnapshot();
      const center = meshCentroid(obj.meshData);
      const mirroredVerts = obj.meshData.vertices.map((v) => new THREE.Vector3(2 * center.x - v.x, v.y, v.z));
      const mirroredFaces = obj.meshData.faces.map((f) => f.slice().reverse());
      const newObj = addObjectFromMeshData({ vertices: mirroredVerts, faces: mirroredFaces }, obj.name + "_espelho");
      selectObject(newObj.id);
      setStatus("Cópia espelhada criada (eixo X).");
    } catch (err) { setStatus("Erro ao espelhar: " + err.message); }
  }

  function handleCtrlF() {
    if (selectionRef.current && selectionRef.current.type === "vertex" && selectionRef.current.indices.length === 2) {
      connectSelected();
    } else {
      mirrorSelectedObject();
    }
  }

  // Corte (C): não muda a ferramenta ativa — só arma um estado transitório.
  // Com uma FACE selecionada: clique em 2 pontos quaisquer da face pra traçar a linha de
  // corte (a reta é estendida até cruzar 2 arestas da face); Enter confirma o corte.
  // Com uma ARESTA selecionada: clique num ponto dela; Enter insere um vértice ali.
  function startCutPicking() {
    const obj = getSelectedObj();
    const sel = selectionRef.current;
    if (obj && sel && sel.type === "face" && sel.indices.length === 1) {
      cuttingRef.current = true;
      cutLineRef.current = { mode: "face", faceIndex: sel.indices[0], p1: null, p2: null };
      setStatus("Corte: clique em 2 pontos da face para traçar a linha de corte. Enter confirma, Esc cancela.");
      return;
    }
    if (obj && sel && sel.type === "edge" && sel.pairs.length === 1) {
      cuttingRef.current = true;
      cutLineRef.current = { mode: "edge", edge: sel.pairs[0], t: null };
      setStatus("Corte: clique num ponto da aresta selecionada. Enter confirma, Esc cancela.");
      return;
    }
    setStatus("Selecione uma única face (3) ou uma única aresta (2) antes de usar o Corte.");
  }

  function clearCutPreview(obj) {
    if (obj && obj.cutPreview) {
      obj.cutPreview.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
      sceneRef.current.remove(obj.cutPreview);
      obj.cutPreview = null;
    }
  }

  function updateCutPreview(obj) {
    clearCutPreview(obj);
    const cl = cutLineRef.current;
    if (!obj || !cl) return;
    const group = new THREE.Group();
    const markerMat = new THREE.MeshBasicMaterial({ color: ACCENT, depthTest: false });
    function addMarker(p) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 8), markerMat);
      m.position.copy(p);
      m.renderOrder = 30;
      group.add(m);
    }
    if (cl.mode === "face") {
      if (cl.p1) addMarker(cl.p1);
      if (cl.p2) addMarker(cl.p2);
      if (cl.p1 && cl.p2) {
        const hits = computeLineFaceIntersections(obj.meshData, cl.faceIndex, cl.p1, cl.p2);
        if (hits.length >= 2) {
          hits.sort((a, b) => a.sLine - b.sLine);
          const first = hits[0], last = hits[hits.length - 1];
          const pA = obj.meshData.vertices[first.edge[0]].clone().lerp(obj.meshData.vertices[first.edge[1]], first.t);
          const pB = obj.meshData.vertices[last.edge[0]].clone().lerp(obj.meshData.vertices[last.edge[1]], last.t);
          const geo = new THREE.BufferGeometry().setFromPoints([pA, pB]);
          const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: ACCENT, depthTest: false }));
          line.renderOrder = 29;
          group.add(line);
        }
      }
    } else {
      const [a, b] = cl.edge;
      if (cl.t != null) addMarker(obj.meshData.vertices[a].clone().lerp(obj.meshData.vertices[b], cl.t));
    }
    obj.cutPreview = group;
    sceneRef.current.add(group);
  }

  function finalizeCut() {
    const obj = getSelectedObj();
    const cl = cutLineRef.current;
    if (!obj || !cl) { cuttingRef.current = false; cutLineRef.current = null; return; }
    try {
      if (cl.mode === "face") {
        if (!cl.p1 || !cl.p2) { setStatus("Clique nos 2 pontos da linha de corte antes de confirmar."); return; }
        const hits = computeLineFaceIntersections(obj.meshData, cl.faceIndex, cl.p1, cl.p2);
        if (hits.length < 2) { setStatus("Essa linha não cruza duas arestas da face — ajuste os pontos."); return; }
        hits.sort((a, b) => a.sLine - b.sLine);
        const first = hits[0], last = hits[hits.length - 1];
        pushUndoSnapshot();
        sliceFace(obj.meshData, cl.faceIndex, first.edge, first.t, last.edge, last.t);
        selectionRef.current = null; setSelectionInfo(null);
        refreshObjectVisuals(obj); updateSelectionHighlight();
        setStatus("Face cortada.");
      } else {
        if (cl.t == null) { setStatus("Clique num ponto da aresta antes de confirmar."); return; }
        pushUndoSnapshot();
        insertVertexOnEdge(obj.meshData, cl.edge[0], cl.edge[1], cl.t);
        selectionRef.current = null; setSelectionInfo(null);
        refreshObjectVisuals(obj); updateSelectionHighlight();
        setStatus("Vértice inserido na aresta.");
      }
    } catch (err) { setStatus("Erro no corte: " + err.message); }
    clearCutPreview(obj);
    cuttingRef.current = false;
    cutLineRef.current = null;
  }

  function cancelCut() {
    const obj = getSelectedObj();
    clearCutPreview(obj);
    cuttingRef.current = false;
    cutLineRef.current = null;
  }

  // ---------------------------------------------------------------------
  // biblioteca de materiais (textura) — cada material é reutilizável entre faces e
  // objetos diferentes; aplicar um material numa face só guarda a referência (id) +
  // a transformação de UV daquela face, o material em si (texturas/parâmetros) vive
  // só aqui, uma vez, então editá-lo atualiza todo mundo que o usa de uma vez
  // ---------------------------------------------------------------------
  function getOrCreateDefaultMaterial() {
    let entry = materialsRef.current.find((m) => m.id === "__default__");
    if (!entry) {
      entry = {
        id: "__default__", name: "Padrão (cinza)", builtin: true,
        slots: { albedo: null, normal: null, roughness: null, displacement: null },
        roughness: 0.7, metalness: 0.05, dispScale: 0.02,
        threeMaterial: new THREE.MeshStandardMaterial({ color: 0xb9c4cf, roughness: 0.7, metalness: 0.05, side: THREE.DoubleSide }),
      };
      materialsRef.current = [entry, ...materialsRef.current];
    }
    return entry;
  }

  function createMaterialEntry(name) {
    const id = "mat_" + matIdCounterRef.current++;
    const entry = {
      id, name: name && name.trim() ? name.trim() : "Material " + id.slice(4),
      slots: { albedo: null, normal: null, roughness: null, displacement: null },
      // deslocamento começa BEM baixo por padrão: no THREE.js o mapa de deslocamento
      // empurra cada vértice na hora de renderizar (na GPU), e como as faces deste
      // editor são grandes e SEM subdivisão (só os cantos, sem vértices no meio), um
      // valor alto arranca a face inteira do lugar em vez de só dar um relevo sutil —
      // ver aviso ao lado do slider na aba Textura
      roughness: 0.7, metalness: 0.05, dispScale: 0.02,
      threeMaterial: new THREE.MeshStandardMaterial({ color: 0xb9c4cf, roughness: 0.7, metalness: 0.05, side: THREE.DoubleSide }),
    };
    materialsRef.current = [...materialsRef.current, entry];
    selectedMaterialIdRef.current = entry.id;
    setMatGalleryTick((t) => t + 1);
    return entry;
  }

  function renameMaterial(matId, name) {
    const entry = materialsRef.current.find((m) => m.id === matId);
    if (!entry || entry.builtin) return;
    entry.name = name.trim() || entry.name;
    setMatGalleryTick((t) => t + 1);
  }

  function updateMaterialSlot(matId, slot, file) {
    const entry = materialsRef.current.find((m) => m.id === matId);
    if (!entry || !file) return;
    const url = URL.createObjectURL(file);
    const loader = new THREE.TextureLoader();
    loader.load(url, (tex) => {
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      if (slot === "albedo") { tex.encoding = THREE.sRGBEncoding; entry.threeMaterial.map = tex; }
      if (slot === "normal") entry.threeMaterial.normalMap = tex;
      if (slot === "roughness") entry.threeMaterial.roughnessMap = tex;
      if (slot === "displacement") { entry.threeMaterial.displacementMap = tex; entry.threeMaterial.displacementScale = entry.dispScale; }
      entry.threeMaterial.needsUpdate = true;
      entry.slots[slot] = { url, name: file.name };
      setMatGalleryTick((t) => t + 1);
      setStatus(`Textura "${slot}" aplicada ao material "${entry.name}".`);
    }, undefined, () => setStatus(`Falha ao carregar "${file.name}".`));
  }

  function updateMaterialParam(matId, key, value) {
    const entry = materialsRef.current.find((m) => m.id === matId);
    if (!entry) return;
    entry[key] = value;
    if (key === "roughness") entry.threeMaterial.roughness = value;
    if (key === "metalness") entry.threeMaterial.metalness = value;
    if (key === "dispScale") entry.threeMaterial.displacementScale = value;
    entry.threeMaterial.needsUpdate = true;
    setMatGalleryTick((t) => t + 1);
  }

  function selectMaterial(matId) {
    selectedMaterialIdRef.current = matId;
    setMatGalleryTick((t) => t + 1);
  }

  // aplica um material numa ou mais faces de um objeto — usado pelo Shift+T, pelo botão
  // "Aplicar" e por arrastar o material da galeria em cima da face na viewport. Preserva
  // a transformação de UV já existente se a face já tinha esse mesmo material (só troca
  // a textura sem resetar o ajuste que a pessoa já tinha feito); começa do zero
  // (DEFAULT_UV_XF) se é a primeira vez ou se estava com outro material.
  function applyMaterialToFaces(obj, faceIndices, matId) {
    if (!obj || !faceIndices.length || !matId) return;
    faceIndices.forEach((fi) => {
      const prev = obj.faceMaterials.get(fi);
      const xf = prev && prev.materialId === matId ? prev : { ...DEFAULT_UV_XF };
      obj.faceMaterials.set(fi, { ...xf, materialId: matId });
    });
    refreshObjectVisuals(obj);
    updateSelectionHighlight();
  }

  function applySelectedMaterialToSelection() {
    const obj = getSelectedObj();
    if (!obj) { setStatus("Selecione um objeto."); return; }
    const matId = selectedMaterialIdRef.current;
    if (!matId) { setStatus("Selecione um material na aba Textura primeiro."); return; }
    const sel = selectionRef.current;
    if (!sel || sel.type !== "face" || !sel.indices.length) { setStatus("Selecione uma ou mais faces (tecla 3) para aplicar o material."); return; }
    pushUndoSnapshot();
    applyMaterialToFaces(obj, sel.indices, matId);
    const mat = materialsRef.current.find((m) => m.id === matId);
    setStatus(`Material "${mat ? mat.name : ""}" aplicado a ${sel.indices.length} face(s).`);
  }

  // altera a transformação de UV (escala/rotação/deslocamento) do material já aplicado
  // nas faces selecionadas — "editar tamanho/rotação e deslocar o material dentro de
  // uma face selecionada"
  function updateSelectedFaceUV(key, value) {
    const obj = getSelectedObj();
    const sel = selectionRef.current;
    if (!obj || !sel || sel.type !== "face" || !sel.indices.length) return;
    sel.indices.forEach((fi) => {
      const cur = obj.faceMaterials.get(fi);
      if (!cur) return;
      obj.faceMaterials.set(fi, { ...cur, [key]: value });
    });
    refreshObjectVisuals(obj);
    updateSelectionHighlight();
    // faceMaterials vive numa ref (não em state), então mudar ela não re-renderiza o
    // painel sozinha — o valor mostrado ao lado do slider ficava "preso" no último
    // render de verdade mesmo a face já tendo mudado na viewport. Esse tick força o
    // React a reler o valor atual a cada arrasto.
    setMatGalleryTick((t) => t + 1);
  }

  // "Gerar UV map": finaliza/confirma o layout de UV atual (já calculado ao vivo, face a
  // face, a partir do material+transformação de cada uma) como o UV oficial do objeto,
  // pronto pra exportar — junta tudo (todas as faces com seus materiais e ajustes) num
  // único conjunto de coordenadas UV consistente
  function generateUVMap(obj) {
    if (!obj) { setStatus("Selecione um objeto."); return; }
    refreshObjectVisuals(obj);
    const usedFaces = obj.faceMaterials.size;
    setStatus(`UV map gerado: ${usedFaces} face(s) com material, ${obj.meshData.faces.length - usedFaces} com o padrão.`);
  }

  // ---------------------------------------------------------------------
  // "pintar" textura com Alt+botão direito: propaga o material (e a MESMA
  // escala/rotação) da face de referência pras faces vizinhas que o cursor passa por
  // cima, ajustando só o deslocamento pra que a textura continue sem costura no vértice
  // compartilhado entre as duas faces — "onde a textura acabou em uma deve começar na
  // outra"
  // ---------------------------------------------------------------------
  function findSharedEdge(faceA, faceB) {
    const setB = new Set(faceB);
    const n = faceA.length;
    for (let i = 0; i < n; i++) {
      const a = faceA[i], b = faceA[(i + 1) % n];
      if (setB.has(a) && setB.has(b)) return [a, b];
    }
    return null;
  }

  function paintTextureToFace(obj, refFaceIdx, targetFaceIdx) {
    const refXf = obj.faceMaterials.get(refFaceIdx);
    if (!refXf) return false;
    const refFace = obj.meshData.faces[refFaceIdx], targetFace = obj.meshData.faces[targetFaceIdx];
    if (!refFace || !targetFace) return false;
    let xf = { ...refXf };
    const shared = findSharedEdge(refFace, targetFace);
    if (shared) {
      // acha o deslocamento que faz o vértice compartilhado cair no MESMO UV final nas
      // duas faces, mantendo a escala/rotação da referência intactas — é isso que
      // "continua" o desenho da textura em vez de cada face reiniciar do zero
      const [a] = shared;
      const refBasis = faceUVBasis(obj.meshData.vertices, refFace);
      const targetBasis = faceUVBasis(obj.meshData.vertices, targetFace);
      const pA = obj.meshData.vertices[a];
      const [refUvU, refUvV] = applyUVTransform(...projectVertexUV(pA, refBasis), refXf);
      const [tgtUvUNoOffset, tgtUvVNoOffset] = applyUVTransform(...projectVertexUV(pA, targetBasis), { ...refXf, uOffset: 0, vOffset: 0 });
      xf = { ...refXf, uOffset: refUvU - tgtUvUNoOffset, vOffset: refUvV - tgtUvVNoOffset };
    }
    obj.faceMaterials.set(targetFaceIdx, xf);
    refreshObjectVisuals(obj);
    return true;
  }

  function startTexturePaintSession(info) {
    const obj = getSelectedObj();
    const sel = selectionRef.current;
    if (!obj || !sel || sel.type !== "face" || !sel.indices.length) {
      setStatus("Selecione uma face com material antes de segurar Alt+botão direito.");
      return;
    }
    const refFaceIdx = sel.indices[sel.indices.length - 1];
    if (!obj.faceMaterials.get(refFaceIdx)) {
      setStatus("A face selecionada ainda não tem material — aplique um primeiro (Shift+T).");
      return;
    }
    pushUndoSnapshot();
    paintTextureRef.current = { obj, lastFaceIndex: refFaceIdx, painted: 0 };
    setStatus("Pintando textura — arraste sobre as faces vizinhas (solte o botão pra terminar).");
  }

  function endTexturePaintSession() {
    const session = paintTextureRef.current;
    if (!session) return;
    paintTextureRef.current = null;
    if (session.painted > 0) {
      updateSelectionHighlight();
      setStatus(`Textura propagada pra ${session.painted} face(s).`);
    }
  }

  // acha a face (de QUALQUER objeto da cena, não só o selecionado) sob um ponto da tela —
  // usado por "arrastar o material para cima da face" (a face de destino pode ser de um
  // objeto que nem está selecionado ainda)
  function pickFaceForDrop(clientX, clientY) {
    const info = getViewportAndNDC(clientX, clientY);
    if (!info) return null;
    raycasterRef.current.setFromCamera(info.ndc, info.vp.camera);
    const meshes = objectsRef.current.map((o) => o.mesh);
    const hits = raycasterRef.current.intersectObjects(meshes);
    if (!hits.length || hits[0].faceIndex == null) return null;
    const obj = objectsRef.current.find((o) => o.mesh === hits[0].object);
    if (!obj) return null;
    const faceIdx = obj.mesh.geometry.userData.faceMap[hits[0].faceIndex];
    return { obj, faceIndex: faceIdx };
  }

  function handleViewportDrop(e) {
    e.preventDefault();
    const matId = e.dataTransfer.getData("text/plain") || draggingMaterialIdRef.current;
    draggingMaterialIdRef.current = null;
    if (!matId) return;
    const hit = pickFaceForDrop(e.clientX, e.clientY);
    if (!hit) { setStatus("Solte o material em cima de uma face do objeto."); return; }
    pushUndoSnapshot();
    applyMaterialToFaces(hit.obj, [hit.faceIndex], matId);
    const mat = materialsRef.current.find((m) => m.id === matId);
    setStatus(`Material "${mat ? mat.name : ""}" aplicado por arrastar.`);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function handleExportOBJ() {
    if (objectsRef.current.length === 0) { setStatus("Nada para exportar."); return; }
    const text = exportOBJ(objectsRef.current);
    downloadBlob(new Blob([text], { type: "text/plain" }), "modelo.obj");
    setStatus("Arquivo .obj exportado.");
  }

  // exporta .obj + .mtl (com os parâmetros PBR de cada material) + os arquivos de
  // imagem de cada textura usada, todos baixados juntos com nomes que já batem entre si
  // — "integra todas as texturas" pra fora do editor, não só na visualização ao vivo
  async function handleExportOBJWithTextures() {
    if (objectsRef.current.length === 0) { setStatus("Nada para exportar."); return; }
    const defaultEntry = getOrCreateDefaultMaterial();
    const { text: objText, usedMatIds } = exportOBJWithMaterials(objectsRef.current, materialsRef.current, defaultEntry);
    const mtlText = buildMTLText(materialsRef.current, usedMatIds, defaultEntry);
    downloadBlob(new Blob([objText], { type: "text/plain" }), "modelo.obj");
    downloadBlob(new Blob([mtlText], { type: "text/plain" }), "modelo.mtl");
    const allMats = [defaultEntry, ...materialsRef.current.filter((m) => !m.builtin)];
    const usedEntries = allMats.filter((m) => usedMatIds.has(m.id));
    let textureCount = 0, failCount = 0;
    for (const m of usedEntries) {
      for (const slot of ["albedo", "normal", "roughness", "displacement"]) {
        if (!m.slots[slot]) continue;
        try {
          const resp = await fetch(m.slots[slot].url);
          const blob = await resp.blob();
          downloadBlob(blob, textureFileName(m, slot));
          textureCount++;
        } catch (err) { failCount++; }
      }
    }
    setStatus(`Exportado: modelo.obj + modelo.mtl${textureCount ? ` + ${textureCount} textura(s)` : ""}${failCount ? ` (${failCount} falharam)` : ""}. Coloque todos os arquivos na mesma pasta.`);
  }

  function handleImportOBJ(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const { vertices, faces } = parseOBJ(reader.result);
        if (vertices.length === 0 || faces.length === 0) { setStatus("Arquivo .obj vazio ou não suportado."); return; }
        const obj = addObjectFromMeshData({ vertices, faces }, file.name.replace(/\.obj$/i, ""));
        selectObject(obj.id);
        setStatus("Modelo importado: " + file.name);
      } catch (err) { setStatus("Erro ao importar: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  // ---------------------------------------------------------------------
  // entrada: mouse / teclado
  // ---------------------------------------------------------------------
  useEffect(() => {
    const container = mountRef.current;
    const dom = rendererRef.current.domElement;

    // quantas unidades do mundo cabem num pixel de tela, na profundidade de `atPoint` —
    // usado pra converter um raio de acerto em PIXELS (constante, do jeito que o usuário
    // espera) num limiar em unidades do mundo pro raycaster (que só entende unidades do
    // mundo). Sem isso, um limiar fixo fica preciso demais numa escala de zoom e
    // generoso demais (ou impossível de acertar) em outra — daí a dificuldade de
    // selecionar o vértice certo relatada, principalmente em objetos pequenos/detalhados.
    function worldPerPixelAt(vp, atPoint) {
      const cam = vp.camera;
      const h = vp.lastH || 600;
      if (cam.isOrthographicCamera) return (2 * cam.userData.size) / h;
      const d = Math.max(0.01, cam.position.distanceTo(atPoint));
      const vFov = THREE.MathUtils.degToRad(cam.fov);
      return (2 * d * Math.tan(vFov / 2)) / h;
    }

    // acerto "por pouco" numa alça do gizmo (seta/cubo/quadrado/esfera): tenta o raycast
    // preciso contra a geometria de verdade primeiro; se não achar nada, procura a alça
    // (qualquer mesh com userData.gizmoKind) cujo centro fica mais perto do RAIO do
    // mouse, dentro de uma margem generosa em PIXELS de tela (constante independente do
    // zoom). Sem isso, perder o clique por poucos pixels caía pra outros comportamentos
    // do clique (trocar seleção, Shift+Arrastar extrude, arrastar a malha inteira) —
    // exatamente o que description do usuário como "consigo mexer sem clicar na seta".
    function pickGizmoHandleGenerous(children, raycaster, vp, refPoint) {
      const hits = raycaster.intersectObjects(children, true);
      if (hits.length) return hits[0].object;
      const wpp = worldPerPixelAt(vp, refPoint);
      const threshold = wpp * 20;
      let best = null, bestDist = threshold;
      const wp = new THREE.Vector3();
      children.forEach((child) => {
        child.traverse((o) => {
          if (!o.isMesh || !o.userData.gizmoKind) return;
          o.getWorldPosition(wp);
          const d = raycaster.ray.distanceToPoint(wp);
          if (d < bestDist) { bestDist = d; best = o; }
        });
      });
      return best;
    }

    function pickElement(info) {
      const raycaster = raycasterRef.current;
      raycaster.setFromCamera(info.ndc, info.vp.camera);
      const obj = getSelectedObj();
      const center = new THREE.Vector3();
      if (obj && obj.meshData.vertices.length) {
        obj.meshData.vertices.forEach((v) => center.add(v));
        center.divideScalar(obj.meshData.vertices.length);
      }
      const wpp = worldPerPixelAt(info.vp, center);
      raycaster.params.Points.threshold = wpp * 6;
      raycaster.params.Line.threshold = wpp * 5;
      if (obj) {
        if (selMode === SELMODE.MESH) {
          const hits = raycaster.intersectObject(obj.mesh);
          if (hits.length) return { type: "mesh", point: hits[0].point.clone() };
        } else if (selMode === SELMODE.VERTEX && obj.vertHelper) {
          const hits = raycaster.intersectObject(obj.vertHelper);
          if (hits.length) {
            // entre os pontos dentro do limiar, escolhe o mais próximo do CURSOR (menor
            // distanceToRay) — não o mais próximo da câmera (ordem padrão do raycaster),
            // que em perspectiva pode escolher um vértice bem longe de onde se clicou
            let best = hits[0];
            for (const h of hits) if (h.distanceToRay < best.distanceToRay) best = h;
            return { type: "vertex", index: best.index };
          }
        } else if (selMode === SELMODE.EDGE && obj.edgeHelper) {
          const hits = raycaster.intersectObject(obj.edgeHelper);
          if (hits.length) {
            let best = hits[0];
            for (const h of hits) if (h.distanceToRay < best.distanceToRay) best = h;
            const segIdx = Math.floor(best.index / 2);
            const pair = obj.edgesList[segIdx];
            if (pair) return { type: "edge", a: pair[0], b: pair[1], point: best.point.clone() };
          }
        } else if (selMode === SELMODE.FACE) {
          const hits = raycaster.intersectObject(obj.mesh);
          if (hits.length && hits[0].faceIndex != null) {
            const faceIdx = obj.mesh.geometry.userData.faceMap[hits[0].faceIndex];
            return { type: "face", index: faceIdx, point: hits[0].point.clone() };
          }
        }
      }
      // não achou nada no objeto atualmente selecionado (ou nenhum selecionado ainda):
      // tenta qualquer objeto da cena, permitindo trocar de objeto em qualquer modo
      const meshes = objectsRef.current.map((o) => o.mesh);
      const hits = raycaster.intersectObjects(meshes);
      if (hits.length) {
        const o = objectsRef.current.find((oo) => oo.mesh === hits[0].object);
        return { type: "object", id: o.id, point: hits[0].point.clone() };
      }
      const groundHit = new THREE.Vector3();
      const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      if (raycaster.ray.intersectPlane(plane, groundHit)) return { type: "ground", point: groundHit };
      return null;
    }

    // Corte com uma face selecionada: pega um ponto qualquer no PLANO da face (não
    // precisa cair exatamente numa aresta) — os 2 pontos clicados definem a linha de corte
    function pickPointOnFacePlane(info, obj, faceIndex) {
      const face = obj.meshData.faces[faceIndex];
      const normal = computeFaceNormal(obj.meshData.vertices, face);
      const origin = obj.meshData.vertices[face[0]];
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, origin);
      raycasterRef.current.setFromCamera(info.ndc, info.vp.camera);
      const hit = new THREE.Vector3();
      if (!raycasterRef.current.ray.intersectPlane(plane, hit)) return null;
      return hit;
    }

    // Corte com uma aresta selecionada: pega o ponto (t de 0 a 1) clicado sobre ESSA
    // aresta especificamente, pra inserir um vértice novo ali
    function pickPointOnEdgeSegment(info, obj, a, b) {
      raycasterRef.current.setFromCamera(info.ndc, info.vp.camera);
      raycasterRef.current.params.Line.threshold = 0.08;
      const va = obj.meshData.vertices[a], vb = obj.meshData.vertices[b];
      const geo = new THREE.BufferGeometry().setFromPoints([va, vb]);
      const line = new THREE.Line(geo);
      const hits = raycasterRef.current.intersectObject(line);
      if (!hits.length) return null;
      return THREE.MathUtils.clamp(va.distanceTo(hits[0].point) / va.distanceTo(vb), 0, 1);
    }

    // quando a seleção que vai ser escalada tem uma "borda" ligada a geometria de FORA
    // dela (ex.: o anel de cima da parte extrudada, ainda grudado no resto do cilindro
    // que não foi selecionado), escalar direto puxa/afina essa ligação junto (vira um
    // funil torto). O jeito certo (igual a um "Extrude Region" de verdade) é: duplicar
    // os vértices dessa borda, deixar os originais PARADOS onde estão (presos no resto
    // da malha) e criar uma face nova (uma "prateleira" chata) ligando o anel original
    // parado ao duplicado — só o duplicado entra na seleção que vai se mexer/escalar.
    // Sem borda nenhuma (seleção solta, ou é a malha inteira), não faz nada.
    function detachSelectionBoundary(meshData, targetIndices) {
      const targetSet = new Set(targetIndices);
      const faces = meshData.faces;
      const faceClass = faces.map((f) => {
        let allIn = true, anyIn = false;
        f.forEach((vi) => { if (targetSet.has(vi)) anyIn = true; else allIn = false; });
        return allIn ? "inside" : (anyIn ? "mixed" : "outside");
      });
      const edgeFaces = new Map();
      faces.forEach((f, fi) => {
        const n = f.length;
        for (let i = 0; i < n; i++) {
          const a = f[i], b = f[(i + 1) % n];
          const key = Math.min(a, b) + "_" + Math.max(a, b);
          if (!edgeFaces.has(key)) edgeFaces.set(key, []);
          edgeFaces.get(key).push({ fi, a, b });
        }
      });
      const boundaryEdges = [];
      const boundaryVerts = new Set();
      edgeFaces.forEach((list) => {
        if (list.length !== 2) return;
        const [e0, e1] = list;
        if (!targetSet.has(e0.a) || !targetSet.has(e0.b)) return;
        const c0 = faceClass[e0.fi], c1 = faceClass[e1.fi];
        const insideEdge = c0 === "inside" && c1 !== "inside" ? e0 : (c1 === "inside" && c0 !== "inside" ? e1 : null);
        if (!insideEdge) return;
        boundaryEdges.push(insideEdge);
        boundaryVerts.add(insideEdge.a);
        boundaryVerts.add(insideEdge.b);
      });
      if (!boundaryVerts.size) return targetIndices.slice();
      const dupMap = new Map();
      boundaryVerts.forEach((vi) => {
        meshData.vertices.push(meshData.vertices[vi].clone());
        dupMap.set(vi, meshData.vertices.length - 1);
      });
      faces.forEach((f, fi) => {
        if (faceClass[fi] !== "inside") return;
        for (let i = 0; i < f.length; i++) {
          if (dupMap.has(f[i])) f[i] = dupMap.get(f[i]);
        }
      });
      boundaryEdges.forEach(({ a, b }) => {
        meshData.faces.push([b, a, dupMap.get(a), dupMap.get(b)]);
      });
      return targetIndices.map((vi) => (dupMap.has(vi) ? dupMap.get(vi) : vi));
    }

    function startDragFor(obj, sel, info) {
      const cam = info.vp.camera;
      const camDir = new THREE.Vector3();
      cam.getWorldDirection(camDir);
      const indices = selectionVertexIndices(obj.meshData, sel);
      if (!indices.length) return;
      const refPoint = indices.length === 1
        ? obj.meshData.vertices[indices[0]].clone()
        : indices.reduce((acc, vi) => acc.add(obj.meshData.vertices[vi]), new THREE.Vector3()).divideScalar(indices.length);
      const plane = new THREE.Plane();
      plane.setFromNormalAndCoplanarPoint(camDir, refPoint);
      const baseVerts = indices.map((vi) => obj.meshData.vertices[vi].clone());
      dragRef.current = { objId: obj.id, indices, plane, startPoint: refPoint.clone(), baseVerts, cam, quadRect: info.quadRect };
    }

    function armPendingDrag(obj, sel, e, info) {
      if (!sel) return;
      pendingDragRef.current = { obj, sel, downX: e.clientX, downY: e.clientY, info };
    }

    function startPlaneScaleDrag(axesPair, info, obj) {
      const cam = info.vp.camera;
      const pivot = gizmoRef.current.position.clone();
      const axisVecA = new THREE.Vector3(axesPair[0] === "x" ? 1 : 0, axesPair[0] === "y" ? 1 : 0, axesPair[0] === "z" ? 1 : 0);
      const axisVecB = new THREE.Vector3(axesPair[1] === "x" ? 1 : 0, axesPair[1] === "y" ? 1 : 0, axesPair[1] === "z" ? 1 : 0);
      const diagDir = axisVecA.clone().add(axisVecB).normalize();
      let targetIndices = selectionVertexIndices(obj.meshData, selectionRef.current);
      if (!targetIndices.length) return;
      targetIndices = detachSelectionBoundary(obj.meshData, targetIndices);
      const viewDir = new THREE.Vector3(); cam.getWorldDirection(viewDir);
      const planeNormal = new THREE.Vector3().crossVectors(diagDir, viewDir).cross(diagDir);
      if (planeNormal.lengthSq() < 1e-8) planeNormal.copy(viewDir);
      planeNormal.normalize();
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, pivot);
      const baseVerts = targetIndices.map((vi) => obj.meshData.vertices[vi].clone());
      gizmoDragRef.current = { kind: "scaleplane", objId: obj.id, axisVecA, axisVecB, diagDir, plane, pivot, targetIndices, baseVerts, refLen: 0.5, cam, quadRect: info.quadRect };
    }

    function startGizmoDrag(axis, kind, info, obj) {
      const cam = info.vp.camera;
      const pivot = gizmoRef.current.position.clone();
      const axisVec = new THREE.Vector3(axis === "x" ? 1 : 0, axis === "y" ? 1 : 0, axis === "z" ? 1 : 0);
      const sel = selectionRef.current;
      const targetIndices = selectionVertexIndices(obj.meshData, sel);
      if (!targetIndices.length) return;
      if (kind === TOOL.MOVE) {
        const viewDir = new THREE.Vector3(); cam.getWorldDirection(viewDir);
        const planeNormal = new THREE.Vector3().crossVectors(axisVec, viewDir).cross(axisVec);
        if (planeNormal.lengthSq() < 1e-8) planeNormal.copy(viewDir);
        planeNormal.normalize();
        const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, pivot);
        const baseVerts = targetIndices.map((vi) => obj.meshData.vertices[vi].clone());
        gizmoDragRef.current = { kind: "move", objId: obj.id, axisVec, plane, pivot, targetIndices, baseVerts, cam, quadRect: info.quadRect };
      } else if (kind === TOOL.SCALE) {
        const viewDir = new THREE.Vector3(); cam.getWorldDirection(viewDir);
        const planeNormal = new THREE.Vector3().crossVectors(axisVec, viewDir).cross(axisVec);
        if (planeNormal.lengthSq() < 1e-8) planeNormal.copy(viewDir);
        planeNormal.normalize();
        const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, pivot);
        const scaleTargets = detachSelectionBoundary(obj.meshData, targetIndices);
        const baseVerts = scaleTargets.map((vi) => obj.meshData.vertices[vi].clone());
        gizmoDragRef.current = { kind: "scale", objId: obj.id, axisVec, plane, pivot, targetIndices: scaleTargets, baseVerts, refLen: 0.5, cam, quadRect: info.quadRect };
      } else {
        const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(axisVec, pivot);
        raycasterRef.current.setFromCamera(info.ndc, cam);
        const p0 = new THREE.Vector3();
        if (!raycasterRef.current.ray.intersectPlane(plane, p0)) return;
        const refDir = p0.clone().sub(pivot).normalize();
        gizmoDragRef.current = { kind: "rotate", objId: obj.id, axisVec, plane, pivot, refDir, lastAngle: 0, targetIndices, cam, quadRect: info.quadRect };
      }
    }

    function startDirScaleDrag(axis, sign, info, obj) {
      const cam = info.vp.camera;
      const axisVec = new THREE.Vector3(axis === "x" ? 1 : 0, axis === "y" ? 1 : 0, axis === "z" ? 1 : 0);
      const targetIndices = selectionVertexIndices(obj.meshData, selectionRef.current);
      if (targetIndices.length < 2) return;
      const baseVerts = targetIndices.map((vi) => obj.meshData.vertices[vi].clone());
      let minComp = Infinity, maxComp = -Infinity;
      baseVerts.forEach((v) => { const c = v.dot(axisVec); minComp = Math.min(minComp, c); maxComp = Math.max(maxComp, c); });
      const anchorComp = sign > 0 ? minComp : maxComp; // lado oposto, fica parado
      const startMovingComp = sign > 0 ? maxComp : minComp; // lado que este handle arrasta
      if (Math.abs(startMovingComp - anchorComp) < 1e-6) return;
      const dot = dirScaleGizmoRef.current.children.find((d) => d.userData.gizmoAxis === axis && d.userData.gizmoSign === sign);
      const refPoint = dot ? dot.position.clone() : baseVerts[0];
      const viewDir = new THREE.Vector3(); cam.getWorldDirection(viewDir);
      const planeNormal = new THREE.Vector3().crossVectors(axisVec, viewDir).cross(axisVec);
      if (planeNormal.lengthSq() < 1e-8) planeNormal.copy(viewDir);
      planeNormal.normalize();
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, refPoint);
      gizmoDragRef.current = { kind: "scaledir", objId: obj.id, axisVec, plane, targetIndices, baseVerts, anchorComp, startMovingComp, cam, quadRect: info.quadRect };
    }

    function panOrthoCamera(vp, dx, dy) {
      const cam = vp.camera;
      const right = new THREE.Vector3(), up = new THREE.Vector3(), fwd = new THREE.Vector3();
      cam.matrixWorld.extractBasis(right, up, fwd);
      const worldPerPixel = (2 * cam.userData.size) / (vp.lastH || 600);
      cam.userData.center.addScaledVector(right, -dx * worldPerPixel);
      cam.userData.center.addScaledVector(up, dy * worldPerPixel);
      const d = 80;
      cam.position.copy(cam.userData.center).addScaledVector(vp.dir, d);
      cam.lookAt(cam.userData.center);
    }

    function panPerspCamera(cam, dx, dy) {
      const right = new THREE.Vector3(), up = new THREE.Vector3(), fwd = new THREE.Vector3();
      cam.matrixWorld.extractBasis(right, up, fwd);
      const speed = 0.01;
      cam.position.addScaledVector(right, -dx * speed);
      cam.position.addScaledVector(up, dy * speed);
    }


    // cada viewport tem seu próprio plano de trabalho para o sistema "Adicionar":
    // Superior/Perspectiva usam o chão (Y=0, largura em X/Z); Frente usa o plano Z=0
    // (largura em X/Y); Lado usa o plano X=0 (largura em Z/Y) — assim dá pra desenhar
    // o retângulo de criação em qualquer uma das 4 janelas, não só na Superior.
    function placementAxesForViewport(vpId) {
      if (vpId === "front") return { axisU: "x", axisV: "y", extrudeAxis: "z", liftUp: false };
      if (vpId === "side") return { axisU: "z", axisV: "y", extrudeAxis: "x", liftUp: false };
      return { axisU: "x", axisV: "z", extrudeAxis: "y", liftUp: true };
    }

    function groundPointFromInfo(info, forcedAxes) {
      raycasterRef.current.setFromCamera(info.ndc, info.vp.camera);
      const hit = new THREE.Vector3();
      const axes = forcedAxes || placementAxesForViewport(info.vp.id);
      const normal = new THREE.Vector3();
      normal[axes.extrudeAxis] = 1;
      const plane = new THREE.Plane(normal, 0);
      if (!raycasterRef.current.ray.intersectPlane(plane, hit)) return null;
      if (snapEnabled) {
        hit[axes.axisU] = Math.round(hit[axes.axisU] / gridSize) * gridSize;
        hit[axes.axisV] = Math.round(hit[axes.axisV] / gridSize) * gridSize;
      }
      return hit;
    }

    function updatePlacementPreview(startPt, currentPt) {
      const p = placementRef.current;
      if (!p) return;
      if (p.previewMesh) { sceneRef.current.remove(p.previewMesh); p.previewMesh.geometry.dispose(); p.previewMesh.material.dispose(); }
      const { axisU, axisV, extrudeAxis, liftUp } = p;
      const dimU = Math.max(0.02, Math.abs(currentPt[axisU] - startPt[axisU]));
      const dimV = Math.max(0.02, Math.abs(currentPt[axisV] - startPt[axisV]));
      const dimExtrude = Math.max(0.1, Math.min(dimU, dimV));
      const size = new THREE.Vector3(); size[axisU] = dimU; size[axisV] = dimV; size[extrudeAxis] = dimExtrude;
      const geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(size.x, size.y, size.z));
      const mesh = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: ACCENT, depthTest: false }));
      const center = new THREE.Vector3();
      center[axisU] = (startPt[axisU] + currentPt[axisU]) / 2;
      center[axisV] = (startPt[axisV] + currentPt[axisV]) / 2;
      center[extrudeAxis] = startPt[extrudeAxis] + (liftUp ? dimExtrude / 2 : 0);
      mesh.position.copy(center);
      mesh.renderOrder = 30;
      sceneRef.current.add(mesh);
      p.previewMesh = mesh;
      p.lastPoint = currentPt.clone();
    }

    function remapLocalAxes(v, axisU, extrudeAxis, axisV) {
      const out = new THREE.Vector3();
      out[axisU] = v.x; out[extrudeAxis] = v.y; out[axisV] = v.z;
      return out;
    }

    function finalizePlacement(startPt, endPt, type, segments, axes) {
      const { axisU, axisV, extrudeAxis, liftUp } = axes;
      const dimU = Math.max(gridSize, Math.abs(endPt[axisU] - startPt[axisU]));
      const dimV = Math.max(gridSize, Math.abs(endPt[axisV] - startPt[axisV]));
      let md, dimExtrude;
