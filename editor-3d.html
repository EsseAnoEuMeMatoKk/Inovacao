      if (type === "cubo") {
        dimExtrude = Math.max(0.1, Math.min(dimU, dimV));
        md = makeBox(dimU, dimExtrude, dimV);
      } else if (type === "plano") {
        dimExtrude = 0;
        md = makePlane(dimU, dimV, 4);
      } else if (type === "cilindro") {
        const radius = Math.max(0.05, Math.max(dimU, dimV) / 2);
        dimExtrude = Math.max(0.1, Math.min(dimU, dimV));
        md = makeCylinder(radius, dimExtrude, Math.max(3, segments));
      } else if (type === "esfera") {
        const radius = Math.max(0.05, Math.max(dimU, dimV) / 2);
        const wSegs = Math.max(3, segments);
        dimExtrude = radius * 2;
        md = makeSphere(radius, wSegs, Math.max(2, Math.round(wSegs * 0.7)));
      } else return;
      md.vertices = md.vertices.map((v) => remapLocalAxes(v, axisU, extrudeAxis, axisV));
      const center = new THREE.Vector3();
      center[axisU] = (startPt[axisU] + endPt[axisU]) / 2;
      center[axisV] = (startPt[axisV] + endPt[axisV]) / 2;
      center[extrudeAxis] = startPt[extrudeAxis] + (liftUp ? dimExtrude / 2 : 0);
      md.vertices.forEach((v) => v.add(center));
      pushUndoSnapshot();
      // se já existe um objeto selecionado, a nova primitiva entra nele em vez de virar
      // um objeto separado — evita a cena acabar cheia de objetos soltos que depois não
      // dá pra editar juntos (extrudar, biselar etc. entre as partes)
      const existingObj = getSelectedObj();
      if (existingObj) {
        mergeMeshDataInto(existingObj.meshData, md);
        refreshObjectVisuals(existingObj);
        setStatus(`${type} adicionado a "${existingObj.name}".`);
      } else {
        const count = objectsRef.current.filter((o) => o.name.startsWith(type)).length + 1;
        const obj = addObjectFromMeshData(md, `${type}_${count}`);
        selectObject(obj.id);
        setStatus(`${type} criado.`);
      }
    }

    function startShiftExtrudeOrClone(obj, info, tool) {
      const sel = selectionRef.current;
      if (!sel) { setStatus("Selecione algo (face, ou a malha inteira com a tecla 4) antes de Shift+Arrastar."); return; }
      let newSel;
      if (sel.type === "mesh") {
        pushUndoSnapshot();
        const newObj = addObjectFromMeshData(cloneMeshData(obj.meshData), obj.name + "_clone");
        selectObject(newObj.id);
        obj = newObj;
        newSel = { type: "mesh" };
        selectionRef.current = newSel;
        setSelectionInfo(newSel);
        updateGizmoTransform();
        setStatus("Objeto clonado — arraste para transformar.");
      } else if (sel.type === "face" && sel.indices.length) {
        pushUndoSnapshot();
        const indices = sel.indices.slice();
        indices.forEach((fi) => extrudeFace(obj.meshData, fi, 0.001));
        refreshObjectVisuals(obj);
        newSel = { type: "face", indices };
        selectionRef.current = newSel;
        setSelectionInfo({ ...newSel });
        updateSelectionHighlight();
        setStatus("Face extrudada — arraste para transformar.");
      } else if (sel.type === "edge" && sel.pairs.length) {
        pushUndoSnapshot();
        const faceIndices = sel.pairs.map(([a, b]) => {
          const va = obj.meshData.vertices[a], vb = obj.meshData.vertices[b];
          const edgeDir = vb.clone().sub(va).normalize();
          // usa a normal de uma face adjacente (se houver) como direção inicial do
          // empurrão — se a aresta estiver "aberta" (sem face), usa qualquer direção
          // perpendicular a ela; o Shift+Arrastar em si é que decide a direção final
          let dir = null;
          for (const face of obj.meshData.faces) {
            const n = face.length;
            for (let i = 0; i < n; i++) {
              const p = face[i], q = face[(i + 1) % n];
              if ((p === a && q === b) || (p === b && q === a)) { dir = computeFaceNormal(obj.meshData.vertices, face); break; }
            }
            if (dir) break;
          }
          if (!dir) {
            const up = new THREE.Vector3(0, 1, 0);
            dir = Math.abs(edgeDir.dot(up)) > 0.95 ? new THREE.Vector3(1, 0, 0) : up.clone();
            dir.sub(edgeDir.clone().multiplyScalar(dir.dot(edgeDir))).normalize();
          }
          return extrudeEdge(obj.meshData, a, b, dir.multiplyScalar(0.001));
        });
        refreshObjectVisuals(obj);
        newSel = { type: "face", indices: faceIndices };
        selectionRef.current = newSel;
        setSelectionInfo({ ...newSel });
        updateSelectionHighlight();
        setStatus("Aresta extrudada num plano novo — arraste para posicionar.");
      } else {
        setStatus("Selecione uma ou mais faces ou arestas, ou a malha inteira (tecla 4), para extrudar/clonar com Shift+Arrastar.");
        return;
      }

      const targetIndices = selectionVertexIndices(obj.meshData, newSel);
      if (!targetIndices.length) return;
      const pivot = targetIndices.reduce((acc, vi) => acc.add(obj.meshData.vertices[vi]), new THREE.Vector3()).divideScalar(targetIndices.length);
      let axisVec = new THREE.Vector3(0, 1, 0);
      if (newSel.type === "face" && newSel.indices.length === 1) {
        axisVec = computeFaceNormal(obj.meshData.vertices, obj.meshData.faces[newSel.indices[0]]);
      }
      const cam = info.vp.camera;

      if (tool === TOOL.ROTATE) {
        if (targetIndices.length < 2) return;
        const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(axisVec, pivot);
        raycasterRef.current.setFromCamera(info.ndc, cam);
        const p0 = new THREE.Vector3();
        if (!raycasterRef.current.ray.intersectPlane(plane, p0)) return;
        const refDir = p0.clone().sub(pivot).normalize();
        gizmoDragRef.current = { kind: "rotate", objId: obj.id, axisVec, plane, pivot, refDir, lastAngle: 0, targetIndices, cam, quadRect: info.quadRect };
      } else if (tool === TOOL.SCALE || tool === TOOL.SCALE_DIR) {
        // pivô projetado em tela: o arraste em si define a direção de referência no
        // primeiro movimento (ver onPointerMove), já que o clique começa colado nele
        const containerRect = mountRef.current.getBoundingClientRect();
        const pivotNdc = pivot.clone().project(cam);
        const pivotLocalX = (pivotNdc.x * 0.5 + 0.5) * info.quadRect.w;
        const pivotLocalY = (1 - (pivotNdc.y * 0.5 + 0.5)) * info.quadRect.h;
        const pivotClientX = containerRect.left + info.quadRect.x + pivotLocalX;
        const pivotClientY = containerRect.top + info.quadRect.y + pivotLocalY;
        const baseVerts = targetIndices.map((vi) => obj.meshData.vertices[vi].clone());
        gizmoDragRef.current = { kind: "scaleUniform", objId: obj.id, pivot, pivotClientX, pivotClientY, refDir: null, refDist: 0, targetIndices, baseVerts, cam, quadRect: info.quadRect };
      } else {
        // move travado num eixo só, igual ao arrastar de uma flecha do gizmo —
        // eixo = normal da face (ou Y por padrão) — evita deslizar em várias direções
        const viewDir = new THREE.Vector3(); cam.getWorldDirection(viewDir);
        const planeNormal = new THREE.Vector3().crossVectors(axisVec, viewDir).cross(axisVec);
        if (planeNormal.lengthSq() < 1e-8) planeNormal.copy(viewDir);
        planeNormal.normalize();
        const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, pivot);
        const baseVerts = targetIndices.map((vi) => obj.meshData.vertices[vi].clone());
        gizmoDragRef.current = { kind: "move", objId: obj.id, axisVec, plane, pivot, targetIndices, baseVerts, cam, quadRect: info.quadRect };
      }
    }

    function onPointerDown(e) {
      const info = getViewportAndNDC(e.clientX, e.clientY);
      if (!info) return;
      activeViewportIdRef.current = info.vp.id;
      setActiveViewportId(info.vp.id);

      if (e.button === 2 && e.altKey) { e.preventDefault(); startTexturePaintSession(info); return; }
      if (e.button === 2) { mouseButtonsRef.current.right = true; e.preventDefault(); return; }
      if (e.button === 1) { mouseButtonsRef.current.middle = true; e.preventDefault(); return; }
      if (e.button !== 0) return;
      mouseButtonsRef.current.left = true;

      if (pendingPrimitive) {
        const axes = placementAxesForViewport(info.vp.id);
        const groundHit = groundPointFromInfo(info, axes);
        if (groundHit) {
          placementRef.current = { type: pendingPrimitive.type, segments: pendingPrimitive.segments, startPoint: groundHit, previewMesh: null, ...axes };
          setStatus("Arraste para definir o tamanho, solte o botão para criar.");
        }
        return;
      }


      if (cuttingRef.current) {
        const obj = getSelectedObj();
        const cl = cutLineRef.current;
        if (!obj || !cl) {
          cuttingRef.current = false; cutLineRef.current = null;
          setStatus("Corte cancelado.");
          return;
        }
        if (cl.mode === "face") {
          const p = pickPointOnFacePlane(info, obj, cl.faceIndex);
          if (!p) return;
          if (!cl.p1) { cl.p1 = p; setStatus("Corte: clique no segundo ponto. Enter confirma, Esc cancela."); }
          else { cl.p2 = p; setStatus("Corte: Enter confirma a linha de corte, Esc cancela."); }
        } else {
          const t = pickPointOnEdgeSegment(info, obj, cl.edge[0], cl.edge[1]);
          if (t == null) return;
          cl.t = t;
          setStatus("Corte: Enter confirma o ponto, Esc cancela.");
        }
        updateCutPreview(obj);
        return;
      }

      // o teste de acerto no gizmo roda ANTES de olhar pra Shift/Ctrl — acertar (ou
      // quase acertar) uma alça é uma ação inequívoca e sempre ganha, mesmo se o Shift
      // tiver ficado pressionado sem querer; só quando a alça genuinamente não é
      // atingida (nem pela margem generosa) é que o clique cai pro comportamento normal
      // de Shift/Ctrl mais abaixo (selecionar, Shift+Arrastar extrude, etc.) — sem
      // bloquear esse fallback, senão clicar num elemento novo pra trocar a seleção
      // (documentado como sempre disponível) pararia de funcionar
      if (!e.ctrlKey && (activeTool === TOOL.MOVE || activeTool === TOOL.ROTATE || activeTool === TOOL.SCALE) && gizmoRef.current && gizmoRef.current.visible) {
        const g = gizmoRef.current;
        const grp = activeTool === TOOL.MOVE ? g.userData.moveGroup : activeTool === TOOL.ROTATE ? g.userData.rotateGroup : g.userData.scaleGroup;
        if (grp.visible) {
          raycasterRef.current.setFromCamera(info.ndc, info.vp.camera);
          const picked = pickGizmoHandleGenerous(grp.children, raycasterRef.current, info.vp, g.position);
          if (picked) {
            const selObj = getSelectedObj();
            if (selObj && picked.userData.gizmoKind === "movefree") {
              // cubinho central: move nos 3 eixos ao mesmo tempo, no plano da câmera
              pushUndoSnapshot();
              startDragFor(selObj, selectionRef.current, info);
              return;
            }
            if (picked.userData.gizmoKind === "scaleplane") {
              // quadradinho entre 2 eixos: escala os dois ao mesmo tempo, a partir do pivô
              if (selObj) { pushUndoSnapshot(); startPlaneScaleDrag(picked.userData.gizmoAxes, info, selObj); return; }
            }
            const axis = picked.userData.gizmoAxis;
            if (selObj) { pushUndoSnapshot(); startGizmoDrag(axis, activeTool, info, selObj); return; }
          }
        }
      }

      if (!e.ctrlKey && activeTool === TOOL.SCALE_DIR && dirScaleGizmoRef.current && dirScaleGizmoRef.current.visible) {
        raycasterRef.current.setFromCamera(info.ndc, info.vp.camera);
        const picked = pickGizmoHandleGenerous(dirScaleGizmoRef.current.children, raycasterRef.current, info.vp, dirScaleGizmoRef.current.position);
        if (picked) {
          const selObj = getSelectedObj();
          if (selObj) { pushUndoSnapshot(); startDirScaleDrag(picked.userData.gizmoAxis, picked.userData.gizmoSign, info, selObj); return; }
        }
      }

      if (e.detail >= 2) return; // 2º clique de um duplo-clique é tratado pelo listener dblclick

      const hit = pickElement(info);

      const canShiftExtrude = (tool) => tool === TOOL.MOVE || tool === TOOL.ROTATE || tool === TOOL.SCALE || tool === TOOL.SCALE_DIR;

      if (hit && hit.type === "mesh") {
        const obj = getSelectedObj();
        selectionRef.current = { type: "mesh" };
        setSelectionInfo({ type: "mesh" });
        updateSelectionHighlight();
        updateGizmoTransform();
        if (obj && e.shiftKey && canShiftExtrude(activeTool)) {
          pendingShiftExtrudeRef.current = { obj, tool: activeTool, downX: e.clientX, downY: e.clientY, info };
        } else if (activeTool === TOOL.MOVE && obj) {
          armPendingDrag(obj, selectionRef.current, e, info);
        }
        return;
      }

      if (hit && (hit.type === "vertex" || hit.type === "edge" || hit.type === "face") && hit.type === selMode && e.ctrlKey && !e.shiftKey) {
        // Ctrl+clique: desseleciona (oposto do Shift+clique) — nunca adiciona, só remove
        const sel = selectionRef.current;
        if (sel && sel.type === hit.type) {
          if (hit.type === "vertex") {
            const indices = sel.indices.filter((i) => i !== hit.index);
            selectionRef.current = indices.length ? { type: "vertex", indices } : null;
          } else if (hit.type === "edge") {
            const pairs = sel.pairs.filter(([a, b]) => !((a === hit.a && b === hit.b) || (a === hit.b && b === hit.a)));
            selectionRef.current = pairs.length ? { type: "edge", pairs } : null;
          } else {
            const indices = sel.indices.filter((i) => i !== hit.index);
            selectionRef.current = indices.length ? { type: "face", indices } : null;
          }
          setSelectionInfo(selectionRef.current ? { ...selectionRef.current } : null);
          updateSelectionHighlight();
          updateGizmoTransform();
        }
        return;
      }

      if (hit && (hit.type === "vertex" || hit.type === "edge" || hit.type === "face") && hit.type === selMode) {
        const obj = getSelectedObj();
        prevSelectionRef.current = selectionRef.current;
        const additive = e.shiftKey;
        const prevSel = selectionRef.current;
        let alreadySelected = false;
        if (hit.type === "vertex") alreadySelected = !!(prevSel && prevSel.type === "vertex" && prevSel.indices.includes(hit.index));
        else if (hit.type === "edge") alreadySelected = !!(prevSel && prevSel.type === "edge" && prevSel.pairs.some(([a, b]) => (a === hit.a && b === hit.b) || (a === hit.b && b === hit.a)));
        else alreadySelected = !!(prevSel && prevSel.type === "face" && prevSel.indices.includes(hit.index));

        // mover só é possível pelas setas do gizmo agora — clicar direto num elemento
        // nunca mais arrasta; em vez disso, segurar o botão e passar por cima de outros
        // elementos os "pinta" (adiciona) à seleção (com ou sem shift)
        if (!additive && alreadySelected) {
          paintSelectRef.current = { obj };
          return;
        }

        if (hit.type === "vertex") {
          const cur = additive && selectionRef.current && selectionRef.current.type === "vertex" ? selectionRef.current.indices : [];
          const indices = cur.includes(hit.index) ? cur.filter((i) => i !== hit.index) : [...cur, hit.index];
          selectionRef.current = indices.length ? { type: "vertex", indices } : null;
        } else if (hit.type === "edge") {
          const cur = additive && selectionRef.current && selectionRef.current.type === "edge" ? selectionRef.current.pairs : [];
          const already = cur.some(([a, b]) => (a === hit.a && b === hit.b) || (a === hit.b && b === hit.a));
          if (additive && already && obj && canShiftExtrude(activeTool)) {
            // mesmo caso da face: Shift+clique numa aresta JÁ selecionada não remove
            // ainda — só remove no pointerup se não virar um Shift+Arrastar (extrude)
            pendingShiftExtrudeRef.current = { obj, tool: activeTool, downX: e.clientX, downY: e.clientY, info, toggleOffEdge: [hit.a, hit.b] };
            return;
          }
          const pairs = already ? cur.filter(([a, b]) => !((a === hit.a && b === hit.b) || (a === hit.b && b === hit.a))) : [...cur, [hit.a, hit.b]];
          selectionRef.current = pairs.length ? { type: "edge", pairs } : null;
        } else {
          const cur = additive && selectionRef.current && selectionRef.current.type === "face" ? selectionRef.current.indices : [];
          const alreadyIn = cur.includes(hit.index);
          if (additive && alreadyIn && obj && canShiftExtrude(activeTool)) {
            // Shift+clique numa face JÁ selecionada: não remove ainda — se soltar sem
            // arrastar, remove no pointerup (toggle normal); se arrastar, é Shift+Arrastar
            // (extrude) e a seleção precisa continuar com essa face para funcionar
            pendingShiftExtrudeRef.current = { obj, tool: activeTool, downX: e.clientX, downY: e.clientY, info, toggleOffIndex: hit.index };
            return;
          }
          const indices = alreadyIn ? cur.filter((i) => i !== hit.index) : [...cur, hit.index];
          selectionRef.current = indices.length ? { type: "face", indices } : null;
        }
        setSelectionInfo(selectionRef.current ? { ...selectionRef.current } : null);
        updateSelectionHighlight();
        updateGizmoTransform();
        if (additive && obj && (hit.type === "face" || hit.type === "edge") && selectionRef.current && selectionRef.current.type === hit.type && canShiftExtrude(activeTool)) {
          // Shift+clique só alterna a seleção; Shift+ARRASTAR é que extruda (faces
          // sempre, arestas quando "abertas") — nunca arma "pintar seleção" aqui, senão
          // o próximo shift+arrastar sobre outro elemento vira pintura em vez de extrude
          pendingShiftExtrudeRef.current = { obj, tool: activeTool, downX: e.clientX, downY: e.clientY, info };
        } else if (obj) {
          // segurar o botão e passar por cima de outros vértices/arestas/faces os
          // adiciona à seleção ("pintar seleção") — funciona com ou sem shift
          paintSelectRef.current = { obj };
        }
        return;
      }

      if (hit && hit.type === "object") {
        selectObject(hit.id);
        // mover o objeto inteiro é exclusivo do modo "Malha" (4) — em vértice/aresta/face,
        // um clique que erra o componente e acerta o corpo da malha só troca o objeto atual
        if (activeTool === TOOL.MOVE && selMode === SELMODE.MESH) armPendingDrag(getObj(hit.id), { type: "mesh" }, e, info);
        return;
      }

      selectionRef.current = null; setSelectionInfo(null); updateSelectionHighlight(); updateGizmoTransform();
    }

    function onDoubleClick(e) {
      const info = getViewportAndNDC(e.clientX, e.clientY);
      if (!info) return;
      const obj = getSelectedObj();
      if (!obj) return;
      const hit = pickElement(info);
      if (!hit || hit.type !== selMode) return;
      if (selMode === SELMODE.FACE) {
        const prev = prevSelectionRef.current;
        if (e.shiftKey && prev && prev.type === "face" && prev.indices.length) {
          const startFace = prev.indices[prev.indices.length - 1];
          const path = shortestFacePath(buildFaceAdjacency(obj.meshData), startFace, hit.index);
          selectionRef.current = { type: "face", indices: path || [hit.index] };
          setStatus(path ? `Loop de ${path.length} face(s) selecionado.` : "Não há caminho entre essas faces.");
        } else {
          const connected = connectedFaces(obj.meshData, hit.index);
          selectionRef.current = { type: "face", indices: connected };
          setStatus(`${connected.length} face(s) conectada(s) selecionada(s).`);
        }
        setSelectionInfo({ ...selectionRef.current });
        updateSelectionHighlight();
        updateGizmoTransform();
      } else if (selMode === SELMODE.EDGE) {
        const prev = prevSelectionRef.current;
        if (e.shiftKey && prev && prev.type === "edge" && prev.pairs.length) {
          const [sa, sb] = prev.pairs[prev.pairs.length - 1];
          const adj = buildVertexAdjacency(obj.meshData);
          const path = shortestVertexPath(adj, sb, hit.a) || shortestVertexPath(adj, sa, hit.a) || shortestVertexPath(adj, sb, hit.b) || shortestVertexPath(adj, sa, hit.b);
          if (path && path.length >= 2) {
            const pairs = [];
            for (let i = 0; i < path.length - 1; i++) pairs.push([path[i], path[i + 1]]);
            selectionRef.current = { type: "edge", pairs };
            setStatus(`Loop de ${pairs.length} aresta(s) selecionado.`);
          } else {
            selectionRef.current = { type: "edge", pairs: [[hit.a, hit.b]] };
            setStatus("Não há caminho entre essas arestas.");
          }
          setSelectionInfo({ ...selectionRef.current });
          updateSelectionHighlight();
          updateGizmoTransform();
        } else {
          // duplo-clique simples numa aresta: seleciona o loop reto que passa por ela;
          // duplo-clique de novo na MESMA aresta alterna pro próximo eixo disponível ali
          const adj = buildVertexAdjacency(obj.meshData);
          const dirAB = obj.meshData.vertices[hit.b].clone().sub(obj.meshData.vertices[hit.a]).normalize();
          const axes = [dirAB];
          [hit.a, hit.b].forEach((vi) => {
            computeVertexAxes(obj.meshData, adj, vi).forEach((dir) => {
              if (!axes.some((ax) => Math.abs(ax.dot(dir)) > 0.98)) axes.push(dir);
            });
          });
          const key = "edge_" + Math.min(hit.a, hit.b) + "_" + Math.max(hit.a, hit.b);
          const lc = loopCycleRef.current;
          const axisIndex = lc.key === key ? (lc.axisIndex + 1) % axes.length : 0;
          loopCycleRef.current = { key, axisIndex };
          const chain = walkAxisLoop(obj.meshData, adj, hit.a, axes[axisIndex]);
          const clickedPair = [Math.min(hit.a, hit.b), Math.max(hit.a, hit.b)];
          const pairs = [];
          // o loop inteiro (nos dois sentidos a partir do vértice clicado) sempre passa
          // pela própria aresta clicada — essa aresta fica de fora do resultado (só o
          // RESTO do loop é selecionado), pra poder mexer no loop inteiro sem afetar a
          // aresta em que o duplo-clique foi dado
          for (let i = 0; i < chain.length - 1; i++) {
            const pair = [chain[i], chain[i + 1]];
            const norm = [Math.min(pair[0], pair[1]), Math.max(pair[0], pair[1])];
            if (norm[0] === clickedPair[0] && norm[1] === clickedPair[1]) continue;
            pairs.push(pair);
          }
          selectionRef.current = { type: "edge", pairs };
          setSelectionInfo({ ...selectionRef.current });
          updateSelectionHighlight();
          updateGizmoTransform();
          setStatus(`Loop de ${selectionRef.current.pairs.length} aresta(s) — eixo ${axisIndex + 1}/${axes.length} (duplo-clique de novo pra trocar).`);
        }
      } else if (selMode === SELMODE.VERTEX) {
        // duplo-clique simples num vértice: seleciona o loop reto que passa por ele;
        // duplo-clique de novo no MESMO vértice alterna pro próximo eixo disponível ali
        const adj = buildVertexAdjacency(obj.meshData);
        const axes = computeVertexAxes(obj.meshData, adj, hit.index);
        if (!axes.length) return;
        const key = "vert_" + hit.index;
        const lc = loopCycleRef.current;
        const axisIndex = lc.key === key ? (lc.axisIndex + 1) % axes.length : 0;
        loopCycleRef.current = { key, axisIndex };
        const chain = walkAxisLoop(obj.meshData, adj, hit.index, axes[axisIndex]);
        selectionRef.current = { type: "vertex", indices: chain };
        setSelectionInfo({ ...selectionRef.current });
        updateSelectionHighlight();
        updateGizmoTransform();
        setStatus(`Loop de ${chain.length} vértice(s) — eixo ${axisIndex + 1}/${axes.length} (duplo-clique de novo pra trocar).`);
      }
    }

    function onPointerMove(e) {
      if (placementRef.current) {
        const info = getViewportAndNDC(e.clientX, e.clientY);
        if (!info) return;
        const groundHit = groundPointFromInfo(info, placementRef.current);
        if (groundHit) updatePlacementPreview(placementRef.current.startPoint, groundHit);
        return;
      }
      if (paintTextureRef.current) {
        const hit = pickFaceForDrop(e.clientX, e.clientY);
        const session = paintTextureRef.current;
        if (hit && hit.obj === session.obj && hit.faceIndex !== session.lastFaceIndex) {
          if (paintTextureToFace(session.obj, session.lastFaceIndex, hit.faceIndex)) {
            session.lastFaceIndex = hit.faceIndex;
            session.painted++;
          }
        }
        return;
      }
      if (paintSelectRef.current && mouseButtonsRef.current.left) {
        const obj = paintSelectRef.current.obj;
        const info = getViewportAndNDC(e.clientX, e.clientY);
        if (info) {
          const hit = pickElement(info);
          if (hit && hit.type === selMode && (hit.type === "vertex" || hit.type === "edge" || hit.type === "face")) {
            let changed = false;
            if (hit.type === "vertex") {
              const cur = selectionRef.current && selectionRef.current.type === "vertex" ? selectionRef.current.indices : [];
              if (!cur.includes(hit.index)) { selectionRef.current = { type: "vertex", indices: [...cur, hit.index] }; changed = true; }
            } else if (hit.type === "edge") {
              const cur = selectionRef.current && selectionRef.current.type === "edge" ? selectionRef.current.pairs : [];
              const already = cur.some(([a, b]) => (a === hit.a && b === hit.b) || (a === hit.b && b === hit.a));
              if (!already) { selectionRef.current = { type: "edge", pairs: [...cur, [hit.a, hit.b]] }; changed = true; }
            } else {
              const cur = selectionRef.current && selectionRef.current.type === "face" ? selectionRef.current.indices : [];
              if (!cur.includes(hit.index)) { selectionRef.current = { type: "face", indices: [...cur, hit.index] }; changed = true; }
            }
            if (changed) {
              setSelectionInfo({ ...selectionRef.current });
              updateSelectionHighlight();
              updateGizmoTransform();
            }
          }
        }
        return;
      }
      if (!dragRef.current && !gizmoDragRef.current && pendingShiftExtrudeRef.current) {
        const p = pendingShiftExtrudeRef.current;
        const dx = e.clientX - p.downX, dy = e.clientY - p.downY;
        if (Math.hypot(dx, dy) >= DRAG_THRESHOLD_PX) {
          startShiftExtrudeOrClone(p.obj, p.info, p.tool);
          pendingShiftExtrudeRef.current = null;
        } else {
          return; // ainda dentro do limiar — trata como um clique (seleção aditiva), não Shift+Arrastar
        }
      }
      if (!dragRef.current && !gizmoDragRef.current && pendingDragRef.current) {
        const p = pendingDragRef.current;
        const dx = e.clientX - p.downX, dy = e.clientY - p.downY;
        if (Math.hypot(dx, dy) >= DRAG_THRESHOLD_PX) {
          pushUndoSnapshot();
          startDragFor(p.obj, p.sel, p.info);
          pendingDragRef.current = null;
        } else {
          return; // ainda dentro do limiar — trata como um clique, não um arraste
        }
      }
      if (gizmoDragRef.current) {
        const gd = gizmoDragRef.current;
        const obj = getObj(gd.objId);
        if (!obj) { gizmoDragRef.current = null; return; }
        if (gd.kind === "scaleUniform") {
          // usa uma direção de referência em tela definida no primeiro movimento (não a
          // distância absoluta até o pivô): o arraste começa colado no pivô (o próprio
          // clique que disparou o extrude), então qualquer razão de distâncias ali explode
          const dx = e.clientX - gd.pivotClientX, dy = e.clientY - gd.pivotClientY;
          const dist = Math.hypot(dx, dy);
          if (!gd.refDir) {
            if (dist < 10) return;
            gd.refDir = { x: dx / dist, y: dy / dist };
            gd.refDist = dist;
            return;
          }
          const proj = dx * gd.refDir.x + dy * gd.refDir.y;
          const scale = Math.max(0.05, proj / gd.refDist);
          gd.targetIndices.forEach((vi, idx) => {
            const base = gd.baseVerts[idx];
            obj.meshData.vertices[vi].copy(gd.pivot).add(base.clone().sub(gd.pivot).multiplyScalar(scale));
          });
          if (snapEnabled) {
            snapAxisComponentPerVertex(obj.meshData.vertices, gd.targetIndices, new THREE.Vector3(1, 0, 0), gridSize);
            snapAxisComponentPerVertex(obj.meshData.vertices, gd.targetIndices, new THREE.Vector3(0, 1, 0), gridSize);
            snapAxisComponentPerVertex(obj.meshData.vertices, gd.targetIndices, new THREE.Vector3(0, 0, 1), gridSize);
          }
          refreshObjectVisuals(obj);
          updateSelectionHighlight();
          updateGizmoTransform();
          return;
        }
        const ndc = ndcFromEvent(e, gd.quadRect);
        raycasterRef.current.setFromCamera(ndc, gd.cam);
        const hp = new THREE.Vector3();
        if (!raycasterRef.current.ray.intersectPlane(gd.plane, hp)) return;
        if (gd.kind === "move") {
          const t = hp.clone().sub(gd.pivot).dot(gd.axisVec);
          const delta = gd.axisVec.clone().multiplyScalar(t);
          gd.targetIndices.forEach((vi, idx) => obj.meshData.vertices[vi].copy(gd.baseVerts[idx]).add(delta));
          if (snapEnabled) snapVerticesAlongAxis(obj.meshData.vertices, gd.targetIndices, gd.axisVec, gridSize);
        } else if (gd.kind === "scale") {
          // encaixa na grade a DISTÂNCIA arrastada antes de virar fator de escala — não
          // cada vértice depois de já escalado. Encaixar cada vértice por conta própria
          // (um valor por vértice, independente) quebra a forma de qualquer seleção que
          // não esteja alinhada com a grade (ex.: um círculo vira uma sequência de
          // degraus/quadrado, já que pontos vizinhos caem em células diferentes da
          // grade) — encaixar a distância aplica o MESMO fator pra todo mundo, então a
          // forma relativa continua igual, só o tamanho final é que fica "redondo".
          let t = hp.clone().sub(gd.pivot).dot(gd.axisVec);
          if (snapEnabled) t = Math.round(t / gridSize) * gridSize;
          const scale = Math.max(0.05, 1 + t / gd.refLen);
          gd.targetIndices.forEach((vi, idx) => {
            const base = gd.baseVerts[idx];
            const rel = base.clone().sub(gd.pivot);
            const axisComp = rel.dot(gd.axisVec);
            obj.meshData.vertices[vi].copy(base).add(gd.axisVec.clone().multiplyScalar(axisComp * (scale - 1)));
          });
        } else if (gd.kind === "scaleplane") {
          // igual ao "scale" de eixo único, só que aplica o MESMO fator nos dois eixos
          // do par ao mesmo tempo — arrastar o quadradinho estica/encolhe nos dois
          // eixos juntos, a partir do pivô, mantendo a forma nesse plano. Mesmo cuidado
          // com a grade do "scale" acima: encaixa a distância arrastada, não cada
          // vértice depois — senão um círculo vira quadrado/degraus na grade.
          let t = hp.clone().sub(gd.pivot).dot(gd.diagDir);
          if (snapEnabled) t = Math.round(t / gridSize) * gridSize;
          const scale = Math.max(0.05, 1 + t / gd.refLen);
          gd.targetIndices.forEach((vi, idx) => {
            const base = gd.baseVerts[idx];
            const rel = base.clone().sub(gd.pivot);
            const compA = rel.dot(gd.axisVecA);
            const compB = rel.dot(gd.axisVecB);
            obj.meshData.vertices[vi].copy(base)
              .add(gd.axisVecA.clone().multiplyScalar(compA * (scale - 1)))
              .add(gd.axisVecB.clone().multiplyScalar(compB * (scale - 1)));
          });
        } else if (gd.kind === "scaledir") {
          let newMovingComp = hp.dot(gd.axisVec);
          if (snapEnabled) newMovingComp = Math.round(newMovingComp / gridSize) * gridSize;
          const span = gd.startMovingComp - gd.anchorComp;
          if (Math.abs(span) > 1e-6) {
            const factor = Math.max(0.02, (newMovingComp - gd.anchorComp) / span);
            gd.targetIndices.forEach((vi, idx) => {
              const base = gd.baseVerts[idx];
              const comp = base.dot(gd.axisVec);
              const newComp = gd.anchorComp + (comp - gd.anchorComp) * factor;
              obj.meshData.vertices[vi].copy(base).addScaledVector(gd.axisVec, newComp - comp);
            });
          }
        } else {
          const dir = hp.clone().sub(gd.pivot);
          if (dir.lengthSq() < 1e-8) return;
          dir.normalize();
          const cross = new THREE.Vector3().crossVectors(gd.refDir, dir);
          const sinA = cross.dot(gd.axisVec);
          const cosA = gd.refDir.dot(dir);
          const rawAngle = Math.atan2(sinA, cosA);
          let targetAngle = rawAngle;
          if (snapEnabled) {
            const stepRad = THREE.MathUtils.degToRad(angleSnapDeg);
            targetAngle = Math.round(rawAngle / stepRad) * stepRad;
          }
          const deltaAngle = targetAngle - gd.lastAngle;
          if (deltaAngle !== 0) {
            gd.lastAngle = targetAngle;
            rotateVerticesAroundAxis(obj.meshData.vertices, gd.targetIndices, gd.pivot, gd.axisVec, deltaAngle);
          }
        }
        refreshObjectVisuals(obj);
        updateSelectionHighlight();
        updateGizmoTransform();
        return;
      }
      if (dragRef.current) {
        const d = dragRef.current;
        const obj = getObj(d.objId);
        if (!obj) { dragRef.current = null; return; }
        const ndc = ndcFromEvent(e, d.quadRect);
        raycasterRef.current.setFromCamera(ndc, d.cam);
        const hitPoint = new THREE.Vector3();
        if (raycasterRef.current.ray.intersectPlane(d.plane, hitPoint)) {
          const rawDelta = hitPoint.clone().sub(d.startPoint);
          d.indices.forEach((vi, idx) => obj.meshData.vertices[vi].copy(d.baseVerts[idx]).add(rawDelta));
          if (snapEnabled) snapVerticesRigidly(obj.meshData.vertices, d.indices, gridSize);
          refreshObjectVisuals(obj);
          updateSelectionHighlight();
          updateGizmoTransform();
        }
        return;
      }
      if (mouseButtonsRef.current.right) {
        const vp = viewportsRef.current.find((v) => v.id === activeViewportIdRef.current);
        if (vp) {
          if (vp.type === "persp") {
            vp.camera.userData.yaw -= e.movementX * 0.0035;
            vp.camera.userData.pitch = THREE.MathUtils.clamp(vp.camera.userData.pitch - e.movementY * 0.0035, -1.5, 1.5);
            if (container.__updatePerspLook) container.__updatePerspLook();
          } else {
            panOrthoCamera(vp, e.movementX, e.movementY);
          }
        }
        return;
      }
      if (mouseButtonsRef.current.middle) {
        const vp = viewportsRef.current.find((v) => v.id === activeViewportIdRef.current);
        if (vp) {
          if (vp.type === "persp") panPerspCamera(vp.camera, e.movementX, e.movementY);
          else panOrthoCamera(vp, e.movementX, e.movementY);
        }
        return;
      }
      // sem nenhum arraste/câmera em andamento: só resta atualizar o destaque de "mouse em cima"
      const info = getViewportAndNDC(e.clientX, e.clientY);
      let next = null;
      if (info) {
        const hit = pickElement(info);
        if (hit && hit.type === selMode) {
          if (hit.type === "vertex") next = { type: "vertex", index: hit.index };
          else if (hit.type === "edge") next = { type: "edge", a: hit.a, b: hit.b };
          else if (hit.type === "face") next = { type: "face", index: hit.index };
        }
      }
      const prev = hoverRef.current;
      const changed = !prev !== !next || (prev && next && (
        prev.type !== next.type || prev.index !== next.index || prev.a !== next.a || prev.b !== next.b
      ));
      if (changed) {
        hoverRef.current = next;
        updateHoverHighlight();
      }
    }

    function onPointerUp(e) {
      mouseButtonsRef.current.right = false;
      mouseButtonsRef.current.middle = false;
      mouseButtonsRef.current.left = false;
      paintSelectRef.current = null;
      if (paintTextureRef.current) { endTexturePaintSession(); return; }
      if (placementRef.current) {
        const p = placementRef.current;
        if (p.previewMesh) { sceneRef.current.remove(p.previewMesh); p.previewMesh.geometry.dispose(); p.previewMesh.material.dispose(); }
        const info = getViewportAndNDC(e.clientX, e.clientY);
        const endPoint = (info && groundPointFromInfo(info, p)) || p.lastPoint || p.startPoint;
        finalizePlacement(p.startPoint, endPoint, p.type, p.segments, p);
        placementRef.current = null;
        setPendingPrimitive(null);
      }
      // Shift+clique numa face/aresta já selecionada, sem virar um Shift+Arrastar
      // (extrude): resolve agora o toggle-off que tinha ficado pendente (ver onPointerDown)
      if (pendingShiftExtrudeRef.current && pendingShiftExtrudeRef.current.toggleOffIndex != null) {
        const p = pendingShiftExtrudeRef.current;
        const sel = selectionRef.current;
        if (sel && sel.type === "face") {
          const indices = sel.indices.filter((i) => i !== p.toggleOffIndex);
          selectionRef.current = indices.length ? { type: "face", indices } : null;
          setSelectionInfo(selectionRef.current ? { ...selectionRef.current } : null);
          updateSelectionHighlight();
          updateGizmoTransform();
        }
      }
      if (pendingShiftExtrudeRef.current && pendingShiftExtrudeRef.current.toggleOffEdge) {
        const p = pendingShiftExtrudeRef.current;
        const [ea, eb] = p.toggleOffEdge;
        const sel = selectionRef.current;
        if (sel && sel.type === "edge") {
          const pairs = sel.pairs.filter(([a, b]) => !((a === ea && b === eb) || (a === eb && b === ea)));
          selectionRef.current = pairs.length ? { type: "edge", pairs } : null;
          setSelectionInfo(selectionRef.current ? { ...selectionRef.current } : null);
          updateSelectionHighlight();
          updateGizmoTransform();
        }
      }
      // o encaixe na grade já acontece a cada frame durante o arraste (ver onPointerMove);
      // ao soltar o botão só falta limpar os estados ativos.
      pendingDragRef.current = null;
      pendingShiftExtrudeRef.current = null;
      dragRef.current = null;
      gizmoDragRef.current = null;
    }

    function onWheel(e) {
      const info = getViewportAndNDC(e.clientX, e.clientY);
      if (!info) return;
      e.preventDefault();
      const vp = info.vp;
      if (vp.type === "persp") {
        if (mouseButtonsRef.current.right) {
          vp.camera.userData.flySpeed = THREE.MathUtils.clamp(vp.camera.userData.flySpeed * (1 - e.deltaY * 0.001), 0.5, 60);
          setStatus(`Velocidade da câmera: ${vp.camera.userData.flySpeed.toFixed(1)} m/s`);
        } else {
          const fwd = new THREE.Vector3(); vp.camera.getWorldDirection(fwd);
          vp.camera.position.addScaledVector(fwd, -e.deltaY * 0.01);
        }
      } else {
        vp.camera.userData.size = THREE.MathUtils.clamp(vp.camera.userData.size * (1 + e.deltaY * 0.001), 0.3, 200);
      }
    }

    function onKeyDown(e) {
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      const k = e.key.toLowerCase();
      const flying = mouseButtonsRef.current.right && activeViewportIdRef.current === "persp";
      if (flying && ["w", "a", "s", "d", "q", "e", "shift"].includes(k)) {
        keysRef.current[k] = true;
        e.preventDefault();
        return;
      }
      if (!flying && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        if (handleArrowKey(e)) { e.preventDefault(); return; }
      }
      if (e.key === "[") { setGridIndex((i) => Math.max(0, i - 1)); e.preventDefault(); }
      else if (e.key === "]") { setGridIndex((i) => Math.min(GRID_SIZES.length - 1, i + 1)); e.preventDefault(); }
      else if (e.key === ";") { setAngleSnapDeg((v) => ANGLE_SNAPS[Math.max(0, ANGLE_SNAPS.indexOf(v) - 1)]); e.preventDefault(); }
      else if (e.key === "'") { setAngleSnapDeg((v) => ANGLE_SNAPS[Math.min(ANGLE_SNAPS.length - 1, ANGLE_SNAPS.indexOf(v) + 1)]); e.preventDefault(); }
      else if (e.key === " ") {
        e.preventDefault();
        setMaximizedViewport((prev) => {
          const next = prev ? null : activeViewportIdRef.current;
          maximizedRef.current = next;
          return next;
        });
      }
      else if (k === "t" && e.shiftKey) { e.preventDefault(); applySelectedMaterialToSelection(); }
      else if (k === "z" && e.ctrlKey && !e.shiftKey) { e.preventDefault(); undo(); }
      else if ((k === "z" && e.ctrlKey && e.shiftKey) || (k === "y" && e.ctrlKey)) { e.preventDefault(); redo(); }
      else if (k === "1") setSelMode(SELMODE.VERTEX);
      else if (k === "2") setSelMode(SELMODE.EDGE);
      else if (k === "3") setSelMode(SELMODE.FACE);
      else if (k === "4") setSelMode(SELMODE.MESH);
      else if (k === "q" && !e.ctrlKey) setActiveTool(TOOL.SCALE_DIR);
      else if (k === "w" && !e.ctrlKey) setActiveTool(TOOL.MOVE);
      else if (k === "r" && !e.ctrlKey) setActiveTool(TOOL.ROTATE);
      else if (k === "e" && e.ctrlKey) { e.preventDefault(); quickExtrudeWithGizmo(); }
      else if (k === "e" && !e.ctrlKey) setActiveTool(TOOL.SCALE);
      else if (k === "t" && !e.ctrlKey) setActiveTool(TOOL.MOVE);
      else if (k === "y") applyArcSel();
      else if (k === "f" && e.ctrlKey) { e.preventDefault(); handleCtrlF(); }
      else if (k === "f" && !e.ctrlKey) startBevelPreview();
      else if (e.key === "Enter" && bevelPreviewRef.current) confirmBevelPreview();
      else if (e.key === "Enter" && cuttingRef.current) { e.preventDefault(); finalizeCut(); }
      else if (k === "m") mergeSelectedVertices();
      else if (k === "b" && !e.ctrlKey) bridgeSelectedEdges();
      else if (k === "v" && !e.shiftKey) connectSelected();
      else if (k === "c" && !e.ctrlKey) startCutPicking();
      else if (e.key === "Delete" || e.key === "Backspace") deleteSelectionAction();
      else if (e.key === "Escape") {
        if (bevelPreviewRef.current) cancelBevelPreview();
        if (cuttingRef.current) cancelCut();
        setActiveTool(TOOL.MOVE);
        if (placementRef.current) {
          if (placementRef.current.previewMesh) { sceneRef.current.remove(placementRef.current.previewMesh); placementRef.current.previewMesh.geometry.dispose(); placementRef.current.previewMesh.material.dispose(); }
          placementRef.current = null;
        }
        setPendingPrimitive(null);
      }
      else if (k === "h") setShowHelp((s) => !s);
    }

    function onKeyUp(e) {
      const k = e.key.toLowerCase();
      if (["w", "a", "s", "d", "q", "e", "shift"].includes(k)) keysRef.current[k] = false;
    }

    function onPointerLeave() {
      if (hoverRef.current) { hoverRef.current = null; updateHoverHighlight(); }
    }

    dom.addEventListener("pointerdown", onPointerDown);
    dom.addEventListener("dblclick", onDoubleClick);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    dom.addEventListener("pointerleave", onPointerLeave);
    dom.addEventListener("wheel", onWheel, { passive: false });
    dom.addEventListener("contextmenu", (e) => e.preventDefault());
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    return () => {
      dom.removeEventListener("pointerdown", onPointerDown);
      dom.removeEventListener("dblclick", onDoubleClick);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("pointerup", onPointerUp);
      dom.removeEventListener("pointerleave", onPointerLeave);
      dom.removeEventListener("wheel", onWheel);
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("keyup", onKeyUp);
    };
  }, [selMode, activeTool, snapEnabled, gridSize, toolParams, angleSnapDeg, pendingPrimitive]);

  // ---------------------------------------------------------------------
  // UI
  // ---------------------------------------------------------------------
  const sel = getSelectedObj();
  const btnBase = "px-2 py-1.5 rounded text-xs font-medium border transition-colors whitespace-nowrap";
  const btnOff = "bg-neutral-800 border-neutral-700 text-neutral-300 hover:bg-neutral-700";
  const btnOn = "bg-amber-500 border-amber-400 text-neutral-900";

  return (
    <div className="w-full h-screen bg-neutral-950 text-neutral-200 flex flex-col select-none" style={{ fontFamily: "ui-sans-serif, system-ui" }}>
      {/* barra superior */}
      <div className="flex items-center gap-2 px-3 py-2 bg-neutral-900 border-b border-neutral-800">
        <span className="text-sm font-bold text-amber-400 tracking-wide mr-2">EDITOR 3D</span>
        <button className={`${btnBase} ${btnOff}`} onClick={() => document.getElementById("obj-import-input").click()}>Importar .obj</button>
        <input id="obj-import-input" type="file" accept=".obj" className="hidden" onChange={handleImportOBJ} />
        <button className={`${btnBase} ${btnOff}`} onClick={handleExportOBJ}>Exportar .obj</button>
        <button className={`${btnBase} ${btnOff}`} onClick={handleExportOBJWithTextures} title="Exporta .obj + .mtl + os arquivos de textura de cada material usado">Exportar c/ Texturas</button>
        <div className="w-px h-5 bg-neutral-700 mx-1" />
        <button className={`${btnBase} ${selMode === SELMODE.VERTEX ? btnOn : btnOff}`} onClick={() => setSelMode(SELMODE.VERTEX)}>Vértice (1)</button>
        <button className={`${btnBase} ${selMode === SELMODE.EDGE ? btnOn : btnOff}`} onClick={() => setSelMode(SELMODE.EDGE)}>Aresta (2)</button>
        <button className={`${btnBase} ${selMode === SELMODE.FACE ? btnOn : btnOff}`} onClick={() => setSelMode(SELMODE.FACE)}>Face (3)</button>
        <button className={`${btnBase} ${selMode === SELMODE.MESH ? btnOn : btnOff}`} onClick={() => setSelMode(SELMODE.MESH)}>Malha (4)</button>
        <div className="flex-1" />
        <button
          className={`${btnBase} ${btnOff} mr-2`}
          onClick={() => setMaximizedViewport((prev) => { const next = prev ? null : activeViewportIdRef.current; maximizedRef.current = next; return next; })}
        >{maximizedViewport ? "Restaurar 4 Janelas" : "Maximizar Viewport"} (Espaço)</button>
        <label className="flex items-center gap-1 text-xs text-neutral-400 mr-2">
          <input type="checkbox" checked={snapEnabled} onChange={(e) => setSnapEnabled(e.target.checked)} /> Ajustar à grade/ângulo
        </label>
        <span className="text-xs text-neutral-400 mr-2">Grade: {gridSize}m ([ ])</span>
        <div className="flex items-center gap-1 mr-2">
          <span className="text-xs text-neutral-400">Ângulo:</span>
          {ANGLE_SNAPS.map((deg) => (
            <button key={deg} className={`${btnBase} px-1.5 py-1 ${angleSnapDeg === deg ? btnOn : btnOff}`} onClick={() => setAngleSnapDeg(deg)}>{deg}°</button>
          ))}
          <span className="text-xs text-neutral-400">(; ')</span>
        </div>
        <button className={`${btnBase} ${btnOff}`} onClick={() => setShowHelp((s) => !s)}>Atalhos (H)</button>
      </div>

      <div className="flex flex-1 min-h-0">
        {/* barra lateral esquerda */}
        <div className="w-40 bg-neutral-900 border-r border-neutral-800 p-2 flex flex-col gap-3 overflow-y-auto">
          <div>
            <div className="text-[10px] uppercase tracking-wider text-neutral-500 mb-1">Adicionar</div>
            <div className="grid grid-cols-2 gap-1">
              {[["cubo", "Cubo"], ["plano", "Plano"], ["cilindro", "Cilindro"], ["esfera", "Esfera"]].map(([t, label]) => (
                <button
                  key={t}
                  className={`${btnBase} ${pendingPrimitive?.type === t ? btnOn : btnOff}`}
                  onClick={() => setPendingPrimitive((p) => (p && p.type === t ? null : { type: t, segments: primSegments }))}
                >{label}</button>
              ))}
            </div>
            {(pendingPrimitive?.type === "cilindro" || pendingPrimitive?.type === "esfera") && (
              <div className="mt-1">
                <label className="text-neutral-400 text-[10px]">Vértices/segmentos</label>
                <input
                  type="number" min="3" max="64" value={primSegments}
                  onChange={(e) => { const v = parseInt(e.target.value, 10) || 3; setPrimSegments(v); setPendingPrimitive((p) => (p ? { ...p, segments: v } : p)); }}
                  className="w-full bg-neutral-800 border border-neutral-700 rounded px-2 py-1"
                />
              </div>
            )}
            {pendingPrimitive && (
              <div className="text-[10px] text-amber-400 pt-1">Arraste na grade para definir o tamanho. Esc cancela.</div>
            )}
          </div>
          <div>
            <div className="text-[10px] uppercase tracking-wider text-neutral-500 mb-1">Ferramentas</div>
            <div className="flex flex-col gap-1">
              <button className={`${btnBase} ${activeTool === TOOL.MOVE ? btnOn : btnOff}`} onClick={() => setActiveTool(TOOL.MOVE)}>Mover (W / T)</button>
              <button className={`${btnBase} ${activeTool === TOOL.ROTATE ? btnOn : btnOff}`} onClick={() => setActiveTool(TOOL.ROTATE)}>Girar (R)</button>
              <button className={`${btnBase} ${activeTool === TOOL.SCALE ? btnOn : btnOff}`} onClick={() => setActiveTool(TOOL.SCALE)}>Escalar (E)</button>
              <button className={`${btnBase} ${activeTool === TOOL.SCALE_DIR ? btnOn : btnOff}`} onClick={() => setActiveTool(TOOL.SCALE_DIR)}>Escalar Direcional (Q)</button>
              <button className={`${btnBase} ${activeTool === TOOL.EXTRUDE ? btnOn : btnOff}`} onClick={() => setActiveTool(TOOL.EXTRUDE)}>Extrudar (Ctrl+E)</button>
              <div className="h-px bg-neutral-700 my-1" />
              <button className={`${btnBase} ${bevelPreviewInfo ? btnOn : btnOff}`} onClick={startBevelPreview}>{bevelPreviewInfo ? "Bisel: F confirma" : "Bisel (F)"}</button>
              <button className={`${btnBase} ${btnOff}`} onClick={startCutPicking}>Corte (C)</button>
              <button className={`${btnBase} ${btnOff}`} onClick={applyArcSel}>Arco de Aresta (Y)</button>
              <button className={`${btnBase} ${btnOff}`} onClick={mergeSelectedVertices}>Fundir / Merge (M)</button>
              <button className={`${btnBase} ${btnOff}`} onClick={bridgeSelectedEdges}>Bridge (B)</button>
              <button className={`${btnBase} ${btnOff}`} onClick={connectSelected}>Conectar (V)</button>
              <button className={`${btnBase} ${btnOff}`} onClick={handleCtrlF}>Cortar/Espelhar (Ctrl+F)</button>
              <div className="h-px bg-neutral-700 my-1" />
              <button className={`${btnBase} bg-red-950 border-red-900 text-red-300 hover:bg-red-900`} onClick={deleteSelectionAction}>Excluir (Delete/Backspace)</button>
            </div>
          </div>
        </div>

        {/* viewport (4 painéis: Perspectiva / Superior / Frente / Lado) */}
        <div className="flex-1 relative bg-neutral-950" onContextMenu={(e) => e.preventDefault()} onDragOver={(e) => e.preventDefault()} onDrop={handleViewportDrop}>
          <div ref={mountRef} className="absolute inset-0" />
          {!maximizedViewport && (
            <>
              <div className="absolute left-1/2 top-0 bottom-0 w-px bg-neutral-700/70 pointer-events-none" />
              <div className="absolute top-1/2 left-0 right-0 h-px bg-neutral-700/70 pointer-events-none" />
            </>

          {VIEWPORT_LAYOUT.map((v) => {

            const rect = maximizedViewport ? { left: "0%", top: "0%", width: "100%", height: "100%" } : v.rect;
            return (
              <div key={v.id} className="absolute pointer-events-none" style={rect}>

                  {v.label}
                </div>
                {activeViewportId === v.id && <div className="absolute inset-0 border border-amber-500/60" />}
              </div>
            );
          })}
          {showHelp && (
            <div className="absolute top-3 right-3 w-80 bg-neutral-900/95 border border-neutral-700 rounded-lg p-3 text-xs text-neutral-300 space-y-1 shadow-xl pointer-events-none">

              <div>Perspectiva: segure o botão direito para olhar ao redor + WASD para voar, Q/E desce/sobe, Shift acelera</div>
              <div>Vistas 2D (Superior/Frente/Lado): botão direito ou do meio + arrastar = pan</div>
              <div>Espaço: maximizar viewport · [ / ]: grade · ; / ': ângulo de giro · Ctrl+Z / Ctrl+Y: desfazer/refazer</div>
              <div>1/2/3/4: vértice / aresta / face / malha inteira (sempre disponíveis, sem precisar trocar de modo)</div>
              <div>Shift+clique: soma/remove da seleção · Duplo-clique numa face: seleciona o bloco conectado · Shift+Duplo-clique: seleciona o loop entre o clique anterior e este</div>
              <div>Clique sempre seleciona, em qualquer ferramenta · W/T Mover · R Girar · E Escalar · Q Escalar Direcional (um lado por vez)</div>
              <div>Shift+Arrastar com Mover/Girar/Escalar ativo: extruda a face selecionada (ou clona o objeto no modo 4) e já transforma de acordo com a ferramenta</div>
              <div>F Bisel (vértice ou aresta selecionada) · Y Arco (aresta) · M Fundir · B Bridge · V Conectar (vértices ou arestas) · Ctrl+F Cortar/Espelhar · Shift+T Aplica o material em destaque (aba Textura) à(s) face(s) selecionada(s)</div>
              <div>C Corte: com uma face, clique em 2 pontos para traçar a linha e Enter corta; com uma aresta, clique num ponto e Enter insere um vértice ali. Esc cancela</div>
              <div>Arraste as setas/anéis/cubos do gizmo para mover, girar (passos de {angleSnapDeg}°) ou escalar</div>
              <div>Delete ou Backspace: excluir/dissolver a seleção (vértice, aresta, face ou objeto) · Esc: cancelar ferramenta</div>
              <div className="pt-1 text-neutral-500">Bisel, Corte, Arco, Fundir, Bridge e Conectar são versões básicas — funcionam melhor em geometrias simples.</div>
            </div>
          )}
          <div className="absolute bottom-2 left-3 text-[11px] text-neutral-500 bg-neutral-900/80 px-2 py-1 rounded pointer-events-none">
            Seleção: {selMode} · Viewport: {(VIEWPORT_LAYOUT.find((v) => v.id === activeViewportId) || {}).label} · Ferramenta: {activeTool} · {status}
          </div>
        </div>

        {/* painel direito */}
        <div className="w-72 bg-neutral-900 border-l border-neutral-800 flex flex-col overflow-hidden">
          <div className="flex border-b border-neutral-800">
            {[["props", "Objetos"], ["material", "Textura"]].map(([k, label]) => (
              <button key={k} className={`flex-1 py-2 text-xs font-medium ${rightTab === k ? "bg-neutral-800 text-amber-400" : "text-neutral-400 hover:bg-neutral-800/50"}`} onClick={() => setRightTab(k)}>{label}</button>
            ))}
          </div>
          <div className="flex-1 overflow-y-auto p-3 text-xs space-y-4">
            {rightTab === "props" && (
              <>
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-neutral-500 mb-1">Objetos na cena</div>
                  <div className="space-y-1">
                    {objectsList.length === 0 && <div className="text-neutral-600">Nenhum objeto ainda. Use "Adicionar" à esquerda.</div>}
                    {objectsList.map((o) => (
                      <div key={o.id} className={`flex items-center justify-between px-2 py-1 rounded cursor-pointer ${selectedId === o.id ? "bg-amber-500/20 text-amber-300" : "bg-neutral-800 hover:bg-neutral-750"}`} onClick={() => selectObject(o.id)}>
                        <span>{o.name}</span>
                        {selectedId != null && selectedId !== o.id && (
                          <button
                            title={`Fundir "${o.name}" no objeto selecionado`}
                            className="shrink-0 w-5 h-5 flex items-center justify-center rounded bg-neutral-700 text-neutral-300 hover:bg-amber-500 hover:text-neutral-900"
                            onClick={(e) => { e.stopPropagation(); mergeObjectInto(o.id); }}
                          >+</button>
                        )}
                      </div>
                    ))}
                  </div>
                  {selectedId != null && objectsList.length > 1 && (
                    <div className="text-neutral-500 pt-1">Clique no "+" de outro objeto pra fundi-lo no objeto selecionado ({(objectsList.find((o) => o.id === selectedId) || {}).name}).</div>
                  )}
                </div>
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-neutral-500 mb-1">Ferramenta ativa</div>
                  {activeTool === TOOL.EXTRUDE && (
                    <div className="space-y-1">
                      <label className="text-neutral-400">Distância</label>
                      <input type="number" step="0.05" value={toolParams.extrudeDist} onChange={(e) => setToolParams((p) => ({ ...p, extrudeDist: parseFloat(e.target.value) || 0 }))} className="w-full bg-neutral-800 border border-neutral-700 rounded px-2 py-1" />
                      <button className={`${btnBase} ${btnOn} w-full`} onClick={applyExtrudeSel}>Aplicar Extrusão</button>
                      <div className="text-neutral-500 pt-1">Shift+Arrastar com Mover/Girar/Escalar ativo estica uma parede nova a partir da face selecionada. No modo Malha (4), Shift+Arrastar clona o objeto. Ctrl+E é o atalho rápido com gizmo.</div>
                    </div>
                  )}
                  {activeTool === TOOL.SCALE && (
                    <div className="space-y-1">
                      <label className="text-neutral-400">Fator de escala</label>
                      <input type="number" step="0.1" value={toolParams.scaleFactor} onChange={(e) => setToolParams((p) => ({ ...p, scaleFactor: parseFloat(e.target.value) || 1 }))} className="w-full bg-neutral-800 border border-neutral-700 rounded px-2 py-1" />
                      <button className={`${btnBase} ${btnOn} w-full`} onClick={applyScaleSel}>Aplicar Escala</button>
                      <div className="text-neutral-500 pt-1">Ou arraste um cubo colorido do gizmo (X/Y/Z) para esticar/encolher em um eixo.</div>
                    </div>
                  )}
                  {activeTool === TOOL.ROTATE && (
                    <div className="space-y-1">
                      <label className="text-neutral-400">Ângulo por passo</label>
                      <div className="grid grid-cols-3 gap-1">
                        {ANGLE_SNAPS.map((deg) => (
                          <button key={deg} className={`${btnBase} ${angleSnapDeg === deg ? btnOn : btnOff}`} onClick={() => setAngleSnapDeg(deg)}>{deg}°</button>
                        ))}
                      </div>
                      <button className={`${btnBase} ${btnOn} w-full`} onClick={applyRotateSel}>Aplicar Rotação ({angleSnapDeg}°)</button>
                      <div className="text-neutral-500 pt-1">Ou arraste um anel colorido do gizmo na viewport — a rotação encaixa em passos de {angleSnapDeg}° (ajuste com ; e ').</div>
                    </div>
                  )}
                  {activeTool === TOOL.MOVE && <div className="text-neutral-400">Clique sempre seleciona (Shift+clique soma/remove). Arraste uma seta colorida do gizmo (X/Y/Z) para mover em um eixo, ou arraste o próprio elemento para mover livremente no plano da câmera. Mover o objeto inteiro só funciona no modo Malha (4).</div>}
                </div>
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-neutral-500 mb-1">Bisel (F) — vértices (1) ou arestas (2)</div>
                  <div className="space-y-2">
                    <div>
                      <label className="text-neutral-400 flex justify-between"><span>Steps</span><span>{toolParams.bevelSteps}</span></label>
                      <input type="range" min="1" max="8" step="1" value={toolParams.bevelSteps} onChange={(e) => setToolParams((p) => ({ ...p, bevelSteps: parseInt(e.target.value, 10) || 1 }))} className="w-full" />
                    </div>
                    <div>
                      <label className="text-neutral-400 flex justify-between"><span>Shape</span><span>{toolParams.bevelShape.toFixed(2)}</span></label>
                      <input type="range" min="0" max="1" step="0.01" value={toolParams.bevelShape} onChange={(e) => setToolParams((p) => ({ ...p, bevelShape: parseFloat(e.target.value) }))} className="w-full" />
                    </div>
                    <div>
                      <label className="text-neutral-400 flex justify-between"><span>Width</span><span>{toolParams.bevelWidth.toFixed(2)}</span></label>
                      <input type="range" min="0.01" max="1" step="0.01" value={toolParams.bevelWidth} onChange={(e) => setToolParams((p) => ({ ...p, bevelWidth: parseFloat(e.target.value) || 0 }))} className="w-full" />
                    </div>
                    {bevelPreviewInfo ? (
                      <div className="flex gap-1">
                        <button className={`${btnBase} ${btnOn} flex-1`} onClick={confirmBevelPreview}>Confirmar (Enter)</button>
                        <button className={`${btnBase} bg-red-950 border-red-900 text-red-300 hover:bg-red-900 flex-1`} onClick={cancelBevelPreview}>Cancelar (Esc)</button>
                      </div>
                    ) : (
                      <button className={`${btnBase} ${btnOn} w-full`} onClick={startBevelPreview}>Iniciar Bisel (F)</button>
                    )}
                  </div>
                </div>
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-neutral-500 mb-1">Arco de Aresta (Y) — arestas (2)</div>
                  <div className="space-y-1">
                    <label className="text-neutral-400">Segmentos</label>
                    <input type="number" min="2" max="16" value={toolParams.arcSegments} onChange={(e) => setToolParams((p) => ({ ...p, arcSegments: parseInt(e.target.value) || 2 }))} className="w-full bg-neutral-800 border border-neutral-700 rounded px-2 py-1" />
                    <label className="text-neutral-400">Curvatura</label>
                    <input type="number" step="0.05" value={toolParams.arcBulge} onChange={(e) => setToolParams((p) => ({ ...p, arcBulge: parseFloat(e.target.value) || 0 }))} className="w-full bg-neutral-800 border border-neutral-700 rounded px-2 py-1" />
                    <button className={`${btnBase} ${btnOn} w-full`} onClick={applyArcSel}>Aplicar Arco (Y)</button>
                  </div>
                </div>
              </>
            )}

            {rightTab === "material" && (() => {
              const userMats = materialsRef.current.filter((m) => !m.builtin);
              const faceSel = selectionInfo && selectionInfo.type === "face" && selectionInfo.indices.length ? selectionInfo : null;
              const faceXf = sel && faceSel ? sel.faceMaterials.get(faceSel.indices[0]) : null;
              const faceXfMatName = faceXf ? ((materialsRef.current.find((m) => m.id === faceXf.materialId) || {}).name || "?") : null;
              return (
                <>
                  <div className="text-[10px] uppercase tracking-wider text-neutral-500 flex items-center justify-between">
                    <span>Materiais</span>
                    <button
                      className={`${btnBase} ${btnOff} !px-1.5 !py-0.5`}
                      onClick={() => { const entry = createMaterialEntry("Material"); setMaterialEditor({ mode: "edit", matId: entry.id }); }}
                    >+ Novo</button>
                  </div>
                  <div className="grid grid-cols-4 gap-1.5">
                    {userMats.map((m) => (
                      <div
                        key={m.id}
                        draggable
                        onDragStart={(e) => { e.dataTransfer.setData("text/plain", m.id); draggingMaterialIdRef.current = m.id; }}
                        onDragEnd={() => { draggingMaterialIdRef.current = null; }}
                        onClick={() => selectMaterial(m.id)}
                        onDoubleClick={() => setMaterialEditor({ mode: "edit", matId: m.id })}
                        title={m.name + " — clique pra selecionar, duplo-clique pra editar, arraste pra uma face"}
                        className={`relative aspect-square rounded overflow-hidden cursor-pointer border-2 ${selectedMaterialIdRef.current === m.id ? "border-amber-400" : "border-neutral-700 hover:border-neutral-500"}`}
                      >
                        {m.slots.albedo
                          ? <img src={m.slots.albedo.url} className="w-full h-full object-cover pointer-events-none" draggable={false} />
                          : <div className="w-full h-full" style={{ background: "#" + m.threeMaterial.color.getHexString() }} />}
                        <div className="absolute bottom-0 inset-x-0 bg-black/70 text-[9px] text-center truncate px-0.5 leading-tight py-px">{m.name}</div>
                      </div>
                    ))}
                    {userMats.length === 0 && <div className="col-span-4 text-neutral-500">Nenhum material ainda — clique em "+ Novo".</div>}
                  </div>
                  <div className="text-neutral-500 pt-1">
                    Shift+T aplica o material em destaque à(s) face(s) selecionada(s) (tecla 3) — ou arraste o material da galeria pra cima de uma face na viewport.
                  </div>
                  <button className={`${btnBase} ${btnOn} w-full`} disabled={!selectedMaterialIdRef.current} onClick={applySelectedMaterialToSelection}>Aplicar à face selecionada (Shift+T)</button>

                  {faceXf && (
                    <div className="pt-2 border-t border-neutral-800 space-y-2">
                      <div className="text-[10px] uppercase tracking-wider text-neutral-500">UV da face — {faceXfMatName}</div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-neutral-400 flex justify-between"><span>Escala U</span><span>{faceXf.uScale.toFixed(2)}</span></label>
                          <input type="range" min="0.1" max="5" step="0.05" value={faceXf.uScale} onChange={(e) => updateSelectedFaceUV("uScale", parseFloat(e.target.value))} className="w-full" />
                        </div>
                        <div>
                          <label className="text-neutral-400 flex justify-between"><span>Escala V</span><span>{faceXf.vScale.toFixed(2)}</span></label>
                          <input type="range" min="0.1" max="5" step="0.05" value={faceXf.vScale} onChange={(e) => updateSelectedFaceUV("vScale", parseFloat(e.target.value))} className="w-full" />
                        </div>
                      </div>
                      <div>
                        <label className="text-neutral-400 flex justify-between"><span>Rotação</span><span>{Math.round(faceXf.rotation * 180 / Math.PI)}°</span></label>
                        {/* em graus inteiros, não radianos: 2π/0.01 não é múltiplo exato,
                        então nenhuma posição do slider batia certinho em 90°/180°/270° —
                        só chegava perto (1.57 ou 1.58 rad, nunca π/2 exato) */}
                        <input
                          type="range" min="0" max="360" step="1"
                          value={Math.round(faceXf.rotation * 180 / Math.PI)}
                          onChange={(e) => updateSelectedFaceUV("rotation", parseFloat(e.target.value) * Math.PI / 180)}
                          className="w-full"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-neutral-400 flex justify-between"><span>Deslocar U</span><span>{faceXf.uOffset.toFixed(2)}</span></label>
                          <input type="range" min="-2" max="2" step="0.02" value={faceXf.uOffset} onChange={(e) => updateSelectedFaceUV("uOffset", parseFloat(e.target.value))} className="w-full" />
                        </div>
                        <div>
                          <label className="text-neutral-400 flex justify-between"><span>Deslocar V</span><span>{faceXf.vOffset.toFixed(2)}</span></label>
                          <input type="range" min="-2" max="2" step="0.02" value={faceXf.vOffset} onChange={(e) => updateSelectedFaceUV("vOffset", parseFloat(e.target.value))} className="w-full" />
                        </div>
                      </div>
                    </div>
                  )}
                  {faceSel && !faceXf && (
                    <div className="text-neutral-500 pt-1">A face selecionada ainda não tem material — aplique um acima pra poder ajustar o UV dela.</div>
                  )}

                  <div className="pt-2 border-t border-neutral-800 space-y-1">
                    <button className={`${btnBase} ${btnOff} w-full`} disabled={!sel} onClick={() => generateUVMap(sel)}>Gerar UV Map</button>
                    <div className="text-neutral-500">Confirma o UV final do objeto (todas as faces, com seus materiais e ajustes já integrados) — use antes de exportar.</div>
                    <button className={`${btnBase} ${btnOn} w-full`} onClick={handleExportOBJWithTextures}>Exportar .obj + .mtl + Texturas</button>
                    <div className="text-neutral-500">Baixa o .obj, um .mtl com os materiais (cor/rugosidade/metalicidade) e os arquivos de imagem de cada textura usada — deixe todos na mesma pasta ao importar em outro programa.</div>
                  </div>
                </>
              );
            })()}
          </div>
        </div>
      </div>
      {materialEditor && (() => {
        const entry = materialsRef.current.find((m) => m.id === materialEditor.matId);
        if (!entry) return null;
        const close = () => setMaterialEditor(null);
        return (
          <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50" onClick={close}>
            <div className="w-96 bg-neutral-900 border border-neutral-700 rounded-lg p-4 space-y-3 text-xs" onClick={(e) => e.stopPropagation()}>
              <div className="flex items-center justify-between">
                <input
                  className="bg-neutral-800 border border-neutral-700 rounded px-2 py-1 text-sm font-medium flex-1 mr-2"
                  value={entry.name}
                  onChange={(e) => renameMaterial(entry.id, e.target.value)}
                />
                <button className={`${btnBase} ${btnOff}`} onClick={close}>Fechar</button>
              </div>
              <div className="grid grid-cols-2 gap-2">
                {[["albedo", "Cor Base"], ["normal", "Normal"], ["roughness", "Rugosidade"], ["displacement", "Deslocamento"]].map(([slot, label]) => (
                  <div key={slot} className="space-y-1 bg-neutral-800/60 rounded p-2">
                    <label className="text-neutral-400">{label}</label>
                    <input
                      type="file" accept="image/*"
                      className="w-full text-[10px] file:mr-1 file:px-1.5 file:py-0.5 file:rounded file:border-0 file:bg-neutral-700 file:text-neutral-300"
                      onChange={(e) => e.target.files[0] && updateMaterialSlot(entry.id, slot, e.target.files[0])}
                    />
                    {entry.slots[slot] && <div className="text-[10px] text-emerald-400 truncate">✓ {entry.slots[slot].name}</div>}
                  </div>
                ))}
              </div>
              <div className="space-y-2 pt-1 border-t border-neutral-800">
                <div>
                  <label className="text-neutral-400 flex justify-between"><span>Rugosidade</span><span>{entry.roughness.toFixed(2)}</span></label>
                  <input type="range" min="0" max="1" step="0.01" value={entry.roughness} onChange={(e) => updateMaterialParam(entry.id, "roughness", parseFloat(e.target.value))} className="w-full" />
                </div>
                <div>
                  <label className="text-neutral-400 flex justify-between"><span>Metalicidade</span><span>{entry.metalness.toFixed(2)}</span></label>
                  <input type="range" min="0" max="1" step="0.01" value={entry.metalness} onChange={(e) => updateMaterialParam(entry.id, "metalness", parseFloat(e.target.value))} className="w-full" />
                </div>
                <div>
                  <label className="text-neutral-400 flex justify-between"><span>Força do Deslocamento</span><span>{entry.dispScale.toFixed(3)}</span></label>
                  <input type="range" min="0" max="0.3" step="0.005" value={entry.dispScale} onChange={(e) => updateMaterialParam(entry.id, "dispScale", parseFloat(e.target.value))} className="w-full" />
                  {entry.slots.displacement && (
                    <div className="text-amber-500/90 text-[10px] leading-snug pt-1">
                      Deslocamento empurra os vértices de verdade — como as faces aqui não têm subdivisão (só os cantos), valores altos arrancam a face do lugar em vez de dar um relevo sutil. Se a geometria "quebrar" ao aplicar, abaixe este valor.
                    </div>
                  )}
                </div>
              </div>
              <button className={`${btnBase} ${btnOn} w-full`} onClick={close}>Concluído</button>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
